services:
  postgres:
    image: postgres:16-alpine
    container_name: refertium-postgres
    environment:
      POSTGRES_DB: refertium
      POSTGRES_USER: refertium
      POSTGRES_PASSWORD: refertium_dev_password
    ports:
      - "55432:5432"
    volumes:
      - refertium-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U refertium -d refertium"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  refertium-postgres-data:
