<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Refertium International — Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  /* ============================================================
     Refertium International — Design System
     (navy + verde acqua + bianco, EB Garamond + Inter)
     ============================================================ */
  :root {
    color-scheme: dark;
    --bg:           #050d1a;
    --bg-elevated:  #0a1628;
    --panel:        #0a1628;
    --panel-2:      #112340;
    --panel-hover:  rgba(93, 202, 165, 0.08);
    --line:         #1f3a5e;
    --line-strong:  #2c4a76;
    --line-focus:   rgba(93, 202, 165, 0.50);

    --text:         #e8edf5;
    --text-strong:  #ffffff;
    --text-dim:     #8a9ab5;
    --muted:        #5a6a85;

    --accent:       #5DCAA5;
    --accent-strong:#7ed8b8;
    --accent-soft:  rgba(93, 202, 165, 0.12);
    --accent-ink:   #050d1a;

    --warn:         #f4c065;
    --danger:       #e07070;

    --shadow:       0 4px 12px -2px rgba(0, 0, 0, 0.4);
    --shadow-lg:    0 12px 32px -6px rgba(0, 0, 0, 0.55);

    --radius:       10px;
    --radius-sm:    8px;
    --radius-lg:    14px;
    --ease:         cubic-bezier(0.16, 1, 0.3, 1);
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: "Inter", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    font-size: 14px;
    line-height: 1.6;
    letter-spacing: -0.005em;
  }
  ::selection { background: var(--accent); color: var(--accent-ink); }

  .app { display: flex; flex-direction: column; min-height: 100vh; }

  /* ─── Top bar ─── */
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px; padding: 14px 24px;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
  }
  .brand {
    display: inline-flex; align-items: baseline; gap: 6px;
    font-family: "EB Garamond", serif;
  }
  .brand-mark {
    font-size: 22px; font-weight: 600; color: var(--text-strong);
    letter-spacing: 0.01em;
  }
  .brand-mark .accent { color: var(--accent); }
  .brand-suffix {
    font-style: italic; font-size: 18px; font-weight: 500;
    color: var(--accent); letter-spacing: 0.005em;
  }

  .lang-chip {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 6px 14px 6px 14px;
    border-radius: 999px;
    background: var(--accent-soft);
    border: 1px solid var(--line-strong);
    color: var(--text);
    font-size: 12.5px; cursor: pointer;
    transition: background 150ms var(--ease), border-color 150ms var(--ease);
  }
  .lang-chip:hover { background: rgba(93,202,165,0.18); border-color: var(--accent); }
  .lang-chip .label {
    color: var(--accent); font-weight: 700;
    font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase;
  }
  .lang-chip .flag {
    font-size: 14px; line-height: 1;
    display: inline-block; margin-right: -2px;
    /* Mantiene proporzioni emoji bandiera su tutti i browser */
  }
  .lang-chip .value { color: var(--text-strong); font-weight: 600; }
  .lang-chip .caret {
    width: 0; height: 0;
    border-left: 4px solid transparent; border-right: 4px solid transparent;
    border-top: 5px solid var(--text-dim);
  }
  .dd-item .flag {
    font-size: 16px; line-height: 1;
    display: inline-block; min-width: 22px;
  }

  /* ─── Toolbar ─── */
  .toolbar {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
    padding: 10px 24px;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
    position: sticky; top: 0; z-index: 10;
  }
  .tool-group {
    display: flex; align-items: center; gap: 4px;
    padding: 0 6px; border-right: 1px solid var(--line);
  }
  .tool-group:last-child { border-right: none; }
  .tbtn {
    display: inline-flex; align-items: center; gap: 6px;
    height: 34px; padding: 0 12px;
    border-radius: var(--radius-sm);
    background: transparent; color: var(--text);
    border: 1px solid transparent; cursor: pointer;
    font: inherit; font-size: 13px; font-weight: 500;
    transition: background 150ms var(--ease), border-color 150ms var(--ease), color 150ms var(--ease);
  }
  .tbtn:hover { background: var(--panel-hover); }
  .tbtn.active {
    background: var(--accent-soft); color: var(--accent);
    border-color: var(--accent);
  }
  .tbtn.primary {
    background: var(--accent); color: var(--accent-ink);
    font-weight: 600;
  }
  .tbtn.primary:hover { background: var(--accent-strong); }
  .tbtn.danger { color: var(--danger); }
  .tbtn.danger:hover { background: rgba(224,112,112,0.10); }
  .tbtn:disabled { opacity: 0.5; cursor: not-allowed; }
  .tbtn svg { width: 16px; height: 16px; }

  .rec-dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--danger);
    animation: pulse 1.2s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(0.85); }
  }
  .rec-timer {
    font-variant-numeric: tabular-nums;
    color: var(--text-dim); font-size: 12px;
    min-width: 36px;
  }

  /* ─── Status bar ─── */
  .statusbar {
    padding: 8px 24px; border-bottom: 1px solid var(--line);
    background: var(--panel-2); display: none;
    align-items: center; gap: 10px;
    font-size: 12.5px; color: var(--text-dim);
  }
  .statusbar.visible { display: flex; }
  .statusbar .spin {
    width: 12px; height: 12px;
    border: 2px solid var(--line-strong);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  .statusbar.err { color: var(--danger); }
  .statusbar.ok { color: var(--accent); }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ─── Workspace ─── */
  .workspace { flex: 1; display: flex; overflow: hidden; }
  .editor-wrap {
    flex: 1; overflow-y: auto;
    padding: 32px 24px 80px;
    background:
      radial-gradient(1200px 600px at 50% -200px, rgba(93,202,165,0.04), transparent 60%),
      var(--bg);
  }
  .paper {
    max-width: 880px; margin: 0 auto;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow);
    padding: 56px 64px; min-height: 70vh;
    transition: box-shadow 200ms var(--ease);
  }
  .paper:focus-within { box-shadow: var(--shadow-lg); border-color: var(--line-strong); }
  .editor {
    font-family: "EB Garamond", Georgia, serif;
    font-size: 17px; line-height: 1.75;
    color: var(--text); min-height: 60vh;
    outline: none; white-space: pre-wrap; word-wrap: break-word;
  }
  .editor p { margin: 0 0 1em; }
  .editor strong { color: var(--text-strong); font-weight: 600; }

  /* ─── AI Preview panel ─── */
  .ai-preview {
    max-width: 880px; margin: 16px auto 0;
    border: 1px solid var(--accent);
    background: var(--panel);
    border-radius: var(--radius-lg);
    overflow: hidden; box-shadow: var(--shadow);
    display: none;
  }
  .ai-preview.visible { display: block; }
  .ai-preview-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 20px;
    background: var(--accent-soft);
    border-bottom: 1px solid var(--accent);
  }
  .ai-preview-title {
    color: var(--accent); font-weight: 600;
    font-size: 13px; display: flex; align-items: center; gap: 8px;
  }
  .ai-preview-actions { display: flex; gap: 8px; }
  .ai-preview-body {
    padding: 20px 24px;
    font-family: "EB Garamond", serif;
    font-size: 16px; line-height: 1.7;
    color: var(--text);
    max-height: 50vh; overflow-y: auto;
    white-space: pre-wrap;
  }
  .stream-cursor {
    display: inline-block; width: 2px; height: 1em;
    background: var(--accent);
    animation: blink 0.8s infinite;
    vertical-align: text-bottom; margin-left: 1px;
  }
  @keyframes blink { 50% { opacity: 0; } }

  /* ─── Dropdown (lang select + export lang) ─── */
  .dd { position: relative; }
  .dd-menu {
    position: absolute; top: calc(100% + 6px); right: 0;
    min-width: 240px;
    background: var(--panel);
    border: 1px solid var(--line-strong);
    border-radius: var(--radius);
    box-shadow: var(--shadow-lg);
    padding: 6px; z-index: 50;
    display: none;
  }
  .dd-menu-left { right: auto; left: 0; }
  .dd-menu.open { display: block; }
  .dd-menu .dd-head {
    font-size: 10.5px; font-weight: 700;
    letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--text-dim); padding: 8px 10px 4px;
  }
  .dd-item {
    display: flex; align-items: center; gap: 10px;
    width: 100%; padding: 9px 10px;
    background: transparent; border: 0;
    color: var(--text); font: inherit; font-size: 13.5px;
    text-align: left; cursor: pointer; border-radius: 6px;
    transition: background 120ms var(--ease);
  }
  .dd-item:hover { background: var(--panel-hover); color: var(--text-strong); }
  .dd-item.selected { background: var(--accent-soft); color: var(--accent-strong); }
  .dd-item .code {
    font-family: "Inter", sans-serif; font-weight: 700;
    color: var(--accent); font-size: 10.5px;
    letter-spacing: 0.08em; min-width: 24px;
  }

  /* ─── Modale ─── */
  .modal-backdrop {
    position: fixed; inset: 0;
    background: rgba(5, 13, 26, 0.7);
    backdrop-filter: blur(4px);
    z-index: 100; display: none;
    align-items: center; justify-content: center;
    padding: 20px;
  }
  .modal-backdrop.visible { display: flex; }
  .modal {
    width: 100%; max-width: 520px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-lg);
    padding: 24px;
  }
  .modal h3 {
    margin: 0 0 16px; color: var(--text-strong);
    font-size: 17px; font-weight: 600;
  }
  .modal label {
    display: block; font-size: 13px;
    color: var(--text-dim); margin-bottom: 6px;
    font-weight: 500;
  }
  .modal textarea, .modal input[type="text"] {
    width: 100%; padding: 10px 12px;
    border-radius: var(--radius-sm);
    background: var(--bg-elevated);
    color: var(--text);
    border: 1px solid var(--line-strong);
    font: inherit; font-size: 14px;
    resize: vertical; outline: none;
    transition: border-color 150ms var(--ease), box-shadow 150ms var(--ease);
  }
  .modal textarea:focus, .modal input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  .modal-actions {
    display: flex; justify-content: flex-end; gap: 8px;
    margin-top: 16px;
  }

  .sep { flex: 1; }

  .toast {
    position: fixed; bottom: 24px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    padding: 12px 20px;
    background: var(--panel);
    border: 1px solid var(--accent);
    border-radius: var(--radius);
    box-shadow: var(--shadow-lg);
    color: var(--text); font-size: 13px;
    z-index: 200; opacity: 0;
    transition: all 250ms var(--ease);
    pointer-events: none;
  }
  .toast.visible { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.err { border-color: var(--danger); color: var(--danger); }

  /* ─── Checklist module ─── */
          esistente o in nuovo blocco
       2) HTML markup — bottone toolbar + aside drawer
       3) Script JS — wire del drawer + CHECKLIST_TEMPLATES data

     Dipendenze:
       - var CHECKLIST_TEMPLATES (in JS) — i 49 esami strutturati
       - window functions: streamChatCompletion(payload, onDelta)
       - window helpers (opzionali): insertIntoEditor, getEditorText
============================================================ -->

  /* ─── Bottone toolbar "Checklist" ─── */
  .cl-toggle {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    height: 34px;
    padding: 0 12px;
    border-radius: 8px;
    background: transparent;
    color: var(--text, #e8edf5);
    border: 1px solid transparent;
    cursor: pointer;
    font: inherit;
    font-size: 13px;
    font-weight: 500;
    transition: background 150ms cubic-bezier(.16,1,.3,1), border-color 150ms;
  }
  .cl-toggle:hover { background: var(--panel-hover, rgba(93,202,165,.08)); }
  .cl-toggle.active {
    background: var(--accent-soft, rgba(93,202,165,.12));
    color: var(--accent, #5DCAA5);
    border-color: var(--accent, #5DCAA5);
  }
  .cl-toggle svg { width: 16px; height: 16px; }

  /* ─── Backdrop (non più usato in modalità inline, mantenuto per retro-compat) ─── */
  .cl-backdrop { display: none; }

  /* ─── Pannello checklist INLINE accanto all'editor ─────────
     Non è più un drawer overlay: vive dentro al workspace flex,
     occupa width 0 quando chiuso e una porzione fissa quando aperto.
     L'editor a sinistra si rimpicciolisce automaticamente. */
  .cl-drawer {
    flex-shrink: 0;
    width: 0;
    overflow: hidden;
    background: var(--panel-2, #112340);
    border-left: 1px solid var(--line-strong, #2c4a76);
    display: flex; flex-direction: column;
    color: var(--text, #e8edf5);
    transition: width 280ms cubic-bezier(.16,1,.3,1);
    /* min-width interno: quando si apre, il contenuto è leggibile */
  }
  .cl-drawer.open { width: 50%; }
  /* Min-width interno per evitare collasso del contenuto durante l'animazione,
     ma più piccolo del 50% così su layout stretti il contenuto è leggibile. */
  .cl-drawer > * { min-width: min(420px, 100%); }

  /* Quando la checklist è aperta, il paper dell'editor si allarga a tutta
     la larghezza disponibile (niente più 880px centered con spazio libero
     ai lati) e i margini esterni del workspace si stringono. */
  .workspace:has(.cl-drawer.open) .paper { max-width: 100%; }
  .workspace:has(.cl-drawer.open) .editor-wrap { padding: 32px 22px 80px; }
  .workspace:has(.cl-drawer.open) .paper { padding: 40px 44px; }

  .cl-header {
    padding: 18px 22px 14px;
    border-bottom: 1px solid var(--line, #1f3a5e);
    display: flex; flex-direction: column; gap: 12px;
  }
  .cl-title-row {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px;
  }
  .cl-title {
    font-family: "EB Garamond", Georgia, serif;
    font-size: 22px; font-weight: 600;
    color: var(--text-strong, #fff);
    letter-spacing: 0.01em;
  }
  .cl-title .accent { color: var(--accent, #5DCAA5); }
  .cl-close {
    width: 32px; height: 32px;
    background: transparent;
    border: 1px solid var(--line, #1f3a5e);
    border-radius: 8px;
    color: var(--text-dim, #8a9ab5);
    cursor: pointer;
    display: grid; place-items: center;
    transition: all 150ms;
  }
  .cl-close:hover { color: var(--text-strong, #fff); border-color: var(--line-strong, #2c4a76); }
  .cl-close svg { width: 14px; height: 14px; }

  .cl-template-select {
    width: 100%;
    padding: 10px 12px;
    background: var(--bg-elevated, #0a1628);
    color: var(--text, #e8edf5);
    border: 1px solid var(--line-strong, #2c4a76);
    border-radius: 8px;
    font: inherit; font-size: 13.5px;
    cursor: pointer;
  }
  .cl-template-select:focus {
    outline: none;
    border-color: var(--accent, #5DCAA5);
    box-shadow: 0 0 0 3px var(--accent-soft, rgba(93,202,165,.12));
  }

  .cl-meta-bar {
    display: flex; align-items: center; gap: 12px;
    font-size: 12px; color: var(--text-dim, #8a9ab5);
    min-height: 20px;
  }
  .cl-meta-bar .progress { color: var(--accent, #5DCAA5); font-weight: 600; }
  .cl-meta-bar .modality {
    padding: 2px 8px;
    background: var(--accent-soft, rgba(93,202,165,.12));
    color: var(--accent, #5DCAA5);
    border-radius: 999px;
    font-size: 10.5px; font-weight: 700;
    letter-spacing: 0.08em; text-transform: uppercase;
  }

  /* ─── Body scrollabile con le voci ─── */
  .cl-body {
    flex: 1;
    overflow-y: auto;
    padding: 14px 22px 22px;
  }
  .cl-empty {
    padding: 40px 16px;
    text-align: center;
    color: var(--text-dim, #8a9ab5);
    font-size: 13.5px; line-height: 1.6;
  }
  .cl-empty strong { color: var(--accent, #5DCAA5); }

  .cl-item {
    background: var(--panel-2, #112340);
    border: 1px solid var(--line, #1f3a5e);
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 8px;
    transition: border-color 150ms;
  }
  .cl-item.is-normal { border-color: rgba(93,202,165,.45); background: rgba(93,202,165,.05); }
  .cl-item.is-prompt { border-color: rgba(244,192,101,.55); }

  .cl-item-head {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 8px;
  }
  .cl-item-name {
    flex: 1;
    font-size: 13.5px; font-weight: 600;
    color: var(--text-strong, #fff);
  }

  .cl-state-btn {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 4px 10px;
    background: transparent;
    color: var(--text-dim, #8a9ab5);
    border: 1px solid var(--line-strong, #2c4a76);
    border-radius: 6px;
    font: inherit; font-size: 11.5px; font-weight: 600;
    cursor: pointer;
    transition: all 150ms;
  }
  .cl-state-btn:hover { color: var(--text-strong, #fff); border-color: var(--accent, #5DCAA5); }
  .cl-state-btn.active.normal {
    background: var(--accent, #5DCAA5);
    color: var(--accent-ink, #050d1a);
    border-color: var(--accent, #5DCAA5);
  }
  .cl-state-btn.active.prompt {
    background: var(--warn, #f4c065);
    color: #1a1a1a;
    border-color: var(--warn, #f4c065);
  }

  .cl-item-text {
    font-size: 13px; line-height: 1.55;
    color: var(--text, #e8edf5);
    font-family: "EB Garamond", Georgia, serif;
    font-size: 14.5px;
  }
  .cl-item-note {
    width: 100%;
    margin-top: 6px;
    padding: 8px 10px;
    background: var(--bg-elevated, #050d1a);
    color: var(--text, #e8edf5);
    border: 1px solid var(--line-strong, #2c4a76);
    border-radius: 6px;
    font: inherit; font-size: 13px;
    resize: vertical; min-height: 60px;
    outline: none;
    font-family: "EB Garamond", Georgia, serif;
  }
  .cl-item-note:focus {
    border-color: var(--warn, #f4c065);
    box-shadow: 0 0 0 3px rgba(244,192,101,.18);
  }

  /* Wrapper della textarea-nota con bottone mic in basso a destra */
  .cl-note-wrap { position: relative; }
  .cl-note-wrap .cl-item-note { padding-right: 44px !important; }
  .cl-mic-btn {
    position: absolute;
    right: 6px; bottom: 6px;
    height: 30px; min-width: 30px;
    padding: 0 8px;
    border-radius: 6px;
    background: var(--accent-soft, rgba(93,202,165,.12));
    color: var(--accent, #5DCAA5);
    border: 1px solid var(--line-strong, #2c4a76);
    cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 4px;
    transition: background 150ms, border-color 150ms, color 150ms, width 150ms;
    font: inherit; font-size: 11px; font-weight: 700;
    letter-spacing: 0.05em;
  }
  .cl-mic-btn:hover {
    background: rgba(93,202,165,.22);
    border-color: var(--accent, #5DCAA5);
  }
  .cl-mic-btn svg { width: 14px; height: 14px; }
  .cl-mic-btn.rec {
    background: var(--danger, #e07070);
    color: #fff;
    border-color: var(--danger, #e07070);
  }
  .cl-mic-btn.rec .rec-dot-mic {
    width: 8px; height: 8px; border-radius: 50%;
    background: #fff;
    animation: pulse 1.2s infinite;
  }

  /* ─── Footer con bottoni azione ─── */
  .cl-footer {
    padding: 14px 22px 18px;
    border-top: 1px solid var(--line, #1f3a5e);
    display: flex; gap: 8px;
    background: var(--panel, #0a1628);
  }
  .cl-btn {
    flex: 1;
    padding: 11px 14px;
    border-radius: 8px;
    font: inherit; font-size: 13px; font-weight: 600;
    cursor: pointer;
    border: 1px solid transparent;
    transition: all 150ms;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  }
  .cl-btn-ghost {
    background: transparent;
    color: var(--text-dim, #8a9ab5);
    border-color: var(--line-strong, #2c4a76);
  }
  .cl-btn-ghost:hover { color: var(--text-strong, #fff); border-color: var(--text-dim, #8a9ab5); }
  .cl-btn-primary {
    background: var(--accent, #5DCAA5);
    color: var(--accent-ink, #050d1a);
    border-color: var(--accent, #5DCAA5);
  }

  // Helper: ottiene il dizionario delle stringhe per la lingua attiva (fallback IT)
  function L() { return UI_STRINGS[langInput] || UI_STRINGS.it; }

  // Applica le stringhe i18n al DOM in base alla lingua di input attuale.
  // Cerca tutti gli elementi con `data-i18n` (testo), `data-i18n-title` (tooltip)
  // e `data-i18n-placeholder` (placeholder degli input) e li aggiorna.
  function applyUILang() {
    const dict = L();
    document.querySelectorAll('[data-i18n]').forEach((el) => {
      const key = el.dataset.i18n;
      if (dict[key] != null) el.textContent = dict[key];
    });
    document.querySelectorAll('[data-i18n-title]').forEach((el) => {
      const key = el.dataset.i18nTitle;
      if (dict[key] != null) el.setAttribute('title', dict[key]);
    });
    document.querySelectorAll('[data-i18n-placeholder]').forEach((el) => {
      const key = el.dataset.i18nPlaceholder;
      if (dict[key] != null) el.setAttribute('placeholder', dict[key]);
    });
    // Lingua del documento per spellcheck e accessibility
    document.documentElement.setAttribute('lang', langInput);
  }

  // ─── State ────────────────────────────────────────────────
  let langInput = 'it';     // lingua in cui detta il radiologo
  let writingStyle = 'prose';
  let patientSex = null;
  try { const s = sessionStorage.getItem('refertium_patient_sex'); if (s === 'M' || s === 'F') patientSex = s; } catch {}
  let baseFontSize = 17;
  let savedSelectionRange = null;
  let lastPreviewMode = null;
  let lastPreviewText = '';

  const $ = (id) => document.getElementById(id);
  const editor = $('editor');
  const statusbar = $('statusbar');
  const statusText = $('statusText');
  const statusSpin = $('statusSpin');
  const toastEl = $('toast');
  const aiPreview = $('aiPreview');
  const aiPreviewBody = $('aiPreviewBody');

  // ─── Utilities ────────────────────────────────────────────
  function setStatus(text, mode) {
    if (!text) { statusbar.classList.remove('visible', 'err', 'ok'); return; }
    statusbar.classList.add('visible');
    statusbar.classList.toggle('err', mode === 'err');
    statusbar.classList.toggle('ok', mode === 'ok');
    statusSpin.style.display = (mode === 'err' || mode === 'ok') ? 'none' : 'inline-block';
    statusText.textContent = text;
  }
  function showToast(msg, mode) {
    toastEl.textContent = msg;
    toastEl.classList.toggle('err', mode === 'err');
    toastEl.classList.add('visible');
    clearTimeout(toastEl._t);
    toastEl._t = setTimeout(() => toastEl.classList.remove('visible'), 2400);
  }
  function getEditorText() {
    let raw = '';
    editor.childNodes.forEach((node) => {
      if (node.nodeType === Node.TEXT_NODE) raw += node.textContent + '\n';
      else if (node.nodeType === Node.ELEMENT_NODE) raw += node.innerText + '\n';
    });
    return raw.replace(/\n{3,}/g, '\n\n').trim();
  }
  function saveSelection() {
    const sel = window.getSelection();
    if (!sel || sel.rangeCount === 0) return null;
    const range = sel.getRangeAt(0);
    if (!editor.contains(range.commonAncestorContainer)) return null;
    savedSelectionRange = range.cloneRange();
    return savedSelectionRange;
  }
  function restoreSelection() {
    if (!savedSelectionRange) return false;
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(savedSelectionRange);
    return true;
  }
  function insertIntoEditor(text, opts) {
    opts = opts || {};
    const replaceSelection = !!opts.replaceSelection;
    const asBlock = opts.asBlock !== false;
    editor.focus();
    if (!restoreSelection()) {
      const range = document.createRange();
      range.selectNodeContents(editor);
      range.collapse(false);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
    }
    const sel = window.getSelection();
    if (sel.rangeCount === 0) return;
    let range = sel.getRangeAt(0);
    if (replaceSelection && !sel.isCollapsed) range.deleteContents();
    if (asBlock) {
      const paragraphs = String(text).split(/\n{2,}/);
      const frag = document.createDocumentFragment();
      paragraphs.forEach((para) => {
        const p = document.createElement('p');
        const lines = para.split('\n');
        lines.forEach((line, idx) => {
          if (idx > 0) p.appendChild(document.createElement('br'));
          p.appendChild(document.createTextNode(line));
        });
        frag.appendChild(p);
      });
      range.insertNode(frag);
      range.collapse(false);
    } else {
      const textNode = document.createTextNode(text);
      range.insertNode(textNode);
      range.setStartAfter(textNode);
      range.setEndAfter(textNode);
    }
    sel.removeAllRanges();
    sel.addRange(range);
    editor.focus();
  }

  // ─── Build language menus ─────────────────────────────────
  function buildLangMenus() {
    const inMenu = $('langInputMenu');
    LANGS.forEach((lng) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'dd-item' + (lng.code === langInput ? ' selected' : '');
      btn.dataset.code = lng.code;
      btn.innerHTML = `<span class="flag" aria-hidden="true">${lng.flag}</span><span class="code">${lng.code.toUpperCase()}</span><span>${lng.nativeName}</span>`;
      btn.addEventListener('click', () => {
        setLangInput(lng.code);
        $('langInputMenu').classList.remove('open');
      });
      inMenu.appendChild(btn);
    });

    const exMenu = $('exportLangMenu');
    LANGS.forEach((lng) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'dd-item';
      btn.dataset.code = lng.code;
      btn.innerHTML = `<span class="flag" aria-hidden="true">${lng.flag}</span><span class="code">${lng.code.toUpperCase()}</span><span>${lng.nativeName}</span>`;
      btn.addEventListener('click', () => {
        $('exportLangMenu').classList.remove('open');
        runExportLanguage(lng.code);
      });
      exMenu.appendChild(btn);
    });
  }

  function setLangInput(code) {
    const lng = LANGS.find((l) => l.code === code);
    if (!lng) return;
    langInput = code;
    // Aggiorna chip con bandiera + nome nativo
    $('langInputValue').textContent = lng.nativeName;
    $('langInputFlag').textContent = lng.flag;
    // Highlight item selezionato nel dropdown
    document.querySelectorAll('#langInputMenu .dd-item').forEach((el) => {
      el.classList.toggle('selected', el.dataset.code === code);
    });
    // i18n: aggiorna TUTTE le etichette UI
    applyUILang();
  }

  // Toggle dropdowns
  function toggleMenu(button, menu) {
    button.addEventListener('click', (e) => {
      e.stopPropagation();
      menu.classList.toggle('open');
    });
    document.addEventListener('click', (e) => {
      if (!menu.contains(e.target) && e.target !== button) menu.classList.remove('open');
    });
  }
  toggleMenu($('langInputChip'), $('langInputMenu'));
  toggleMenu($('btnExportLang'), $('exportLangMenu'));

  // ─── Toolbar bindings (format buttons + font) ─────────────
  document.querySelectorAll('.tbtn[data-cmd]').forEach((btn) => {
    btn.addEventListener('click', () => {
      editor.focus();
      document.execCommand(btn.dataset.cmd, false, null);
    });
  });
  $('btnFontUp').addEventListener('click', () => {
    baseFontSize = Math.min(24, baseFontSize + 1);
    editor.style.fontSize = baseFontSize + 'px';
  });
  $('btnFontDown').addEventListener('click', () => {
    baseFontSize = Math.max(13, baseFontSize - 1);
    editor.style.fontSize = baseFontSize + 'px';
  });
  // Patient sex toggle (M / F / none)
  function applyPatientSexUI() {
    const m = $('btnSexM'), f = $('btnSexF'); if (!m || !f) return;
    m.classList.toggle('active', patientSex === 'M');
    f.classList.toggle('active', patientSex === 'F');
    m.setAttribute('aria-pressed', patientSex === 'M' ? 'true' : 'false');
    f.setAttribute('aria-pressed', patientSex === 'F' ? 'true' : 'false');
    try { if (patientSex) sessionStorage.setItem('refertium_patient_sex', patientSex); else sessionStorage.removeItem('refertium_patient_sex'); } catch {}
  }
  if ($('btnSexM')) $('btnSexM').addEventListener('click', () => { patientSex = patientSex === 'M' ? null : 'M'; applyPatientSexUI(); });
  if ($('btnSexF')) $('btnSexF').addEventListener('click', () => { patientSex = patientSex === 'F' ? null : 'F'; applyPatientSexUI(); });
  applyPatientSexUI();
  $('btnCopy').addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(getEditorText()); showToast(L().toastCopyOk); }
    catch { showToast(L().toastCopyFail, 'err'); }
  });
  // ─── Dictation (Whisper) ──────────────────────────────────
  const recState = {
    recorder: null, chunks: [], mimeType: '',
    startedAt: 0, timerId: null, isRecording: false,
  };
  const btnRec = $('btnRec');

  btnRec.addEventListener('click', async () => {
    if (recState.isRecording) await stopRecording();
    else await startRecording();
  });

  async function startRecording() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      showToast(L().toastMicUnavailable, 'err');
      return;
    }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const candidates = ['audio/webm;codecs=opus', 'audio/webm', 'audio/ogg;codecs=opus', 'audio/mp4'];
      let mimeType = '';
      for (const m of candidates) {
        if (window.MediaRecorder && MediaRecorder.isTypeSupported(m)) { mimeType = m; break; }
      }
      const mr = mimeType ? new MediaRecorder(stream, { mimeType }) : new MediaRecorder(stream);
      recState.recorder = mr;
      recState.chunks = [];
      recState.mimeType = mr.mimeType || mimeType || 'audio/webm';
      mr.ondataavailable = (e) => { if (e.data && e.data.size) recState.chunks.push(e.data); };
      mr.onstop = onRecorderStop;
      mr.start(250);
      recState.isRecording = true;
      recState.startedAt = Date.now();
      saveSelection();
      btnRec.classList.add('active');
      btnRec.innerHTML = '';
      const dot = document.createElement('span'); dot.className = 'rec-dot'; btnRec.appendChild(dot);
      const lab = document.createElement('span'); lab.textContent = L().btnRecStop; btnRec.appendChild(lab);
      const tim = document.createElement('span'); tim.className = 'rec-timer'; tim.textContent = '0:00'; btnRec.appendChild(tim);
      recState.timerId = setInterval(tickTimer, 500);
      setStatus(L().statusRecording);
    } catch (e) {
      console.error(e);
      showToast(L().toastMicDenied, 'err');
    }
  }

  function tickTimer() {
    const elapsed = Math.floor((Date.now() - recState.startedAt) / 1000);
    const m = Math.floor(elapsed / 60);
    const s = elapsed % 60;
    const t = m + ':' + String(s).padStart(2, '0');
    const node = btnRec.querySelector('.rec-timer');
    if (node) node.textContent = t;
  }

  async function stopRecording() {
    if (!recState.recorder) return;
    try { recState.recorder.stop(); } catch {}
    try { recState.recorder.stream.getTracks().forEach((t) => t.stop()); } catch {}
    clearInterval(recState.timerId);
    recState.timerId = null;
    recState.isRecording = false;
    btnRec.classList.remove('active');
    btnRec.innerHTML = '';
    btnRec.insertAdjacentHTML('beforeend',
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg><span>' + L().btnRec + '</span>'
    );
  }

  async function onRecorderStop() {
    setStatus(L().statusTranscribing);
    try {
      const blob = new Blob(recState.chunks, { type: recState.mimeType || 'audio/webm' });
      if (blob.size < 1000) { setStatus(L().toastTooShort, 'err'); setTimeout(() => setStatus(''), 1800); return; }
      const rawText = await transcribeBlobDirect(blob);
      if (!rawText) { setStatus(L().empty, 'err'); setTimeout(() => setStatus(''), 1800); return; }
      const corrected = applyMedicalCorrections(rawText, langInput);
      const pre = preprocessPunctuation(corrected, langInput);
      setStatus(L().statusCleaning);
      let buffer = '';
      await cleanupDictationAI(pre, langInput, (delta) => { buffer += delta; });
      const cleaned = buffer.trim();
      if (cleaned) insertIntoEditor(cleaned, { replaceSelection: false, asBlock: true });
      setStatus(L().statusInserted, 'ok');
      setTimeout(() => setStatus(''), 1200);
    } catch (err) {
      console.error(err);
      setStatus('Error: ' + (err && err.message ? err.message : 'STT failed'), 'err');
      setTimeout(() => setStatus(''), 2500);
    }
  }

  // ─── Spoken punctuation preprocessing (lingua-aware) ──────
  const PUNCT_RULES = {
    it: [
      [/\s+virgola\b/gi, ','], [/\s+punto e virgola\b/gi, ';'],
      [/\s+due punti\b/gi, ':'], [/\s+punto\b(?!\s*\d)/gi, '.'],
      [/\s+a capo\b/gi, '\n'], [/\s+nuovo paragrafo\b/gi, '\n\n'],
      [/\s+apri parentesi\b/gi, ' ('], [/\s+chiudi parentesi\b/gi, ')'],
    ],
    pt: [
      [/\s+v[íi]rgula\b/gi, ','], [/\s+ponto\s+e\s+v[íi]rgula\b/gi, ';'],
      [/\s+dois\s+pontos\b/gi, ':'], [/\s+ponto\b(?!\s*\d)/gi, '.'],
      [/\s+nova\s+linha\b/gi, '\n'], [/\s+novo\s+par[áa]grafo\b/gi, '\n\n'],
    ],
    es: [
      [/\s+coma\b/gi, ','], [/\s+punto\s+y\s+coma\b/gi, ';'],
      [/\s+dos\s+puntos\b/gi, ':'], [/\s+punto\b(?!\s*\d)/gi, '.'],
      [/\s+nueva\s+l[íi]nea\b/gi, '\n'], [/\s+nuevo\s+p[áa]rrafo\b/gi, '\n\n'],
    ],
    en: [
      [/\s+comma\b/gi, ','], [/\s+semicolon\b/gi, ';'],
      [/\s+colon\b/gi, ':'], [/\s+period\b(?!\s*\d)/gi, '.'],
      [/\s+full\s+stop\b(?!\s*\d)/gi, '.'],
      [/\s+new\s+line\b/gi, '\n'], [/\s+new\s+paragraph\b/gi, '\n\n'],
    ],
    fr: [
      [/\s+virgule\b/gi, ','], [/\s+point\s+virgule\b/gi, ';'],
      [/\s+deux\s+points\b/gi, ':'], [/\s+point\b(?!\s*\d)/gi, '.'],
      [/\s+[àa]\s+la\s+ligne\b/gi, '\n'], [/\s+nouveau\s+paragraphe\b/gi, '\n\n'],
    ],
    de: [
      [/\s+Komma\b/gi, ','], [/\s+Semikolon\b/gi, ';'],
      [/\s+Doppelpunkt\b/gi, ':'], [/\s+Punkt\b(?!\s*\d)/gi, '.'],
      [/\s+neue\s+Zeile\b/gi, '\n'], [/\s+neuer\s+Absatz\b/gi, '\n\n'],
    ],
  };
  function preprocessPunctuation(text, lang) {
    if (!text) return '';
    let t = ' ' + text + ' ';
    const rules = PUNCT_RULES[lang] || PUNCT_RULES.it;
    rules.forEach((r) => { t = t.replace(r[0], r[1]); });
    t = t.replace(/\s*([,;:.!?])\s*/g, '$1 ');
    t = t.replace(/[ \t]+/g, ' ').replace(/ ?\n ?/g, '\n').trim();
    t = t.replace(/(^|[.!?]\s+)([a-zàèéìòùáéíóúñçäöüß])/g, (_, p, c) => p + c.toUpperCase());
    return t;
  }

  function applyMedicalCorrections(text, lang) {
    if (!text) return text;
    let t = text;
    const rules = MED_CORRECTIONS[lang] || [];
    for (const r of rules) {
      t = t.replace(r[0], r[1]);
    }
    return t;
  }

  // ─── Whisper transcribe with per-language prompt ──────────
  function buildWhisperPrompt(lang) {
    const base = WHISPER_BASES[lang] || WHISPER_BASES.it;
    return base.slice(0, 1800);
  }

  async function transcribeBlobDirect(blob) {
    try {
      return await attemptTranscribe(blob, 'gpt-4o-transcribe');
    } catch (err) {
      const msg = String(err && err.message || '');
      const isFormatError = /400|format|corrupt|unsupported|decode/i.test(msg);
      if (!isFormatError) throw err;
      console.warn('Fallback whisper-1:', msg);
      return await attemptTranscribe(blob, 'whisper-1');
    }
  }

  async function attemptTranscribe(blob, model) {
    const ext = (blob.type || '').includes('mp4') ? 'mp4'
      : (blob.type || '').includes('ogg') ? 'ogg' : 'webm';
    const fd = new FormData();
    fd.append('file', blob, 'dictation.' + ext);
    fd.append('model', model);
    const lng = LANGS.find((l) => l.code === langInput) || LANGS[0];
    fd.append('language', lng.whisperCode);
    fd.append('prompt', buildWhisperPrompt(langInput));
    fd.append('temperature', '0');
    fd.append('response_format', 'json');
    const headers = {};
    if (PROXY_AUTH && PROXY_AUTH !== 'session') headers['Authorization'] = 'Bearer ' + PROXY_AUTH;
    const r = await fetch(PROXY_URL + '/v1/audio/transcriptions', { method: 'POST', headers, body: fd });
    if (!r.ok) {
      const txt = await r.text().catch(() => '');
      throw new Error('STT ' + model + ': ' + r.status + ' ' + txt.slice(0, 200));
    }
    const data = await r.json();
    return (data && (data.text || data.transcript || '')) || '';
  }

  // ─── AI cleanup (lingua-aware, fedele) ────────────────────
  function langName(code) {
    const l = LANGS.find((x) => x.code === code);
    return l ? l.nativeName : 'Italian';
  }

  async function cleanupDictationAI(rawText, lang, onDelta) {
    const lname = langName(lang);
    const system = [
      `You are a spelling/punctuation corrector for radiology dictation in ${lname}.`,
      `Return the doctor's text EXACTLY AS IS in ${lname}, with ONLY these minimal corrections:`,
      '1) missing or wrong punctuation;',
      '2) obvious spelling typos;',
      '3) double or wrong spacing;',
      '4) capital letter at start of sentence;',
      '5) accidental word repetitions.',
      `MEDICAL TERMINOLOGY in ${lname}: keep specialised radiology terms LITERAL — do not replace them with non-medical synonyms or with English equivalents.`,
      'ABSOLUTE RULES — never break them:',
      `- Output language MUST be ${lname}. Do NOT translate to any other language.`,
      `- DO NOT add words, sentences, sections or titles the doctor did not say.`,
      `- DO NOT insert headings (TECHNIQUE / FINDINGS / IMPRESSION) unless explicitly spoken.`,
      `- DO NOT change the order of sentences.`,
      `- DO NOT summarise, shorten, expand or paraphrase.`,
      `- DO NOT replace synonyms.`,
      `- Preserve the dictated style exactly.`,
      'When in doubt whether to correct something, do NOT correct it.',
      'Return ONLY the corrected text — no commentary, no notes.',
    ].join(' ');
    await streamChatCompletion({
      model: 'gpt-4o-mini',
      messages: [{ role: 'system', content: system }, { role: 'user', content: rawText }],
      temperature: 0,
      max_tokens: Math.min(2000, Math.max(200, Math.ceil(rawText.length / 2))),
    }, onDelta);
  }

  async function aiGenerateMagicDraft(input, lang, onDelta) {
    const lname = langName(lang);
    const sectionLabels = ({
      it: 'TECNICA / REPERTI',
      pt: 'TÉCNICA / ACHADOS',
      es: 'TÉCNICA / HALLAZGOS',
      en: 'TECHNIQUE / FINDINGS',
      fr: 'TECHNIQUE / RÉSULTATS',
      de: 'TECHNIK / BEFUNDE',
    })[lang] || 'TECNICA / REPERTI';
    const sexLine =
      patientSex === 'M' ? `PATIENT SEX: Male. Use male references in ${lname}. Include prostate and seminal vesicles when pertinent. NEVER describe uterus, ovaries, female breast, obstetric parameters.` :
      patientSex === 'F' ? `PATIENT SEX: Female. Use female references in ${lname}. Include uterus, adnexa and female breast when pertinent. NEVER describe prostate or seminal vesicles.` :
      `PATIENT SEX: not specified. Use neutral forms. Do not describe sex-specific organs unless explicitly named in the indication.`;
    const system = [
      `You are a radiologist writing in ${lname}. The user provides ALWAYS a brief INDICATION (e.g. "Brain CT negative", "Thyroid US chronic thyroiditis"). It is NEVER a finished report — just a shorthand command. You MUST expand it into a structured report body.`,
      sexLine,
      `MANDATORY STRUCTURE — ONLY 2 SECTIONS in this order, each on its own line, UPPERCASE titles in ${lname.toUpperCase()}: ${sectionLabels}.`,
      `Section 1: technical description (modality, region, contrast, sequences/phases).`,
      `Section 2: systematic DETAILED description of findings for each pertinent district. "negative"/"normal" → describe each district as normal with standard ${lname} phrasing. If a pathological finding is named (also chronic ones) → DESCRIBE IT precisely INSIDE the findings section, NEVER in a conclusion. The other districts are described as normal.`,
      `DO NOT add an IMPRESSION / CONCLUSIONS / SUMMARY section. Magic handles ONLY technique + findings. The impression is generated separately via the dedicated "AI Impression" button.`,
      `Every finding mentioned in the indication MUST appear inside the findings section. If a finding is missing from findings, it does not exist.`,
      `The user input is ALWAYS shorthand, NEVER a finished report — expand it.`,
      `DO NOT invent unlikely findings; use neutral ${lname} phrasing when missing.`,
      `Output: ONLY the report (technique + findings) in ${lname}, no impression, no commentary.`,
    ].join(' ');
    await streamChatCompletion({
      model: 'gpt-4o-mini',
      messages: [{ role: 'system', content: system }, { role: 'user', content: input || 'General radiology exam.' }],
      temperature: 0.4,
      max_tokens: 800,
      top_p: 0.9,
    }, onDelta);
  }

  async function aiGenerateConclusions(bodyText, lang, onDelta) {
    const lname = langName(lang);
    const system = [
      `You are a radiologist. Given the BODY of a radiology report (in ${lname}), write ONLY the IMPRESSION/CONCLUSIONS section, in ${lname}, concise and clinically consistent with the findings described.`,
      `DO NOT repeat the body. DO NOT invent findings.`,
      `Use the standard local label: CONCLUSIONI / IMPRESSÃO / IMPRESIÓN / IMPRESSION / CONCLUSION / BEURTEILUNG.`,
      `Output: text in ${lname} starting with that label on a single line, then the content.`,

  async function aiRewriteSelection(selectedText, instruction, lang, onDelta) {

  // ─── Esporta in lingua: RISCRITTURA AI (non traduzione) ───
  // Singolo stage di riscrittura nativa (source language → target language).
  // Estratto come helper così possiamo concatenare due passaggi quando serve.
  async function aiRewriteOneStage(sourceText, sourceLang, targetLang, onDelta) {
    const srcName = langName(sourceLang);
    const tgtName = langName(targetLang);
    const system = [
      `You are a senior radiologist who is bilingual in ${srcName} and ${tgtName}.`,
      `You are given a complete radiology report written in ${srcName}.`,
      `Your task: REWRITE IT FROM SCRATCH in ${tgtName} as a native ${tgtName}-speaking radiologist would have written it, using standard local conventions, idioms, section headings and phrasing.`,
      `THIS IS NOT A LITERAL TRANSLATION: it is a re-authoring.`,
      `- Preserve the EXACT clinical meaning: same anatomy, same findings, same measurements, same impression.`,
      `- Do NOT add findings that are not in the source.`,
      `- Do NOT remove findings that are in the source.`,
      `- Use the section labels native to ${tgtName} radiology practice.`,
      `- Use natural ${tgtName} sentence flow, not word-for-word mapping from ${srcName}.`,
      `- Numerical values (mm, cm, ml, Hounsfield units, scores) must be preserved exactly.`,
      `- Anatomical and pathological terminology must be the native ${tgtName} medical term, not a literal translation.`,
      `Output: ONLY the final report in ${tgtName}, no commentary.`,
    ].join(' ');
    await streamChatCompletion({
      model: 'gpt-4o-mini',
      messages: [{ role: 'system', content: system }, { role: 'user', content: sourceText }],
      temperature: 0.3,
      max_tokens: Math.min(2000, Math.max(400, Math.ceil(sourceText.length / 2))),
      top_p: 0.9,
    }, onDelta);
  }

  // Pipeline export con pivot inglese OBBLIGATORIO: source → EN → target.
  // L'inglese è la "lingua pivot" perché i modelli LLM hanno copertura
  // massima sul vocabolario radiologico inglese; passare attraverso di esso
  // riduce gli errori su coppie meno comuni (es. PT→DE, ES→FR) rispetto al
  // mapping diretto.
  // Edge case: se source o target sono già inglese, un solo passaggio basta.
  async function aiTranslateRewrite(sourceText, sourceLang, targetLang, onDelta, onStage) {
    // Caso A: già una delle due lingue è inglese → singolo stage
    if (sourceLang === 'en' || targetLang === 'en') {
      if (onStage) onStage('single', targetLang);
      await aiRewriteOneStage(sourceText, sourceLang, targetLang, onDelta);
      return;
    }
    // Caso B: pivot inglese — due stage
    // Stage 1: source → English (silenzioso, accumula in buffer)
    if (onStage) onStage('pivot-en', 'en');
    let englishBuffer = '';
    await aiRewriteOneStage(sourceText, sourceLang, 'en', (delta) => {
      englishBuffer += delta;
    });
    const englishText = englishBuffer.trim();
    if (!englishText) {
      throw new Error('Pivot stage produced no English output');
    }
    // Stage 2: English → target (streaming visibile all'utente)
    if (onStage) onStage('pivot-target', targetLang);
    await aiRewriteOneStage(englishText, 'en', targetLang, onDelta);
  }

  async function streamChatCompletion(payload, onDelta) {
    const headers = { 'Content-Type': 'application/json' };
    if (PROXY_AUTH && PROXY_AUTH !== 'session') headers['Authorization'] = 'Bearer ' + PROXY_AUTH;
    const r = await fetch(PROXY_URL + '/v1/chat/completions', {
      method: 'POST',
      headers,
      body: JSON.stringify(Object.assign({}, payload, { stream: true })),
    });
    if (!r.ok || !r.body) {
      const txt = await r.text().catch(() => '');
      throw new Error('AI ' + r.status + ': ' + txt.slice(0, 200));
    }
    const reader = r.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      let idx;
      while ((idx = buffer.indexOf('\n')) !== -1) {
        const line = buffer.slice(0, idx).trim();
        buffer = buffer.slice(idx + 1);
        if (!line || !line.startsWith('data:')) continue;
        const data = line.slice(5).trim();
        if (data === '[DONE]') return;
        try {
          const json = JSON.parse(data);
          const delta =
            (json.choices && json.choices[0] && json.choices[0].delta && json.choices[0].delta.content) ||
            (json.choices && json.choices[0] && json.choices[0].message && json.choices[0].message.content) ||
            '';
          if (delta) onDelta(delta);
        } catch (e) { /* ignora */ }
      }
    }
  }

/* ============================================================
   CHECKLIST WIRE — drawer logic
   ============================================================ */
(function wireChecklist() {
  'use strict';
  const STATE_KEY = 'refertium_checklist_state_v2';

  let cstate = { templateId: null, voci: {} };

  function $(id) { return document.getElementById(id); }
  const toggleBtn  = $('clToggle');
  const drawer     = $('clDrawer');
  const backdrop   = $('clBackdrop');
  const closeBtn   = $('clCloseBtn');
  const select     = $('clTemplateSelect');
  const body       = $('clBody');
  const progress   = $('clProgress');
  const modality   = $('clModality');
  const resetBtn   = $('clResetBtn');
  const generateBtn= $('clGenerateBtn');

  if (!toggleBtn || !drawer) return; // markup non inserito

  // ─── Persistence ─────────────────────────────────────────
  try {
    const raw = sessionStorage.getItem(STATE_KEY);
    if (raw) cstate = JSON.parse(raw);
  } catch { cstate = { templateId: null, voci: {} }; }
  if (!cstate.voci) cstate.voci = {};

  function saveState() {
    try { sessionStorage.setItem(STATE_KEY, JSON.stringify(cstate)); } catch {}
  }

  // ─── Build dropdown options ──────────────────────────────
  const templates = window.CHECKLIST_TEMPLATES || {};
  Object.keys(templates).forEach((id) => {
    const opt = document.createElement('option');
    opt.value = id;
    opt.textContent = templates[id].label || id;
    select.appendChild(opt);
  });

  // ─── Open / close drawer ─────────────────────────────────
  function openDrawer() {
    drawer.classList.add('open');
    backdrop.classList.add('open');
    toggleBtn.classList.add('active');
    if (cstate.templateId) {
      select.value = cstate.templateId;
      renderTemplate(cstate.templateId);
    }
  }
  function closeDrawer() {
    drawer.classList.remove('open');
    backdrop.classList.remove('open');
    toggleBtn.classList.remove('active');
  }
  toggleBtn.addEventListener('click', () => {
    if (drawer.classList.contains('open')) closeDrawer();
    else openDrawer();
  });
  closeBtn.addEventListener('click', closeDrawer);
  backdrop.addEventListener('click', closeDrawer);

  // ─── Template selection ──────────────────────────────────
  select.addEventListener('change', () => {
    const id = select.value;
    if (id && (!cstate.templateId || cstate.templateId !== id)) {
      cstate = { templateId: id, voci: {} };
      saveState();
    } else if (!id) {
      cstate = { templateId: null, voci: {} };
      saveState();
    }
    renderTemplate(id);
  });

  // ─── Render ──────────────────────────────────────────────
  function renderTemplate(id) {
    if (!id) {
      body.innerHTML = `
        <div class="cl-empty">
          Seleziona un esame dall'elenco qui sopra.<br><br>
          Per ogni voce premi <strong>Normale</strong> se il reperto è regolare,
          oppure <strong>Nota</strong> e scrivi la descrizione del reperto patologico.
        </div>`;
      progress.textContent = '';
      modality.style.display = 'none';
      generateBtn.disabled = true;
      return;
    }
    const tpl = templates[id];
    if (!tpl) return;
    modality.textContent = tpl.modalita || '';
    modality.style.display = tpl.modalita ? 'inline-flex' : 'none';
    body.innerHTML = '';
    tpl.voci.forEach((voce) => {
      body.appendChild(renderVoce(voce));
    });
    updateProgress();
  }

  function renderVoce(voce) {
    const v = cstate.voci[voce.id] || { state: null, text: '' };
    const item = document.createElement('div');
    item.className = 'cl-item' + (v.state === 'normal' ? ' is-normal' : v.state === 'prompt' ? ' is-prompt' : '');

    const head = document.createElement('div');
    head.className = 'cl-item-head';

    const name = document.createElement('span');
    name.className = 'cl-item-name';
    name.textContent = voce.nome;
    head.appendChild(name);

    const btnNormal = document.createElement('button');
    btnNormal.className = 'cl-state-btn' + (v.state === 'normal' ? ' active normal' : '');
    btnNormal.type = 'button';
    btnNormal.textContent = 'Normale';
    btnNormal.addEventListener('click', () => {
      cstate.voci[voce.id] = { state: v.state === 'normal' ? null : 'normal', text: '' };
      saveState();
      // re-render full item per stato visivo
      const next = renderVoce(voce);
      item.replaceWith(next);
      updateProgress();
    });
    head.appendChild(btnNormal);

    const btnPrompt = document.createElement('button');
    btnPrompt.className = 'cl-state-btn' + (v.state === 'prompt' ? ' active prompt' : '');
    btnPrompt.type = 'button';
    btnPrompt.textContent = 'Nota';
    btnPrompt.addEventListener('click', () => {
      cstate.voci[voce.id] = { state: v.state === 'prompt' ? null : 'prompt', text: v.text || '' };
      saveState();
      const next = renderVoce(voce);
      item.replaceWith(next);
      updateProgress();
    });
    head.appendChild(btnPrompt);

    item.appendChild(head);

    if (v.state === 'normal') {
      const text = document.createElement('div');
      text.className = 'cl-item-text';
      text.textContent = voce.normale;
      item.appendChild(text);
    } else if (v.state === 'prompt') {
      const wrap = document.createElement('div');
      wrap.className = 'cl-note-wrap';

      const ta = document.createElement('textarea');
      ta.className = 'cl-item-note';
      ta.value = v.text || '';
      ta.addEventListener('input', () => {
        cstate.voci[voce.id] = { state: 'prompt', text: ta.value };
        saveState();
        updateProgress();
      });
      wrap.appendChild(ta);

      // Bottone microfono dentro la textarea (riusa refertiumStartDictation)
      const micBtn = document.createElement('button');
      micBtn.type = 'button';
      micBtn.className = 'cl-mic-btn';
      micBtn.title = 'Detta nel campo';
      const micSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>';
      micBtn.innerHTML = micSvg;
      let dictCtrl = null;
      let busy = false;
      micBtn.addEventListener('click', async () => {
        if (busy) return;
        if (typeof window.refertiumStartDictation !== 'function') {
          console.warn('refertiumStartDictation non esposta dal template');
          return;
        }
        if (dictCtrl) {
          // Stop registrazione + processa
          busy = true;
          micBtn.disabled = true;
          micBtn.innerHTML = '<span style="font-size:10px">…</span>';
          try {
            const text = await dictCtrl.stop();
            dictCtrl = null;
            if (text) {
              const cur = ta.value.trim();
              ta.value = cur ? (cur + ' ' + text) : text;
              cstate.voci[voce.id] = { state: 'prompt', text: ta.value };
              saveState();
              updateProgress();
              ta.focus();
            }
          } catch (e) {
            console.error('Dictation error:', e);
            dictCtrl = null;
          } finally {
            busy = false;
            micBtn.disabled = false;
            micBtn.classList.remove('rec');
            micBtn.innerHTML = micSvg;
          }
        } else {
          // Avvia registrazione
          try {
            dictCtrl = await window.refertiumStartDictation();
            micBtn.classList.add('rec');
            micBtn.innerHTML = '<span class="rec-dot-mic"></span><span>STOP</span>';
          } catch (e) {
            console.error('Mic error:', e);
            dictCtrl = null;
          }
        }
      });
      wrap.appendChild(micBtn);

      item.appendChild(wrap);
    }
    return item;
  }

  function updateProgress() {
    const tpl = cstate.templateId && templates[cstate.templateId];
    if (!tpl) { progress.textContent = ''; generateBtn.disabled = true; return; }
    const total = tpl.voci.length;
    const compiled = tpl.voci.filter((v) => {
      const s = cstate.voci[v.id];
      return s && (s.state === 'normal' || (s.state === 'prompt' && s.text && s.text.trim()));
    }).length;
    progress.textContent = compiled + ' / ' + total + ' voci';
    generateBtn.disabled = compiled === 0;
  }

  // ─── Reset ───────────────────────────────────────────────
  resetBtn.addEventListener('click', () => {
    cstate = { templateId: cstate.templateId, voci: {} };
    saveState();
    if (cstate.templateId) renderTemplate(cstate.templateId);
  });

  // ─── Generate report via AI ──────────────────────────────
  generateBtn.addEventListener('click', async () => {
    const tpl = cstate.templateId && templates[cstate.templateId];
    if (!tpl) return;
    const voci = tpl.voci.map((v) => {
      const s = cstate.voci[v.id];
      if (!s || !s.state) return null;
      if (s.state === 'normal') return { nome: v.nome, normale: v.normale };
      if (s.state === 'prompt' && s.text && s.text.trim()) {
        return { nome: v.nome, nota: s.text.trim() };
      }
      return null;
    }).filter(Boolean);
    if (!voci.length) return;

    generateBtn.disabled = true;
    const oldLabel = generateBtn.innerHTML;
    generateBtn.innerHTML = '⏳ Genero…';

    try {
      const draft = await generateReportFromChecklist(tpl, voci);
      // Inserisci nel editor — usa la funzione del template host se disponibile
      if (typeof window.refertiumInsertChecklistDraft === 'function') {
        window.refertiumInsertChecklistDraft(draft);
      } else {
        const editor = document.getElementById('editor');
        if (editor) {
          editor.innerHTML = '';
          draft.split(/\n{2,}/).forEach((para) => {
            const p = document.createElement('p');
            const lines = para.split('\n');
            lines.forEach((line, idx) => {
              if (idx > 0) p.appendChild(document.createElement('br'));
              p.appendChild(document.createTextNode(line));
            });
            editor.appendChild(p);
          });
        }
      }
      closeDrawer();
    } catch (err) {
      console.error('checklist generate failed:', err);
      alert('Errore generazione: ' + (err.message || 'sconosciuto'));
    } finally {
      generateBtn.innerHTML = oldLabel;
      updateProgress();
    }
  });

  // Riempie il riepilogo voci e chiama l'AI per ricomporre un referto continuo.
  async function generateReportFromChecklist(tpl, voci) {
    if (typeof window.streamChatCompletion !== 'function') {
      throw new Error('streamChatCompletion non disponibile');
    }
    const lines = voci.map((v) => {
      if (v.normale) return '- ' + v.nome + ': [NORMALE] ' + v.normale;
      return '- ' + v.nome + ': [REPERTO] ' + v.nota;
    }).join('\n');

    const system = [
      'Sei un radiologo esperto. Hai una lista di voci di una checklist strutturata',
      'per l\'esame "' + tpl.label + '" (modalità ' + (tpl.modalita || 'radiologica') + ').',
      'Per ciascuna voce ho indicato se è NORMALE (con la frase standard già pronta) o',
      'se ho aggiunto un REPERTO patologico (descritto in modo informale).',
      'Componi un referto radiologico continuo in italiano, ben strutturato, con:',
      '- una sezione REPERTI che integra le voci nell\'ordine dato, riformulando',
      '  in prosa medica corretta (mantieni i contenuti, non inventare nulla);',
      '- una sezione CONCLUSIONI sintetica, coerente con i reperti.',
      'Mantieni i numeri, le misure e i termini medici esatti. Per le voci NORMALI usa',
      'la frase standard fornita (eventualmente accorciata). Per i REPERTI espandi in',
      'linguaggio radiologico professionale.',
      'Output: SOLO il referto, niente commenti.',
    ].join(' ');

    let buffer = '';
    await window.streamChatCompletion({
      model: 'gpt-4o-mini',
      messages: [
        { role: 'system', content: system },
        { role: 'user', content: lines },
      ],
      temperature: 0.3,
    }, (delta) => { buffer += delta; });
    return buffer.trim();
  }

  // Esci col tasto Esc
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && drawer.classList.contains('open')) closeDrawer();
  });

})();

</script>
