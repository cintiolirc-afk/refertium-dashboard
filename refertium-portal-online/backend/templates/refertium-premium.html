<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Refertium — Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  /* ============================================================
     Refertium — Design System (dark navy + green + white)
     ============================================================ */
  :root {
    color-scheme: dark;
    --bg:           #050d1a;
    --bg-elevated:  #0a1628;
    --panel:        #0a1628;
    --panel-2:      #112340;
    --panel-hover:  rgba(93, 202, 165, 0.08);
    --line:         #1f3a5e;
    --line-strong:  #2c4a76;
    --line-focus:   rgba(93, 202, 165, 0.50);

    --text:         #e8edf5;
    --text-strong:  #ffffff;
    --text-dim:     #8a9ab5;
    --muted:        #5a6a85;

    --accent:       #5DCAA5;
    --accent-strong:#7ed8b8;
    --accent-soft:  rgba(93, 202, 165, 0.12);
    --accent-ink:   #050d1a;

    --warn:         #f4c065;
    --danger:       #e07070;

    --shadow-sm:    0 1px 2px rgba(0, 0, 0, 0.4);
    --shadow:       0 4px 12px -2px rgba(0, 0, 0, 0.4);
    --shadow-lg:    0 12px 32px -6px rgba(0, 0, 0, 0.55);

    --radius:       10px;
    --radius-sm:    8px;
    --radius-lg:    14px;
    --ease:         cubic-bezier(0.16, 1, 0.3, 1);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: "Inter", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    font-size: 14px;
    line-height: 1.6;
    letter-spacing: -0.005em;
  }

  ::selection {
    background: var(--accent);
    color: var(--accent-ink);
  }

  .app {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  /* ─── Top bar ─── */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 14px 24px;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .brand-mark {
    font-family: "EB Garamond", serif;
    font-size: 22px;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: var(--text-strong);
  }
  .brand-mark .accent { color: var(--accent); }

  .doctor-badge {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 6px 12px;
    border-radius: 999px;
    background: var(--panel-2);
    border: 1px solid var(--line);
    font-size: 12.5px;
    color: var(--text-dim);
  }
  .doctor-badge-name { color: var(--text); font-weight: 500; }
  .doctor-badge-md { color: var(--accent); font-weight: 600; margin-left: 4px; }
  .doctor-badge-divider { width: 1px; height: 14px; background: var(--line-strong); }
  .doctor-badge-specialty,
  .doctor-badge-specialties { display: inline-flex; align-items: center; gap: 4px; color: var(--accent); }
  .doctor-badge-specialty svg { width: 16px; height: 16px; }

  /* ─── Toolbar ─── */
  .toolbar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    padding: 10px 24px;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .tool-group {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 0 6px;
    border-right: 1px solid var(--line);
  }
  .tool-group:last-child { border-right: none; }

  .tbtn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    height: 34px;
    padding: 0 12px;
    border-radius: var(--radius-sm);
    background: transparent;
    color: var(--text);
    border: 1px solid transparent;
    cursor: pointer;
    font: inherit;
    font-size: 13px;
    font-weight: 500;
    transition: background 150ms var(--ease), border-color 150ms var(--ease), color 150ms var(--ease);
  }
  .tbtn:hover { background: var(--panel-hover); }
  .tbtn.active { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
  .tbtn.primary { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
  .tbtn.primary:hover { background: var(--accent-strong); }
  .tbtn.danger { color: var(--danger); }
  .tbtn.danger:hover { background: rgba(224, 112, 112, 0.10); }
  .tbtn:disabled { opacity: 0.5; cursor: not-allowed; }
  .tbtn svg { width: 16px; height: 16px; }

  .rec-dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--danger);
    animation: pulse 1.2s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(0.85); }
  }
  .rec-timer {
    font-variant-numeric: tabular-nums;
    color: var(--text-dim);
    font-size: 12px;
    min-width: 36px;
  }

  /* ─── Status bar ─── */
  .statusbar {
    padding: 8px 24px;
    border-bottom: 1px solid var(--line);
    background: var(--panel-2);
    display: none;
    align-items: center;
    gap: 10px;
    font-size: 12.5px;
    color: var(--text-dim);
  }
  .statusbar.visible { display: flex; }
  .statusbar .spin {
    width: 12px;
    height: 12px;
    border: 2px solid var(--line-strong);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  .statusbar.err { color: var(--danger); }
  .statusbar.ok { color: var(--accent); }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ─── Workspace ─── */
  .workspace { flex: 1; display: flex; overflow: hidden; }
  .editor-wrap {
    flex: 1;
    overflow-y: auto;
    padding: 32px 24px 80px;
    background:
      radial-gradient(1200px 600px at 50% -200px, rgba(93, 202, 165, 0.04), transparent 60%),
      var(--bg);
  }
  .paper {
    max-width: 880px;
    margin: 0 auto;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow);
    padding: 56px 64px;
    min-height: 70vh;
    transition: box-shadow 200ms var(--ease);
  }
  .paper:focus-within { box-shadow: var(--shadow-lg); border-color: var(--line-strong); }
  .paper-title {
    font-family: "EB Garamond", serif;
    font-size: 28px;
    font-weight: 500;
    color: var(--text-strong);
    margin: 0 0 6px;
    letter-spacing: 0.01em;
  }
  .paper-meta {
    color: var(--text-dim);
    font-size: 13px;
    margin-bottom: 28px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--line);
  }
  .editor {
    font-family: "EB Garamond", "Georgia", serif;
    font-size: 17px;
    line-height: 1.75;
    color: var(--text);
    min-height: 50vh;
    outline: none;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .editor:empty::before {
    content: attr(data-placeholder);
    color: var(--muted);
    font-style: italic;
  }
  .editor p { margin: 0 0 1em; }
  .editor strong { color: var(--text-strong); font-weight: 600; }
  .editor h2 {
    font-family: "Inter", sans-serif;
    font-size: 13.5px;
    font-weight: 600;
    margin: 1.3em 0 0.5em;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--accent);
  }

  /* ─── AI Preview panel ─── */
  .ai-preview {
    max-width: 880px;
    margin: 16px auto 0;
    border: 1px solid var(--accent);
    background: var(--panel);
    border-radius: var(--radius-lg);
    overflow: hidden;
    box-shadow: var(--shadow);
    display: none;
  }
  .ai-preview.visible { display: block; }
  .ai-preview-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 20px;
    background: var(--accent-soft);
    border-bottom: 1px solid var(--accent);
  }
  .ai-preview-title {
    color: var(--accent);
    font-weight: 600;
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .ai-preview-actions { display: flex; gap: 8px; }
  .ai-preview-body {
    padding: 20px 24px;
    font-family: "EB Garamond", serif;
    font-size: 16px;
    line-height: 1.7;
    color: var(--text);
    max-height: 50vh;
    overflow-y: auto;
    white-space: pre-wrap;
  }
  .stream-cursor {
    display: inline-block;
    width: 2px;
    height: 1em;
    background: var(--accent);
    animation: blink 0.8s infinite;
    vertical-align: text-bottom;
    margin-left: 1px;
  }
  @keyframes blink { 50% { opacity: 0; } }

  /* ─── Modale ─── */
  .modal-backdrop {
    position: fixed; inset: 0;
    background: rgba(5, 13, 26, 0.7);
    backdrop-filter: blur(4px);
    z-index: 100;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .modal-backdrop.visible { display: flex; }
  .modal {
    width: 100%;
    max-width: 520px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-lg);
    padding: 24px;
  }
  .modal h3 {
    margin: 0 0 16px;
    color: var(--text-strong);
    font-size: 17px;
    font-weight: 600;
  }
  .modal label {
    display: block;
    font-size: 13px;
    color: var(--text-dim);
    margin-bottom: 6px;
    font-weight: 500;
  }
  .modal textarea,
  .modal input[type="text"] {
    width: 100%;
    padding: 10px 12px;
    border-radius: var(--radius-sm);
    background: var(--bg-elevated);
    color: var(--text);
    border: 1px solid var(--line-strong);
    font: inherit;
    font-size: 14px;
    resize: vertical;
    outline: none;
    transition: border-color 150ms var(--ease), box-shadow 150ms var(--ease);
  }
  .modal textarea:focus,
  .modal input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  .modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 16px;
  }

  .sep { flex: 1; }

  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    padding: 12px 20px;
    background: var(--panel);
    border: 1px solid var(--accent);
    border-radius: var(--radius);
    box-shadow: var(--shadow-lg);
    color: var(--text);
    font-size: 13px;
    z-index: 200;
    opacity: 0;
    transition: all 250ms var(--ease);
    pointer-events: none;
  }
  .toast.visible { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.err { border-color: var(--danger); color: var(--danger); }

  /* ─── Checklist module ─── */
          esistente o in nuovo blocco
       2) HTML markup — bottone toolbar + aside drawer
       3) Script JS — wire del drawer + CHECKLIST_TEMPLATES data

     Dipendenze:
       - var CHECKLIST_TEMPLATES (in JS) — i 49 esami strutturati
       - window functions: streamChatCompletion(payload, onDelta)
       - window helpers (opzionali): insertIntoEditor, getEditorText
============================================================ -->

  /* ─── Bottone toolbar "Checklist" ─── */
  .cl-toggle {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    height: 34px;
    padding: 0 12px;
    border-radius: 8px;
    background: transparent;
    color: var(--text, #e8edf5);
    border: 1px solid transparent;
    cursor: pointer;
    font: inherit;
    font-size: 13px;
    font-weight: 500;
    transition: background 150ms cubic-bezier(.16,1,.3,1), border-color 150ms;
  }
  .cl-toggle:hover { background: var(--panel-hover, rgba(93,202,165,.08)); }
  .cl-toggle.active {
    background: var(--accent-soft, rgba(93,202,165,.12));
    color: var(--accent, #5DCAA5);
    border-color: var(--accent, #5DCAA5);
  }
  .cl-toggle svg { width: 16px; height: 16px; }

  /* ─── Backdrop (non più usato in modalità inline, mantenuto per retro-compat) ─── */
  .cl-backdrop { display: none; }

  /* ─── Pannello checklist INLINE accanto all'editor ─────────
     Non è più un drawer overlay: vive dentro al workspace flex,
     occupa width 0 quando chiuso e una porzione fissa quando aperto.
     L'editor a sinistra si rimpicciolisce automaticamente. */
  .cl-drawer {
    flex-shrink: 0;
    width: 0;
    overflow: hidden;
    background: var(--panel-2, #112340);
    border-left: 1px solid var(--line-strong, #2c4a76);
    display: flex; flex-direction: column;
    color: var(--text, #e8edf5);
    transition: width 280ms cubic-bezier(.16,1,.3,1);
    /* min-width interno: quando si apre, il contenuto è leggibile */
  }
  .cl-drawer.open { width: 50%; }
  /* Min-width interno per evitare collasso del contenuto durante l'animazione,
     ma più piccolo del 50% così su layout stretti il contenuto è leggibile. */
  .cl-drawer > * { min-width: min(420px, 100%); }

  /* Quando la checklist è aperta, il paper dell'editor si allarga a tutta
     la larghezza disponibile (niente più 880px centered con spazio libero
     ai lati) e i margini esterni del workspace si stringono. */
  .workspace:has(.cl-drawer.open) .paper { max-width: 100%; }
  .workspace:has(.cl-drawer.open) .editor-wrap { padding: 32px 22px 80px; }
  .workspace:has(.cl-drawer.open) .paper { padding: 40px 44px; }

  .cl-header {
    padding: 18px 22px 14px;
    border-bottom: 1px solid var(--line, #1f3a5e);
    display: flex; flex-direction: column; gap: 12px;
  }
  .cl-title-row {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px;
  }
  .cl-title {
    font-family: "EB Garamond", Georgia, serif;
    font-size: 22px; font-weight: 600;
    color: var(--text-strong, #fff);
    letter-spacing: 0.01em;
  }
  .cl-title .accent { color: var(--accent, #5DCAA5); }
  .cl-close {
    width: 32px; height: 32px;
    background: transparent;
    border: 1px solid var(--line, #1f3a5e);
    border-radius: 8px;
    color: var(--text-dim, #8a9ab5);
    cursor: pointer;
    display: grid; place-items: center;
    transition: all 150ms;
  }
  .cl-close:hover { color: var(--text-strong, #fff); border-color: var(--line-strong, #2c4a76); }
  .cl-close svg { width: 14px; height: 14px; }

  .cl-template-select {
    width: 100%;
    padding: 10px 12px;
    background: var(--bg-elevated, #0a1628);
    color: var(--text, #e8edf5);
    border: 1px solid var(--line-strong, #2c4a76);
    border-radius: 8px;
    font: inherit; font-size: 13.5px;
    cursor: pointer;
  }
  .cl-template-select:focus {
    outline: none;
    border-color: var(--accent, #5DCAA5);
    box-shadow: 0 0 0 3px var(--accent-soft, rgba(93,202,165,.12));
  }

  .cl-meta-bar {
    display: flex; align-items: center; gap: 12px;
    font-size: 12px; color: var(--text-dim, #8a9ab5);
    min-height: 20px;
  }
  .cl-meta-bar .progress { color: var(--accent, #5DCAA5); font-weight: 600; }
  .cl-meta-bar .modality {
    padding: 2px 8px;
    background: var(--accent-soft, rgba(93,202,165,.12));
    color: var(--accent, #5DCAA5);
    border-radius: 999px;
    font-size: 10.5px; font-weight: 700;
    letter-spacing: 0.08em; text-transform: uppercase;
  }

  /* ─── Body scrollabile con le voci ─── */
  .cl-body {
    flex: 1;
    overflow-y: auto;
    padding: 14px 22px 22px;
  }
  .cl-empty {
    padding: 40px 16px;
    text-align: center;
    color: var(--text-dim, #8a9ab5);
    font-size: 13.5px; line-height: 1.6;
  }
  .cl-empty strong { color: var(--accent, #5DCAA5); }

  .cl-item {
    background: var(--panel-2, #112340);
    border: 1px solid var(--line, #1f3a5e);
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 8px;
    transition: border-color 150ms;
  }
  .cl-item.is-normal { border-color: rgba(93,202,165,.45); background: rgba(93,202,165,.05); }
  .cl-item.is-prompt { border-color: rgba(244,192,101,.55); }

  .cl-item-head {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 8px;
  }
  .cl-item-name {
    flex: 1;
    font-size: 13.5px; font-weight: 600;
    color: var(--text-strong, #fff);
  }

  .cl-state-btn {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 4px 10px;
    background: transparent;
    color: var(--text-dim, #8a9ab5);
    border: 1px solid var(--line-strong, #2c4a76);
    border-radius: 6px;
    font: inherit; font-size: 11.5px; font-weight: 600;
    cursor: pointer;
    transition: all 150ms;
  }
  .cl-state-btn:hover { color: var(--text-strong, #fff); border-color: var(--accent, #5DCAA5); }
  .cl-state-btn.active.normal {
    background: var(--accent, #5DCAA5);
    color: var(--accent-ink, #050d1a);
    border-color: var(--accent, #5DCAA5);
  }
  .cl-state-btn.active.prompt {
    background: var(--warn, #f4c065);
    color: #1a1a1a;
    border-color: var(--warn, #f4c065);
  }

  .cl-item-text {
    font-size: 13px; line-height: 1.55;
    color: var(--text, #e8edf5);
    font-family: "EB Garamond", Georgia, serif;
    font-size: 14.5px;
  }
  .cl-item-note {
    width: 100%;
    margin-top: 6px;
    padding: 8px 10px;
    background: var(--bg-elevated, #050d1a);
    color: var(--text, #e8edf5);
    border: 1px solid var(--line-strong, #2c4a76);
    border-radius: 6px;
    font: inherit; font-size: 13px;
    resize: vertical; min-height: 60px;
    outline: none;
    font-family: "EB Garamond", Georgia, serif;
  }
  .cl-item-note:focus {
    border-color: var(--warn, #f4c065);
    box-shadow: 0 0 0 3px rgba(244,192,101,.18);
  }

  /* Wrapper della textarea-nota con bottone mic in basso a destra */
  .cl-note-wrap { position: relative; }
  .cl-note-wrap .cl-item-note { padding-right: 44px !important; }
  .cl-mic-btn {
    position: absolute;
    right: 6px; bottom: 6px;
    height: 30px; min-width: 30px;
    padding: 0 8px;
    border-radius: 6px;
    background: var(--accent-soft, rgba(93,202,165,.12));
    color: var(--accent, #5DCAA5);
    border: 1px solid var(--line-strong, #2c4a76);
    cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 4px;
    transition: background 150ms, border-color 150ms, color 150ms, width 150ms;
    font: inherit; font-size: 11px; font-weight: 700;
    letter-spacing: 0.05em;
  }
  .cl-mic-btn:hover {
    background: rgba(93,202,165,.22);
    border-color: var(--accent, #5DCAA5);
  }
  .cl-mic-btn svg { width: 14px; height: 14px; }
  .cl-mic-btn.rec {
    background: var(--danger, #e07070);
    color: #fff;
    border-color: var(--danger, #e07070);
  }
  .cl-mic-btn.rec .rec-dot-mic {
    width: 8px; height: 8px; border-radius: 50%;
    background: #fff;
    animation: pulse 1.2s infinite;
  }

  /* ─── Footer con bottoni azione ─── */
  .cl-footer {
    padding: 14px 22px 18px;
    border-top: 1px solid var(--line, #1f3a5e);
    display: flex; gap: 8px;
    background: var(--panel, #0a1628);
  }
  .cl-btn {
    flex: 1;
    padding: 11px 14px;
    border-radius: 8px;
    font: inherit; font-size: 13px; font-weight: 600;
    cursor: pointer;
    border: 1px solid transparent;
    transition: all 150ms;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  }
  .cl-btn-ghost {
    background: transparent;
    color: var(--text-dim, #8a9ab5);
    border-color: var(--line-strong, #2c4a76);
  }
  .cl-btn-ghost:hover { color: var(--text-strong, #fff); border-color: var(--text-dim, #8a9ab5); }
  .cl-btn-primary {
    background: var(--accent, #5DCAA5);
    color: var(--accent-ink, #050d1a);
    border-color: var(--accent, #5DCAA5);
  }
  .cl-btn-primary:hover { background: var(--accent-strong, #7ed8b8); }
  .cl-btn:disabled { opacity: .5; cursor: not-allowed; }
  .cl-btn svg { width: 14px; height: 14px; }

  @media (max-width: 900px) {
    /* Su schermi stretti: torna a comportamento drawer overlay perché
       lo split side-by-side non ha più senso. */
    .cl-drawer {
      position: fixed; top: 0; right: 0; bottom: 0;
      width: min(540px, 90vw);
      z-index: 100;
      transform: translateX(100%);

<!-- ============================================================
     Editor + Dictation + AI pipeline
     ============================================================ -->
<script>
(function () {
  'use strict';

  const $ = (id) => document.getElementById(id);
  const editor = $('editor');
  const statusbar = $('statusbar');
  const statusText = $('statusText');
  const statusSpin = $('statusSpin');
  const toastEl = $('toast');
  const aiPreview = $('aiPreview');
  const aiPreviewBody = $('aiPreviewBody');
  const aiPreviewKind = $('aiPreviewKind');

  let writingStyle = 'prose'; // 'prose' | 'synth'
  let baseFontSize = 17;
  let savedSelectionRange = null;

  // ─── Utilities ─────────────────────────────────────────────
  function setStatus(text, mode) {
    if (!text) {
      statusbar.classList.remove('visible', 'err', 'ok');
      return;
    }
    statusbar.classList.add('visible');
    statusbar.classList.toggle('err', mode === 'err');
    statusbar.classList.toggle('ok', mode === 'ok');
    statusSpin.style.display = (mode === 'err' || mode === 'ok') ? 'none' : 'inline-block';
    statusText.textContent = text;
  }

  function showToast(msg, mode) {
    toastEl.textContent = msg;
    toastEl.classList.toggle('err', mode === 'err');
    toastEl.classList.add('visible');
    clearTimeout(toastEl._t);
    toastEl._t = setTimeout(() => toastEl.classList.remove('visible'), 2400);
  }

  function todayString() {
    return new Date().toLocaleDateString('it-IT', { day: 'numeric', month: 'long', year: 'numeric' });
  }

  function getEditorText() {
    let raw = '';
    editor.childNodes.forEach((node) => {
      if (node.nodeType === Node.TEXT_NODE) raw += node.textContent + '\n';
      else if (node.nodeType === Node.ELEMENT_NODE) raw += node.innerText + '\n';
    });
    return raw.replace(/\n{3,}/g, '\n\n').trim();
  }

  function saveSelection() {
    const sel = window.getSelection();
    if (!sel || sel.rangeCount === 0) return null;
    const range = sel.getRangeAt(0);
    if (!editor.contains(range.commonAncestorContainer)) return null;
    savedSelectionRange = range.cloneRange();
    return savedSelectionRange;
  }
  function restoreSelection() {
    if (!savedSelectionRange) return false;
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(savedSelectionRange);
    return true;
  }

  function insertIntoEditor(text, opts) {
    opts = opts || {};
    const replaceSelection = !!opts.replaceSelection;
    const asBlock = opts.asBlock !== false;
    // parseHeadings: di default ON per output AI generativi (Magic, Conclusioni,
    // Modifica con AI). Va passato a FALSE per la dettatura, dove non dobbiamo
    // mai trasformare parole maiuscole+":" in titoli che il medico non ha voluto.
    const parseHeadings = opts.parseHeadings !== false;
    editor.focus();
    if (!restoreSelection()) {
      const range = document.createRange();
      range.selectNodeContents(editor);
      range.collapse(false);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
    }
    const sel = window.getSelection();
    if (sel.rangeCount === 0) return;
    let range = sel.getRangeAt(0);
    if (replaceSelection && !sel.isCollapsed) range.deleteContents();

    if (asBlock) {
      const paragraphs = String(text).split(/\n{2,}/);
      const frag = document.createDocumentFragment();
      paragraphs.forEach((para) => {
        const headingMatch = parseHeadings
          ? para.match(/^([A-ZÀÈÉÌÒÙ]{4,16}):\s*([\s\S]*)$/)
          : null;
        if (headingMatch) {
          const h = document.createElement('h2');
          h.textContent = headingMatch[1];
          frag.appendChild(h);
          if (headingMatch[2].trim()) {
            const p = document.createElement('p');
            p.textContent = headingMatch[2].trim();
            frag.appendChild(p);
          }
        } else {
          const p = document.createElement('p');
          const lines = para.split('\n');
          lines.forEach((line, idx) => {
            if (idx > 0) p.appendChild(document.createElement('br'));
            p.appendChild(document.createTextNode(line));
          });
          frag.appendChild(p);
        }
      });
      range.insertNode(frag);
      range.collapse(false);
    } else {
      const textNode = document.createTextNode(text);
      range.insertNode(textNode);
      range.setStartAfter(textNode);
      range.setEndAfter(textNode);
    }
    sel.removeAllRanges();
    sel.addRange(range);
    editor.focus();
  }

  // ─── Toolbar bindings ──────────────────────────────────────
  document.querySelectorAll('.tbtn[data-cmd]').forEach((btn) => {
    btn.addEventListener('click', () => {
      editor.focus();
      document.execCommand(btn.dataset.cmd, false, null);
    });
  });

  $('btnFontUp').addEventListener('click', () => {
    baseFontSize = Math.min(24, baseFontSize + 1);
    editor.style.fontSize = baseFontSize + 'px';
  });
  $('btnFontDown').addEventListener('click', () => {
    baseFontSize = Math.max(13, baseFontSize - 1);
    editor.style.fontSize = baseFontSize + 'px';
  });

  $('btnStyleProse').addEventListener('click', () => {
    writingStyle = 'prose';
    $('btnStyleProse').classList.add('active');
    $('btnStyleSynth').classList.remove('active');
  });
  $('btnStyleSynth').addEventListener('click', () => {
    writingStyle = 'synth';
    $('btnStyleSynth').classList.add('active');
    $('btnStyleProse').classList.remove('active');
  });

  $('btnCopy').addEventListener('click', async () => {
    const text = getEditorText();
    try { await navigator.clipboard.writeText(text); showToast('Testo copiato negli appunti'); }
    catch (e) { showToast('Copia non riuscita', 'err'); }
  });

  $('btnPdf').addEventListener('click', () => downloadPdf());

  // ─── Reset completo dell'editor ───────────────────────────
  $('btnReset').addEventListener('click', () => {
    // Niente da fare se è già vuoto
    if (!getEditorText().trim()) {
      showToast('Editor già vuoto');
      return;
    }
    const ok = window.confirm('Svuotare completamente l\'editor?\n\nIl testo del referto andrà perso. Conferma solo se hai già salvato/copiato.');
    if (!ok) return;
    // Svuoto editor, chiudo eventuale preview AI, resetto stato
    editor.innerHTML = '';
    if (aiPreview && aiPreview.classList.contains('visible')) closePreview();
    savedSelectionRange = null;
    setStatus('');
    editor.focus();
    showToast('Editor azzerato');
  });

  // ─── Dictation (Whisper) ───────────────────────────────────
  const recState = {
    recorder: null,
    chunks: [],
    mimeType: '',
    startedAt: 0,
    timerId: null,
    isRecording: false,
  };

  const btnRec = $('btnRec');

  btnRec.addEventListener('click', async () => {
    if (recState.isRecording) await stopRecording();
    else await startRecording();
  });

  async function startRecording() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      showToast('Microfono non disponibile in questo browser', 'err');
      return;
    }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const candidates = [
        'audio/webm;codecs=opus',
        'audio/webm',
        'audio/ogg;codecs=opus',
        'audio/mp4',
      ];
      let mimeType = '';
      for (const m of candidates) {
        if (window.MediaRecorder && MediaRecorder.isTypeSupported(m)) { mimeType = m; break; }
      }
      const mr = mimeType ? new MediaRecorder(stream, { mimeType }) : new MediaRecorder(stream);

      recState.recorder = mr;
      recState.chunks = [];
      recState.mimeType = mr.mimeType || mimeType || 'audio/webm';
      mr.ondataavailable = (e) => { if (e.data && e.data.size) recState.chunks.push(e.data); };
      mr.onstop = onRecorderStop;
      mr.start(250);

      recState.isRecording = true;
      recState.startedAt = Date.now();
      saveSelection();

      btnRec.classList.add('active');
      btnRec.innerHTML = '';
      const dot = document.createElement('span'); dot.className = 'rec-dot'; btnRec.appendChild(dot);
      const lab = document.createElement('span'); lab.textContent = 'Stop'; btnRec.appendChild(lab);
      const tim = document.createElement('span'); tim.className = 'rec-timer'; tim.textContent = '0:00'; btnRec.appendChild(tim);
      recState.timerId = setInterval(tickTimer, 500);
      setStatus('Sto registrando…');
    } catch (e) {
      console.error(e);
      showToast('Impossibile accedere al microfono', 'err');
    }
  }

  function tickTimer() {
    const elapsed = Math.floor((Date.now() - recState.startedAt) / 1000);
    const m = Math.floor(elapsed / 60);
    const s = elapsed % 60;
    const t = m + ':' + String(s).padStart(2, '0');
    const node = btnRec.querySelector('.rec-timer');
    if (node) node.textContent = t;
  }

  async function stopRecording() {
    if (!recState.recorder) return;
    try { recState.recorder.stop(); } catch {}
    try { recState.recorder.stream.getTracks().forEach((t) => t.stop()); } catch {}
    clearInterval(recState.timerId);
    recState.timerId = null;
    recState.isRecording = false;
    btnRec.classList.remove('active');
    btnRec.innerHTML = '';
    btnRec.insertAdjacentHTML('beforeend',
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg><span>Detta</span>');
  }

  async function onRecorderStop() {
    setStatus('Trascrizione in corso…');
    try {
      const blob = new Blob(recState.chunks, { type: recState.mimeType || 'audio/webm' });
      if (blob.size < 1000) {
        setStatus('Audio troppo breve', 'err');
        setTimeout(() => setStatus(''), 1800);
        return;
      }
      const rawText = await transcribeBlobDirect(blob);
      if (!rawText) {
        setStatus('Trascrizione vuota', 'err');
        setTimeout(() => setStatus(''), 1800);
        return;
      }
      // 1) correzioni mediche context-aware sulla raw Whisper (colecisti, ecc.)
      // 2) preprocessing punteggiatura parlata (virgola, punto, ecc.)
      const corrected = applyMedicalCorrections(rawText);
      const pre = preprocessDictation(corrected);
      setStatus('Pulizia testo con AI…');
      // La dettatura è la voce del medico — la inseriamo direttamente
      // nell'editor senza chiedere conferma (a differenza degli output AI
      // generativi come Magic, Conclusioni e Modifica con AI).
      let buffer = '';
      await cleanupDictationAI(pre, (delta) => { buffer += delta; });
      const cleaned = buffer.trim();
      if (cleaned) {
        // Dettatura: niente parsing di headings — il testo va inserito
        // fedele a quello che il medico ha dettato, niente <h2> auto-generati.
        insertIntoEditor(cleaned, { replaceSelection: false, asBlock: true, parseHeadings: false });
      }
      setStatus('Testo inserito', 'ok');
      setTimeout(() => setStatus(''), 1200);
    } catch (err) {
      console.error(err);
      setStatus('Errore: ' + (err && err.message ? err.message : 'trascrizione fallita'), 'err');
      setTimeout(() => setStatus(''), 2500);
    }
  }

  function makeCursor() {
    const c = document.createElement('span');
    c.className = 'stream-cursor';
    return c;
  }

  // ─── Correzioni mediche context-aware ─────────────────────
  // Applicate DOPO Whisper, PRIMA del cleanup AI. Pattern molto restrittivi:
  // matchiamo SOLO quando il contesto è inequivocabile (es. "le cisti" seguito
  // da un termine biliare → "colecisti"). Mai sostituzioni cieche, che
  // romperebbero frasi legittime tipo "le cisti renali multiple".
  function applyMedicalCorrections(text) {
    if (!text) return text;
    let t = text;
    const rules = [
      // colecisti — solo se seguito da termini biliari/strutturali tipici
      [/\b(la|le|de(?:lla|lle))\s+cisti(\s+(?:alitiasic|distes|pareti|normo|colecist|in\s+sede|con\s+pareti|non\s+disteso|disteso|fondo|infundibul|litiasic))/gi,
        (_, p1, p2) => (p1.toLowerCase().startsWith('de') ? 'della colecisti' : (p1.toLowerCase() === 'la' ? 'la colecisti' : 'la colecisti')) + p2],
      // coledoco — Whisper a volte spezza "co e doco" / "co le doco" / "il dotto co"
      [/\bco[\s-]*le[\s-]*doc[ck]?o\b/gi, 'coledoco'],
      [/\bdotto\s+co[\s-]*le[\s-]*doc?o\b/gi, 'dotto coledoco'],
      [/\bdotto\s+col[\s-]*doc?o\b/gi, 'dotto coledoco'],
      // alitiasica spelling
      [/\bali\s*tia\s*sica\b/gi, 'alitiasica'],
      [/\ba[\s-]*litiasica\b/gi, 'alitiasica'],
      // pericolecistica
      [/\bperi[\s-]*cole[\s-]*cisti[\s-]*ca\b/gi, 'pericolecistica'],
      // parenchima troncato
      [/\bparen[\s-]*chima\b/gi, 'parenchima'],
      [/\bparen[\s-]*chi(?=[a-z])/gi, 'parenchim'],
      // ecostruttura/ecogenicità
      [/\bec(?:o)?[\s-]*strut(?:tura)?\b/gi, 'ecostruttura'],
      [/\bec(?:o)?[\s-]*gen(?:icit[aà])?\b/gi, 'ecogenicità'],
      [/\biper[\s-]*ec(?:o)?[\s-]*gen[a-z]*\b/gi, 'iperecogeno'],
      [/\bipo[\s-]*ec(?:o)?[\s-]*gen[a-z]*\b/gi, 'ipoecogeno'],
      [/\biso[\s-]*ec(?:o)?[\s-]*gen[a-z]*\b/gi, 'isoecogeno'],
      [/\ban[\s-]*ec(?:o)?[\s-]*gen[a-z]*\b/gi, 'anecogeno'],
      // vie biliari
      [/\bvie\s+bili(?:ari)?\s+intra[\s-]*epatiche\b/gi, 'vie biliari intraepatiche'],
      [/\bvie\s+bili(?:ari)?\s+extra[\s-]*epatiche\b/gi, 'vie biliari extraepatiche'],
      // ground glass
      [/\bground\s*g[la]ss\b/gi, 'ground glass'],
      // cuffia dei rotatori
      [/\bcuffia\s+dei?\s+rotatori\b/gi, 'cuffia dei rotatori'],
      // mdc / ev / e.v.
      [/\bmezzo\s+di\s+contrasto\b/gi, 'mezzo di contrasto'],
      [/\b(?:e[\s.]*v[\s.]?|endo[\s-]?venoso)\b/gi, 'ev'],
      // ─── Acronimi parlati
      [/\bti\s+ci\b/gi, 'TC'],
      [/\bTAC\b/g, 'TC'],
      [/\berre\s+emme\b/gi, 'RM'],
      [/\brisonanza(\s+magnetica)?\b/gi, 'RM'],
      [/\berre\s+ics\b/gi, 'RX'],
      [/\bemme\s+di\s+ci\b/gi, 'mdc'],
      [/\bm\.?d\.?c\.?\b/gi, 'mdc'],
      [/\bunit[aà]\s+hounsfield\b/gi, 'HU'],
      // ─── Vertebre cervicali / dorsali / lombari (esplicite per affidabilità)
      [/\belle\s+uno\b/gi, 'L1'], [/\belle\s+due\b/gi, 'L2'], [/\belle\s+tre\b/gi, 'L3'],
      [/\belle\s+quattro\b/gi, 'L4'], [/\belle\s+cinque\b/gi, 'L5'],
      [/\besse\s+uno\b/gi, 'S1'], [/\besse\s+due\b/gi, 'S2'],
      [/\bci\s+uno\b/gi, 'C1'], [/\bci\s+due\b/gi, 'C2'], [/\bci\s+tre\b/gi, 'C3'],
      [/\bci\s+quattro\b/gi, 'C4'], [/\bci\s+cinque\b/gi, 'C5'],
      [/\bci\s+sei\b/gi, 'C6'], [/\bci\s+sette\b/gi, 'C7'],
      [/\bdi\s+uno\b/gi, 'D1'], [/\bdi\s+due\b/gi, 'D2'], [/\bdi\s+tre\b/gi, 'D3'],
      [/\bdi\s+(quattro|cinque|sei|sette|otto|nove|dieci|undici|dodici)\b/gi,
        (_, n) => 'D' + ({quattro:'4',cinque:'5',sei:'6',sette:'7',otto:'8',nove:'9',dieci:'10',undici:'11',dodici:'12'}[n.toLowerCase()])],
      // ─── Misure (parola intera → abbreviazione)
      [/\bmillimetr[oi]\b/gi, 'mm'],
      [/\bcentimetr[oi]\b/gi, 'cm'],
      [/\bmillilitr[oi]\b/gi, 'ml'],
      // ─── Dx / Sn dopo anatomia
      [/\b(rene|polmone|lobo|emisfero|ginocchio|spalla|anca|piede|mano|gamba|braccio|ovaio|tubo|surrene|testicolo|seno|emicampo)\s+destr[oa]\b/gi,
        (_, w) => w + ' dx'],
      [/\b(rene|polmone|lobo|emisfero|ginocchio|spalla|anca|piede|mano|gamba|braccio|ovaio|tubo|surrene|testicolo|seno|emicampo)\s+sinistr[oa]\b/gi,
        (_, w) => w + ' sn'],
      // ─── Densità / intensità / segnale
      [/\biper[\s-]*dens[oai]\b/gi, 'iperdenso'],
      [/\bipo[\s-]*dens[oai]\b/gi, 'ipodenso'],
      [/\biso[\s-]*dens[oai]\b/gi, 'isodenso'],
      [/\biper[\s-]*intens[oai]\b/gi, 'iperintenso'],
      [/\bipo[\s-]*intens[oai]\b/gi, 'ipointenso'],
      [/\biso[\s-]*intens[oai]\b/gi, 'isointenso'],
      // ─── Errori split tipici
      [/\bil\s+i\s+polmonari\b/gi, 'ili polmonari'],
      [/\bili\s+polmonare\b/gi, 'ili polmonari'],
      // ─── Termini composti spesso troncati
      [/\bleuco[\s-]*encefalo[\s-]*patia\b/gi, 'leucoencefalopatia'],
      [/\bsovra[\s-]*spinato\b/gi, 'sovraspinato'],
      [/\bsotto[\s-]*spinato\b/gi, 'sottospinato'],
      [/\bsotto[\s-]*scapolare\b/gi, 'sottoscapolare'],
      [/\bcrociato\s+anter(?:iore)?\b/gi, 'crociato anteriore'],
      [/\bcrociato\s+poster(?:iore)?\b/gi, 'crociato posteriore'],
      [/\bbroncho[\s-]*ectas/gi, 'bronchiectas'],
      // ─── Frasi standard
      [/\bnon\s+si\s+apprezzano?\s+alterazioni?\s+focali?\s+di\s+rili?evo\b/gi,
        'non si apprezzano alterazioni focali di rilievo'],
      [/\bnei\s+limiti\s+per\s+l[ae']?\s+et[aà]\b/gi, "nei limiti per l'età"],
      [/\bcorrelazione\s+clinic[ao]\b/gi, 'correlazione clinica'],
    ];
    for (const r of rules) {
      t = t.replace(r[0], r[1]);
    }
    return t;
  }

  // ─── Preprocessing dittatura ──────────────────────────────
  function preprocessDictation(text) {
    if (!text) return '';
    let t = ' ' + text + ' ';
    const rules = [
      [/\s+virgola\b/gi, ','],
      [/\s+punto e virgola\b/gi, ';'],
      [/\s+due punti\b/gi, ':'],
      [/\s+punto interrogativo\b/gi, '?'],
      [/\s+punto esclamativo\b/gi, '!'],
      [/\s+punto\b(?!\s*\d)/gi, '.'],
      [/\s+a capo\b/gi, '\n'],
      [/\s+nuova riga\b/gi, '\n'],
      [/\s+nuovo paragrafo\b/gi, '\n\n'],
      [/\s+apri parentesi\b/gi, ' ('],
      [/\s+chiudi parentesi\b/gi, ')'],
      [/\s+trattino\b/gi, ' - '],
      [/\s+barra\b/gi, '/'],
    ];
    rules.forEach((r) => { t = t.replace(r[0], r[1]); });
    t = t.replace(/\s*([,;:.!?])\s*/g, '$1 ');
    t = t.replace(/\(\s+/g, '(').replace(/\s+\)/g, ')');
    t = t.replace(/[ \t]+/g, ' ').replace(/ ?\n ?/g, '\n').trim();
    t = t.replace(/(^|[.!?]\s+)([a-zàèéìòù])/g, (_, p, c) => p + c.toUpperCase());
    return t;
  }

  // ─── Whisper transcribe (gpt-4o-transcribe + whisper-1) ───

    'fegato, parenchima epatico, colecisti, alitiasica, pericolecistica, coledoco,',

    'milza, surrene, reni, calici, bacinetto renale, ureteri, vescica, prostata,',
    'vena porta, vena cava inferiore, aorta addominale, mesentere, ascite, idronefrosi.',
    // ─── Torace
    'parenchima polmonare, lobi polmonari, mediastino, ilo polmonare, ili polmonari,',
    'pleura, versamento pleurico, atelettasia, addensamento, ground glass, opacità,',
    'nodulo polmonare, micronodulo, bronchiectasie, embolia polmonare, aorta toracica.',
    // ─── Neuro
    'encefalo, falce cerebrale, tentorio, ventricoli laterali, terzo ventricolo,',
    'corpo calloso, nuclei della base, talami, cervelletto, vermis,',
    'sostanza bianca, sostanza grigia, leucoencefalopatia, atrofia corticale,',
    'gliosi, edema vasogenico, emorragia, ischemia, ictus, ipofisi, sella turcica.',
    // ─── MSK + rachide
    'cuffia dei rotatori, sovraspinato, sottospinato, sottoscapolare, labbro glenoideo,',
    'menisco mediale, menisco laterale, cartilagine articolare, condropatia,',
    'edema midollare, frattura, tendinopatia, legamento crociato anteriore, crociato posteriore,',
    'C1, C2, C5, C7, D1, D12, L1, L4, L5, S1, rachide cervicale, rachide lombare.',
    // ─── Patologia comune
    'lesione, ematoma, infarto, calcoli, cisti, polipo, nodulo, neoformazione, massa,',
    'linfoadenomegalia, linfonodale, linfonodi, calcolosi, idroureterite.',
    // ─── Frasi tipiche
    'non si apprezzano alterazioni focali di rilievo, in assenza di alterazioni significative,',

  ].join(' ');

  function buildWhisperPrompt() {
    const userKeywords = (typeof WHISPER_PROMPT === 'string' && WHISPER_PROMPT.trim())
      ? WHISPER_PROMPT.trim()
      : '';
    // Limite ~224 token: base + keyword utente. Tagliamo per sicurezza.
    const combined = userKeywords
      ? (WHISPER_BASE_IT + ' Termini ricorrenti del medico: ' + userKeywords + '.')
      : WHISPER_BASE_IT;
    // Whisper API tronca a ~224 token (~1500-1800 char) — passiamo tutto,
    // l'API farà lei il truncate se serve.
    return combined.slice(0, 1800);
  }

  async function transcribeBlobDirect(blob) {
    try {
      return await attemptTranscribe(blob, 'gpt-4o-transcribe');
    } catch (err) {
      const msg = String(err && err.message || '');
      const isFormatError = /400|format|corrupt|unsupported|decode/i.test(msg);
      if (!isFormatError) throw err;
      console.warn('Fallback whisper-1 per:', msg);
      return await attemptTranscribe(blob, 'whisper-1');
    }
  }

  async function attemptTranscribe(blob, model) {
    const ext = (blob.type || '').includes('mp4') ? 'mp4'
      : (blob.type || '').includes('ogg') ? 'ogg'
      : 'webm';
    const fd = new FormData();
    fd.append('file', blob, 'dictation.' + ext);
    fd.append('model', model);
    fd.append('language', 'it');
    const promptText = buildWhisperPrompt();
    if (promptText) fd.append('prompt', promptText);
    // Temperature 0 → output più ancorato al dizionario contestuale.
    fd.append('temperature', '0');
    fd.append('response_format', 'json');

    const headers = {};
    if (PROXY_AUTH && PROXY_AUTH !== 'session') headers['Authorization'] = 'Bearer ' + PROXY_AUTH;

    const r = await fetch(PROXY_URL + '/v1/audio/transcriptions', {
      method: 'POST',
      headers,
      body: fd,
    });
    if (!r.ok) {
      const txt = await r.text().catch(() => '');
      throw new Error('STT ' + model + ': ' + r.status + ' ' + txt.slice(0, 200));
    }
    const data = await r.json();
    return (data && (data.text || data.transcript || '')) || '';
  }

  // ─── AI cleanup streaming ─────────────────────────────────
  // Filosofia: questa funzione è SOLO un correttore ortografico/punteggiatura.
  // Il medico deve rivedersi nel testo prodotto: nessun rimodellamento, nessuna
  // aggiunta di sezioni, nessuna sostituzione di sinonimi.
  async function cleanupDictationAI(rawText, onDelta) {
    const system = [
      'Sei un correttore ortografico per dettatura medica radiologica.',
      'Restituisci il testo del medico ESATTAMENTE COM’È, con SOLO queste correzioni minime:',
      '1) punteggiatura mancante o errata (virgole, punti, due punti);',
      '2) refusi ortografici evidenti;',
      '3) spaziature doppie o errate;',
      '4) maiuscola a inizio frase e dopo il punto;',
      '5) ripetizioni accidentali della stessa parola ("il il", "di di", "non non").',
      'TERMINOLOGIA MEDICA: se il testo contiene parole tecniche radiologiche corrette (colecisti, coledoco, pericolecistica, alitiasica, parenchima, ecostruttura, ground glass, ecc.), MANTIENILE LETTERALI — non sostituirle con sinonimi non medici.',
      'REGOLE ASSOLUTE — non infrangerle MAI:',
      '- NON aggiungere parole, frasi, sezioni o titoli che il medico non ha dettato.',
      '- NON inserire titoli come "TECNICA", "REPERTI", "CONCLUSIONI", "INDICAZIONE" se il medico non li ha pronunciati.',
      '- NON cambiare l’ordine delle frasi.',
      '- NON sintetizzare, riassumere o accorciare nulla.',
      '- NON espandere, parafrasare o "migliorare" il linguaggio.',
      '- NON sostituire sinonimi: se ha detto "mostra" mantieni "mostra", non "evidenzia"; se ha detto "si vede" mantieni "si vede".',
      '- NON aggiungere formule di chiusura, raccomandazioni o suggerimenti clinici.',
      '- NON convertire elenchi in prosa, né prosa in elenchi.',
      '- Mantieni esattamente lo stile dettato (discorsivo o sintetico che sia).',
      '- Mantieni connettivi colloquiali ("però", "quindi", "inoltre", "comunque") così come detti.',
      'Se sei in dubbio se correggere qualcosa, NON correggerlo.',
      'Restituisci SOLO il testo corretto, niente commenti, niente intestazioni, niente note.',
    ].join(' ');

    await streamChatCompletion({
      model: 'gpt-4o-mini',
      messages: [
        { role: 'system', content: system },
        { role: 'user', content: rawText },
      ],
      temperature: 0,
    
      max_tokens: Math.min(2000, Math.max(200, Math.ceil(rawText.length / 2))),
    }, onDelta);
  }

  /**
   * Estrae metodica + distretto dall'indicazione dell'utente.
   * Es: "eco tiroide tiroidite cronica" → {modality:'Ecografia', district:'tiroide'}
   *     "TC encefalo basale negativo"   → {modality:'TC', district:'encefalo'}
   *     "RM rachide lombare"            → {modality:'RM', district:'rachide lombare'}
   * Serve a vincolare l'AI a generare un referto SOLO per quel distretto,
   * evitando che applichi template completi del distillato (es. eco addome)
   * a esami diversi (es. eco tiroide).
   */
  function extractExamFocus(text) {
    if (!text) return null;
    const t = text.toLowerCase();
    // Modalità (ordine: più specifico prima)
    const MODALITY_RX = [
      [/\bangio[\s-]?tc\b/, 'angio-TC'],
      [/\bangio[\s-]?rm\b/, 'angio-RM'],
      [/\btc[\s-]?total[\s-]?body\b/, 'TC total body'],
      [/\b(tc|tac)\b/, 'TC'],
      [/\b(rm|risonanza)\b/, 'RM'],
      [/\b(rx|radiografia)\b/, 'RX'],
      [/\b(ecografia|eco|us)\b/, 'Ecografia'],
      [/\b(mammografia|mammo)\b/, 'Mammografia'],
      [/\bpet\b/, 'PET'],
    ];
    // Distretti (ordine: più specifico prima)
    const DISTRICT_RX = [
      [/\bencefalo\b/, 'encefalo'],
      [/\b(rachide\s+cervicale|cervicale)\b/, 'rachide cervicale'],
      [/\b(rachide\s+dorsale|dorsale)\b/, 'rachide dorsale'],
      [/\b(rachide\s+lombare|lombare|lombo[\s-]?sacrale)\b/, 'rachide lombare'],
      [/\b(rachide|colonna)\b/, 'rachide'],
      [/\b(collo|cervicale)\b/, 'collo'],
      [/\btiroide\b/, 'tiroide'],
      [/\b(mammell?[ae]|seno)\b/, 'mammella'],
      [/\btorace\b/, 'torace'],
      [/\b(polmon[ei]|polmonare)\b/, 'polmoni'],
      [/\b(addome\s+completo|addome\s+superiore|addome\s+inferiore|addome)\b/, 'addome'],
      [/\b(fegato|epatic[oa])\b/, 'fegato'],
      [/\bcolecisti\b/, 'vie biliari'],
      [/\b(reni|renal[ei])\b/, 'reni'],
      [/\b(prostata|prostatic[oa])\b/, 'prostata'],
      [/\b(pelvi|pelvic[oa])\b/, 'pelvi'],
      [/\butero\b/, 'utero'],
      [/\b(spalla|cuffia)\b/, 'spalla'],
      [/\b(ginocchio|menisco)\b/, 'ginocchio'],
      [/\b(anca|anche|coxo)\b/, 'anca'],
      [/\b(caviglia|piede)\b/, 'caviglia'],
      [/\b(polso|mano)\b/, 'polso'],
      [/\b(gomito)\b/, 'gomito'],
    ];
    let modality = null, district = null;
    for (const [rx, label] of MODALITY_RX) { if (rx.test(t)) { modality = label; break; } }
    for (const [rx, label] of DISTRICT_RX) { if (rx.test(t)) { district = label; break; } }
    if (!modality && !district) return null;
    return { modality, district };
  }

  async function aiGenerateMagicDraft(input, onDelta) {
    const styleHint = writingStyle === 'synth'
      ? 'Usa stile sintetico, sezioni chiare, elenchi quando utile.'
      : 'Usa stile discorsivo italiano medico, paragrafi compiuti.';

    // Pre-estraggo metodica + distretto: vincolo forte per l'AI affinché
    // generi un referto SOLO per quel distretto/metodica, anche quando il
    // distillato contiene template di esami diversi.
    const focus = extractExamFocus(input);
    const focusLine = focus
      ? `FOCUS DELL'ESAME: ${focus.modality || '(modalità non specificata)'} — ${focus.district || '(distretto non specificato)'}. Il referto descriverà SOLO questo esame su questo distretto. NON descrivere altri distretti (es. se distretto = "tiroide", NON menzionare fegato/addome/reni/altro). Se nel distillato esistono template di altre regioni, IGNORALI completamente.`

  // ─── SSE streaming wrapper ────────────────────────────────
  async function streamChatCompletion(payload, onDelta) {
    const headers = { 'Content-Type': 'application/json' };
    if (PROXY_AUTH && PROXY_AUTH !== 'session') headers['Authorization'] = 'Bearer ' + PROXY_AUTH;

    const r = await fetch(PROXY_URL + '/v1/chat/completions', {
      method: 'POST',
      headers,
      body: JSON.stringify(Object.assign({}, payload, { stream: true })),
    });
    if (!r.ok || !r.body) {
      const txt = await r.text().catch(() => '');
      throw new Error('AI ' + r.status + ': ' + txt.slice(0, 200));
    }
    const reader = r.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      let idx;
      while ((idx = buffer.indexOf('\n')) !== -1) {
        const line = buffer.slice(0, idx).trim();
        buffer = buffer.slice(idx + 1);
        if (!line || !line.startsWith('data:')) continue;
        const data = line.slice(5).trim();
        if (data === '[DONE]') return;
        try {
          const json = JSON.parse(data);
          const delta =
            (json.choices && json.choices[0] && json.choices[0].delta && json.choices[0].delta.content) ||
            (json.choices && json.choices[0] && json.choices[0].message && json.choices[0].message.content) ||
            '';
          if (delta) onDelta(delta);
        } catch (e) { /* ignora */ }
      }
    }
  }

        buffer += delta;

          aiPreviewBody.textContent = buffer;
          aiPreviewBody.appendChild(makeCursor());

      });

    } catch (err) {
      console.error(err);
      setStatus('Magic fallito: ' + err.message, 'err');
      setTimeout(() => setStatus(''), 2500);
      closePreview();
    }
  });

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  }

    setTimeout(() => { try { w.print(); } catch {} }, 400);
  }

  }

  document.addEventListener('keydown', (e) => {

  // Esposta per la checklist module:
  window.streamChatCompletion = streamChatCompletion;
  window.refertiumInsertChecklistDraft = function(text) {

    if (!editor) return;

    insertIntoEditor(text, { replaceSelection: false, asBlock: true, parseHeadings: true });
  };

  /**
   * window.refertiumStartDictation(opts) — riusato dalla checklist (e da chiunque
   * voglia dettare in una textarea / input). Apre MediaRecorder, ritorna un
   * controller con `stop()` che restituisce una Promise<string> col testo
   * pulito (Whisper + correzioni mediche + cleanup AI).
   *
   * Uso:
   *   const ctrl = await window.refertiumStartDictation();
   *   // ...user parla...
   *   const text = await ctrl.stop();
   *   textarea.value += text;
   */
  window.refertiumStartDictation = async function() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      throw new Error('Microfono non disponibile in questo browser');
    }
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const candidates = ['audio/webm;codecs=opus','audio/webm','audio/ogg;codecs=opus','audio/mp4'];
    let mimeType = '';
    for (const m of candidates) {
      if (window.MediaRecorder && MediaRecorder.isTypeSupported(m)) { mimeType = m; break; }
    }
    const mr = mimeType ? new MediaRecorder(stream, { mimeType }) : new MediaRecorder(stream);
    const chunks = [];
    const realMime = mr.mimeType || mimeType || 'audio/webm';
    mr.ondataavailable = (e) => { if (e.data && e.data.size) chunks.push(e.data); };
    mr.start(250);
    let stopped = false;
    return {
      stop: () => new Promise((resolve, reject) => {
        if (stopped) return resolve('');
        stopped = true;
        mr.onstop = async () => {
          try { stream.getTracks().forEach((t) => t.stop()); } catch {}
          try {
            const blob = new Blob(chunks, { type: realMime });
            if (blob.size < 1000) return resolve('');
            const raw = await transcribeBlobDirect(blob);
            if (!raw) return resolve('');
            const corrected = applyMedicalCorrections(raw);
            const pre = preprocessDictation(corrected);
            let buffer = '';
            await cleanupDictationAI(pre, (delta) => { buffer += delta; });
            resolve(buffer.trim());
          } catch (err) { reject(err); }
        };
        try { mr.stop(); } catch (e) { reject(e); }
      }),
      cancel: () => {
        if (stopped) return;
        stopped = true;
        try { mr.stop(); } catch {}
        try { stream.getTracks().forEach((t) => t.stop()); } catch {}
      },
    };
  };
  

})();

/* ============================================================
   CHECKLIST WIRE — drawer logic
   ============================================================ */
(function wireChecklist() {
  'use strict';
  const STATE_KEY = 'refertium_checklist_state_v2';

  let cstate = { templateId: null, voci: {} };

  function $(id) { return document.getElementById(id); }
  const toggleBtn  = $('clToggle');
  const drawer     = $('clDrawer');
  const backdrop   = $('clBackdrop');
  const closeBtn   = $('clCloseBtn');
  const select     = $('clTemplateSelect');
  const body       = $('clBody');
  const progress   = $('clProgress');
  const modality   = $('clModality');
  const resetBtn   = $('clResetBtn');
  const generateBtn= $('clGenerateBtn');

  if (!toggleBtn || !drawer) return; // markup non inserito

  // ─── Persistence ─────────────────────────────────────────
  try {
    const raw = sessionStorage.getItem(STATE_KEY);
    if (raw) cstate = JSON.parse(raw);
  } catch { cstate = { templateId: null, voci: {} }; }
  if (!cstate.voci) cstate.voci = {};

  function saveState() {
    try { sessionStorage.setItem(STATE_KEY, JSON.stringify(cstate)); } catch {}
  }

  // ─── Build dropdown options ──────────────────────────────
  const templates = window.CHECKLIST_TEMPLATES || {};
  Object.keys(templates).forEach((id) => {
    const opt = document.createElement('option');
    opt.value = id;
    opt.textContent = templates[id].label || id;
    select.appendChild(opt);
  });

  // ─── Open / close drawer ─────────────────────────────────
  function openDrawer() {
    drawer.classList.add('open');
    backdrop.classList.add('open');
    toggleBtn.classList.add('active');
    if (cstate.templateId) {
      select.value = cstate.templateId;
      renderTemplate(cstate.templateId);
    }
  }
  function closeDrawer() {
    drawer.classList.remove('open');
    backdrop.classList.remove('open');
    toggleBtn.classList.remove('active');
  }
  toggleBtn.addEventListener('click', () => {
    if (drawer.classList.contains('open')) closeDrawer();
    else openDrawer();
  });
  closeBtn.addEventListener('click', closeDrawer);
  backdrop.addEventListener('click', closeDrawer);

  // ─── Template selection ──────────────────────────────────
  select.addEventListener('change', () => {
    const id = select.value;
    if (id && (!cstate.templateId || cstate.templateId !== id)) {
      cstate = { templateId: id, voci: {} };
      saveState();
    } else if (!id) {
      cstate = { templateId: null, voci: {} };
      saveState();
    }
    renderTemplate(id);
  });

  // ─── Render ──────────────────────────────────────────────
  function renderTemplate(id) {
    if (!id) {
      body.innerHTML = `
        <div class="cl-empty">
          Seleziona un esame dall'elenco qui sopra.<br><br>
          Per ogni voce premi <strong>Normale</strong> se il reperto è regolare,
          oppure <strong>Nota</strong> e scrivi la descrizione del reperto patologico.
        </div>`;
      progress.textContent = '';
      modality.style.display = 'none';
      generateBtn.disabled = true;
      return;
    }
    const tpl = templates[id];
    if (!tpl) return;
    modality.textContent = tpl.modalita || '';
    modality.style.display = tpl.modalita ? 'inline-flex' : 'none';
    body.innerHTML = '';
    tpl.voci.forEach((voce) => {
      body.appendChild(renderVoce(voce));
    });
    updateProgress();
  }

  function renderVoce(voce) {
    const v = cstate.voci[voce.id] || { state: null, text: '' };
    const item = document.createElement('div');
    item.className = 'cl-item' + (v.state === 'normal' ? ' is-normal' : v.state === 'prompt' ? ' is-prompt' : '');

    const head = document.createElement('div');
    head.className = 'cl-item-head';

    const name = document.createElement('span');
    name.className = 'cl-item-name';
    name.textContent = voce.nome;
    head.appendChild(name);

    const btnNormal = document.createElement('button');
    btnNormal.className = 'cl-state-btn' + (v.state === 'normal' ? ' active normal' : '');
    btnNormal.type = 'button';
    btnNormal.textContent = 'Normale';
    btnNormal.addEventListener('click', () => {
      cstate.voci[voce.id] = { state: v.state === 'normal' ? null : 'normal', text: '' };
      saveState();
      // re-render full item per stato visivo
      const next = renderVoce(voce);
      item.replaceWith(next);
      updateProgress();
    });
    head.appendChild(btnNormal);

    const btnPrompt = document.createElement('button');
    btnPrompt.className = 'cl-state-btn' + (v.state === 'prompt' ? ' active prompt' : '');
    btnPrompt.type = 'button';
    btnPrompt.textContent = 'Nota';
    btnPrompt.addEventListener('click', () => {
      cstate.voci[voce.id] = { state: v.state === 'prompt' ? null : 'prompt', text: v.text || '' };
      saveState();
      const next = renderVoce(voce);
      item.replaceWith(next);
      updateProgress();
    });
    head.appendChild(btnPrompt);

    item.appendChild(head);

    if (v.state === 'normal') {
      const text = document.createElement('div');
      text.className = 'cl-item-text';
      text.textContent = voce.normale;
      item.appendChild(text);
    } else if (v.state === 'prompt') {
      const wrap = document.createElement('div');
      wrap.className = 'cl-note-wrap';

      const ta = document.createElement('textarea');
      ta.className = 'cl-item-note';
      ta.value = v.text || '';
      ta.addEventListener('input', () => {
        cstate.voci[voce.id] = { state: 'prompt', text: ta.value };
        saveState();
        updateProgress();
      });
      wrap.appendChild(ta);

      // Bottone microfono dentro la textarea (riusa refertiumStartDictation)
      const micBtn = document.createElement('button');
      micBtn.type = 'button';
      micBtn.className = 'cl-mic-btn';
      micBtn.title = 'Detta nel campo';
      const micSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>';
      micBtn.innerHTML = micSvg;
      let dictCtrl = null;
      let busy = false;
      micBtn.addEventListener('click', async () => {
        if (busy) return;
        if (typeof window.refertiumStartDictation !== 'function') {
          console.warn('refertiumStartDictation non esposta dal template');
          return;
        }
        if (dictCtrl) {
          // Stop registrazione + processa
          busy = true;
          micBtn.disabled = true;
          micBtn.innerHTML = '<span style="font-size:10px">…</span>';
          try {
            const text = await dictCtrl.stop();
            dictCtrl = null;
            if (text) {
              const cur = ta.value.trim();
              ta.value = cur ? (cur + ' ' + text) : text;
              cstate.voci[voce.id] = { state: 'prompt', text: ta.value };
              saveState();
              updateProgress();
              ta.focus();
            }
          } catch (e) {
            console.error('Dictation error:', e);
            dictCtrl = null;
          } finally {
            busy = false;
            micBtn.disabled = false;
            micBtn.classList.remove('rec');
            micBtn.innerHTML = micSvg;
          }
        } else {
          // Avvia registrazione
          try {
            dictCtrl = await window.refertiumStartDictation();
            micBtn.classList.add('rec');
            micBtn.innerHTML = '<span class="rec-dot-mic"></span><span>STOP</span>';
          } catch (e) {
            console.error('Mic error:', e);
            dictCtrl = null;
          }
        }
      });
      wrap.appendChild(micBtn);

      item.appendChild(wrap);
    }
    return item;
  }

  function updateProgress() {
    const tpl = cstate.templateId && templates[cstate.templateId];
    if (!tpl) { progress.textContent = ''; generateBtn.disabled = true; return; }
    const total = tpl.voci.length;
    const compiled = tpl.voci.filter((v) => {
      const s = cstate.voci[v.id];
      return s && (s.state === 'normal' || (s.state === 'prompt' && s.text && s.text.trim()));
    }).length;
    progress.textContent = compiled + ' / ' + total + ' voci';
    generateBtn.disabled = compiled === 0;
  }

  // ─── Reset ───────────────────────────────────────────────
  resetBtn.addEventListener('click', () => {
    cstate = { templateId: cstate.templateId, voci: {} };
    saveState();
    if (cstate.templateId) renderTemplate(cstate.templateId);
  });

  // ─── Generate report via AI ──────────────────────────────
  generateBtn.addEventListener('click', async () => {
    const tpl = cstate.templateId && templates[cstate.templateId];
    if (!tpl) return;
    const voci = tpl.voci.map((v) => {
      const s = cstate.voci[v.id];
      if (!s || !s.state) return null;
      if (s.state === 'normal') return { nome: v.nome, normale: v.normale };
      if (s.state === 'prompt' && s.text && s.text.trim()) {
        return { nome: v.nome, nota: s.text.trim() };
      }
      return null;
    }).filter(Boolean);
    if (!voci.length) return;

    generateBtn.disabled = true;
    const oldLabel = generateBtn.innerHTML;
    generateBtn.innerHTML = '⏳ Genero…';

    try {
      const draft = await generateReportFromChecklist(tpl, voci);
      // Inserisci nel editor — usa la funzione del template host se disponibile
      if (typeof window.refertiumInsertChecklistDraft === 'function') {
        window.refertiumInsertChecklistDraft(draft);
      } else {
        const editor = document.getElementById('editor');
        if (editor) {
          editor.innerHTML = '';
          draft.split(/\n{2,}/).forEach((para) => {
            const p = document.createElement('p');
            const lines = para.split('\n');
            lines.forEach((line, idx) => {
              if (idx > 0) p.appendChild(document.createElement('br'));
              p.appendChild(document.createTextNode(line));
            });
            editor.appendChild(p);
          });
        }
      }
      closeDrawer();
    } catch (err) {
      console.error('checklist generate failed:', err);
      alert('Errore generazione: ' + (err.message || 'sconosciuto'));
    } finally {
      generateBtn.innerHTML = oldLabel;
      updateProgress();
    }
  });

  // Riempie il riepilogo voci e chiama l'AI per ricomporre un referto continuo.
  async function generateReportFromChecklist(tpl, voci) {
    if (typeof window.streamChatCompletion !== 'function') {
      throw new Error('streamChatCompletion non disponibile');
    }
    const lines = voci.map((v) => {
      if (v.normale) return '- ' + v.nome + ': [NORMALE] ' + v.normale;
      return '- ' + v.nome + ': [REPERTO] ' + v.nota;
    }).join('\n');

    const system = [
      'Sei un radiologo esperto. Hai una lista di voci di una checklist strutturata',
      'per l\'esame "' + tpl.label + '" (modalità ' + (tpl.modalita || 'radiologica') + ').',
      'Per ciascuna voce ho indicato se è NORMALE (con la frase standard già pronta) o',
      'se ho aggiunto un REPERTO patologico (descritto in modo informale).',
      'Componi un referto radiologico continuo in italiano, ben strutturato, con:',
      '- una sezione REPERTI che integra le voci nell\'ordine dato, riformulando',
      '  in prosa medica corretta (mantieni i contenuti, non inventare nulla);',
      '- una sezione CONCLUSIONI sintetica, coerente con i reperti.',
      'Mantieni i numeri, le misure e i termini medici esatti. Per le voci NORMALI usa',
      'la frase standard fornita (eventualmente accorciata). Per i REPERTI espandi in',
      'linguaggio radiologico professionale.',
      'Output: SOLO il referto, niente commenti.',
    ].join(' ');

    let buffer = '';
    await window.streamChatCompletion({
      model: 'gpt-4o-mini',
      messages: [
        { role: 'system', content: system },
        { role: 'user', content: lines },
      ],
      temperature: 0.3,
    }, (delta) => { buffer += delta; });
    return buffer.trim();
  }

  // Esci col tasto Esc
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && drawer.classList.contains('open')) closeDrawer();
  });

})();

</script>
