<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Refertium — Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  /* ============================================================
     Refertium — Design System (dark navy + green + white)
     ============================================================ */
  :root {
    color-scheme: dark;
    --bg:           #050d1a;
    --bg-elevated:  #0a1628;
    --panel:        #0a1628;
    --panel-2:      #112340;
    --panel-hover:  rgba(93, 202, 165, 0.08);
    --line:         #1f3a5e;
    --line-strong:  #2c4a76;
    --line-focus:   rgba(93, 202, 165, 0.50);

    --text:         #e8edf5;
    --text-strong:  #ffffff;
    --text-dim:     #8a9ab5;
    --muted:        #5a6a85;

    --accent:       #5DCAA5;
    --accent-strong:#7ed8b8;
    --accent-soft:  rgba(93, 202, 165, 0.12);
    --accent-ink:   #050d1a;

    --warn:         #f4c065;
    --danger:       #e07070;

    --shadow-sm:    0 1px 2px rgba(0, 0, 0, 0.4);
    --shadow:       0 4px 12px -2px rgba(0, 0, 0, 0.4);
    --shadow-lg:    0 12px 32px -6px rgba(0, 0, 0, 0.55);

    --radius:       10px;
    --radius-sm:    8px;
    --radius-lg:    14px;
    --ease:         cubic-bezier(0.16, 1, 0.3, 1);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: "Inter", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    font-size: 14px;
    line-height: 1.6;
    letter-spacing: -0.005em;
  }

  ::selection {
    background: var(--accent);
    color: var(--accent-ink);
  }

  .app {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  /* ─── Top bar ─── */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 14px 24px;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .brand-mark {
    font-family: "EB Garamond", serif;
    font-size: 22px;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: var(--text-strong);
  }
  .brand-mark .accent { color: var(--accent); }

  .doctor-badge {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 6px 12px;
    border-radius: 999px;
    background: var(--panel-2);
    border: 1px solid var(--line);
    font-size: 12.5px;
    color: var(--text-dim);
  }
  .doctor-badge-name { color: var(--text); font-weight: 500; }
  .doctor-badge-md { color: var(--accent); font-weight: 600; margin-left: 4px; }
  .doctor-badge-divider { width: 1px; height: 14px; background: var(--line-strong); }
  .doctor-badge-specialty,
  .doctor-badge-specialties { display: inline-flex; align-items: center; gap: 4px; color: var(--accent); }
  .doctor-badge-specialty svg { width: 16px; height: 16px; }

  /* ─── Toolbar ─── */
  .toolbar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    padding: 10px 24px;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .tool-group {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 0 6px;
    border-right: 1px solid var(--line);
  }
  .tool-group:last-child { border-right: none; }

  .tbtn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    height: 34px;
    padding: 0 12px;
    border-radius: var(--radius-sm);
    background: transparent;
    color: var(--text);
    border: 1px solid transparent;
    cursor: pointer;
    font: inherit;
    font-size: 13px;
    font-weight: 500;
    transition: background 150ms var(--ease), border-color 150ms var(--ease), color 150ms var(--ease);
  }
  .tbtn:hover { background: var(--panel-hover); }
  .tbtn.active { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
  .tbtn.primary { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
  .tbtn.primary:hover { background: var(--accent-strong); }
  .tbtn.danger { color: var(--danger); }
  .tbtn.danger:hover { background: rgba(224, 112, 112, 0.10); }
  .tbtn:disabled { opacity: 0.5; cursor: not-allowed; }
  .tbtn svg { width: 16px; height: 16px; }

  .rec-dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--danger);
    animation: pulse 1.2s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(0.85); }
  }
  .rec-timer {
    font-variant-numeric: tabular-nums;
    color: var(--text-dim);
    font-size: 12px;
    min-width: 36px;
  }

  /* ─── Status bar ─── */
  .statusbar {
    padding: 8px 24px;
    border-bottom: 1px solid var(--line);
    background: var(--panel-2);
    display: none;
    align-items: center;
    gap: 10px;
    font-size: 12.5px;
    color: var(--text-dim);
  }
  .statusbar.visible { display: flex; }
  .statusbar .spin {
    width: 12px;
    height: 12px;
    border: 2px solid var(--line-strong);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  .statusbar.err { color: var(--danger); }
  .statusbar.ok { color: var(--accent); }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ─── Workspace ─── */
  .workspace { flex: 1; display: flex; overflow: hidden; }
  .editor-wrap {
    flex: 1;
    overflow-y: auto;
    padding: 32px 24px 80px;
    background:
      radial-gradient(1200px 600px at 50% -200px, rgba(93, 202, 165, 0.04), transparent 60%),
      var(--bg);
  }
  .paper {
    max-width: 880px;
    margin: 0 auto;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow);
    padding: 56px 64px;
    min-height: 70vh;
    transition: box-shadow 200ms var(--ease);
  }
  .paper:focus-within { box-shadow: var(--shadow-lg); border-color: var(--line-strong); }
  .paper-title {
    font-family: "EB Garamond", serif;
    font-size: 28px;
    font-weight: 500;
    color: var(--text-strong);
    margin: 0 0 6px;
    letter-spacing: 0.01em;
  }
  .paper-meta {
    color: var(--text-dim);
    font-size: 13px;
    margin-bottom: 28px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--line);
  }
  .editor {
    font-family: "EB Garamond", "Georgia", serif;
    font-size: 17px;
    line-height: 1.75;
    color: var(--text);
    min-height: 50vh;
    outline: none;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .editor:empty::before {
    content: attr(data-placeholder);
    color: var(--muted);
    font-style: italic;
  }
  .editor p { margin: 0 0 1em; }
  .editor strong { color: var(--text-strong); font-weight: 600; }
  .editor h2 {
    font-family: "Inter", sans-serif;
    font-size: 13.5px;
    font-weight: 600;
    margin: 1.3em 0 0.5em;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--accent);
  }

  /* ─── AI Preview panel ─── */
  .ai-preview {
    max-width: 880px;
    margin: 16px auto 0;
    border: 1px solid var(--accent);
    background: var(--panel);
    border-radius: var(--radius-lg);
    overflow: hidden;
    box-shadow: var(--shadow);
    display: none;
  }
  .ai-preview.visible { display: block; }
  .ai-preview-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 20px;
    background: var(--accent-soft);
    border-bottom: 1px solid var(--accent);
  }
  .ai-preview-title {
    color: var(--accent);
    font-weight: 600;
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .ai-preview-actions { display: flex; gap: 8px; }
  .ai-preview-body {
    padding: 20px 24px;
    font-family: "EB Garamond", serif;
    font-size: 16px;
    line-height: 1.7;
    color: var(--text);
    max-height: 50vh;
    overflow-y: auto;
    white-space: pre-wrap;
  }
  .stream-cursor {
    display: inline-block;
    width: 2px;
    height: 1em;
    background: var(--accent);
    animation: blink 0.8s infinite;
    vertical-align: text-bottom;
    margin-left: 1px;
  }
  @keyframes blink { 50% { opacity: 0; } }

  /* ─── Modale ─── */
  .modal-backdrop {
    position: fixed; inset: 0;
    background: rgba(5, 13, 26, 0.7);
    backdrop-filter: blur(4px);
    z-index: 100;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .modal-backdrop.visible { display: flex; }
  .modal {
    width: 100%;
    max-width: 520px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-lg);
    padding: 24px;
  }
  .modal h3 {
    margin: 0 0 16px;
    color: var(--text-strong);
    font-size: 17px;
    font-weight: 600;
  }
  .modal label {
    display: block;
    font-size: 13px;
    color: var(--text-dim);
    margin-bottom: 6px;
    font-weight: 500;
  }
  .modal textarea,
  .modal input[type="text"] {
    width: 100%;
    padding: 10px 12px;
    border-radius: var(--radius-sm);
    background: var(--bg-elevated);
    color: var(--text);
    border: 1px solid var(--line-strong);
    font: inherit;
    font-size: 14px;
    resize: vertical;
    outline: none;
    transition: border-color 150ms var(--ease), box-shadow 150ms var(--ease);
  }
  .modal textarea:focus,
  .modal input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  .modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 16px;
  }

  .sep { flex: 1; }

  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    padding: 12px 20px;
    background: var(--panel);
    border: 1px solid var(--accent);
    border-radius: var(--radius);
    box-shadow: var(--shadow-lg);
    color: var(--text);
    font-size: 13px;
    z-index: 200;
    opacity: 0;
    transition: all 250ms var(--ease);
    pointer-events: none;
  }
  .toast.visible { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.err { border-color: var(--danger); color: var(--danger); }
</style>
</head>

<!-- ============================================================
     Editor + Dictation + AI pipeline
     ============================================================ -->
<script>
(function () {
  'use strict';

  const $ = (id) => document.getElementById(id);
  const editor = $('editor');
  const statusbar = $('statusbar');
  const statusText = $('statusText');
  const statusSpin = $('statusSpin');
  const toastEl = $('toast');
  const aiPreview = $('aiPreview');
  const aiPreviewBody = $('aiPreviewBody');
  const aiPreviewKind = $('aiPreviewKind');

  let writingStyle = 'prose'; // 'prose' | 'synth'
  let baseFontSize = 17;
  let savedSelectionRange = null;

  // ─── Utilities ─────────────────────────────────────────────
  function setStatus(text, mode) {
    if (!text) {
      statusbar.classList.remove('visible', 'err', 'ok');
      return;
    }
    statusbar.classList.add('visible');
    statusbar.classList.toggle('err', mode === 'err');
    statusbar.classList.toggle('ok', mode === 'ok');
    statusSpin.style.display = (mode === 'err' || mode === 'ok') ? 'none' : 'inline-block';
    statusText.textContent = text;
  }

  function showToast(msg, mode) {
    toastEl.textContent = msg;
    toastEl.classList.toggle('err', mode === 'err');
    toastEl.classList.add('visible');
    clearTimeout(toastEl._t);
    toastEl._t = setTimeout(() => toastEl.classList.remove('visible'), 2400);
  }

  function todayString() {
    return new Date().toLocaleDateString('it-IT', { day: 'numeric', month: 'long', year: 'numeric' });
  }

  function getEditorText() {
    let raw = '';
    editor.childNodes.forEach((node) => {
      if (node.nodeType === Node.TEXT_NODE) raw += node.textContent + '\n';
      else if (node.nodeType === Node.ELEMENT_NODE) raw += node.innerText + '\n';
    });
    return raw.replace(/\n{3,}/g, '\n\n').trim();
  }

  function saveSelection() {
    const sel = window.getSelection();
    if (!sel || sel.rangeCount === 0) return null;
    const range = sel.getRangeAt(0);
    if (!editor.contains(range.commonAncestorContainer)) return null;
    savedSelectionRange = range.cloneRange();
    return savedSelectionRange;
  }
  function restoreSelection() {
    if (!savedSelectionRange) return false;
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(savedSelectionRange);
    return true;
  }

  function insertIntoEditor(text, opts) {
    opts = opts || {};
    const replaceSelection = !!opts.replaceSelection;
    const asBlock = opts.asBlock !== false;
    // parseHeadings: di default ON per output AI generativi (Magic, Conclusioni,
    // Modifica con AI). Va passato a FALSE per la dettatura, dove non dobbiamo
    // mai trasformare parole maiuscole+":" in titoli che il medico non ha voluto.
    const parseHeadings = opts.parseHeadings !== false;
    editor.focus();
    if (!restoreSelection()) {
      const range = document.createRange();
      range.selectNodeContents(editor);
      range.collapse(false);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
    }
    const sel = window.getSelection();
    if (sel.rangeCount === 0) return;
    let range = sel.getRangeAt(0);
    if (replaceSelection && !sel.isCollapsed) range.deleteContents();

    if (asBlock) {
      const paragraphs = String(text).split(/\n{2,}/);
      const frag = document.createDocumentFragment();
      paragraphs.forEach((para) => {
        const headingMatch = parseHeadings
          ? para.match(/^([A-ZÀÈÉÌÒÙ]{4,16}):\s*([\s\S]*)$/)
          : null;
        if (headingMatch) {
          const h = document.createElement('h2');
          h.textContent = headingMatch[1];
          frag.appendChild(h);
          if (headingMatch[2].trim()) {
            const p = document.createElement('p');
            p.textContent = headingMatch[2].trim();
            frag.appendChild(p);
          }
        } else {
          const p = document.createElement('p');
          const lines = para.split('\n');
          lines.forEach((line, idx) => {
            if (idx > 0) p.appendChild(document.createElement('br'));
            p.appendChild(document.createTextNode(line));
          });
          frag.appendChild(p);
        }
      });
      range.insertNode(frag);
      range.collapse(false);
    } else {
      const textNode = document.createTextNode(text);
      range.insertNode(textNode);
      range.setStartAfter(textNode);
      range.setEndAfter(textNode);
    }
    sel.removeAllRanges();
    sel.addRange(range);
    editor.focus();
  }

  // ─── Dictation (Whisper) ───────────────────────────────────
  const recState = {
    recorder: null,
    chunks: [],
    mimeType: '',
    startedAt: 0,
    timerId: null,
    isRecording: false,
  };

  const btnRec = $('btnRec');

  btnRec.addEventListener('click', async () => {
    if (recState.isRecording) await stopRecording();
    else await startRecording();
  });

  async function startRecording() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      showToast('Microfono non disponibile in questo browser', 'err');
      return;
    }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const candidates = [
        'audio/webm;codecs=opus',
        'audio/webm',
        'audio/ogg;codecs=opus',
        'audio/mp4',
      ];
      let mimeType = '';
      for (const m of candidates) {
        if (window.MediaRecorder && MediaRecorder.isTypeSupported(m)) { mimeType = m; break; }
      }
      const mr = mimeType ? new MediaRecorder(stream, { mimeType }) : new MediaRecorder(stream);

      recState.recorder = mr;
      recState.chunks = [];
      recState.mimeType = mr.mimeType || mimeType || 'audio/webm';
      mr.ondataavailable = (e) => { if (e.data && e.data.size) recState.chunks.push(e.data); };
      mr.onstop = onRecorderStop;
      mr.start(250);

      recState.isRecording = true;
      recState.startedAt = Date.now();
      saveSelection();

      btnRec.classList.add('active');
      btnRec.innerHTML = '';
      const dot = document.createElement('span'); dot.className = 'rec-dot'; btnRec.appendChild(dot);
      const lab = document.createElement('span'); lab.textContent = 'Stop'; btnRec.appendChild(lab);
      const tim = document.createElement('span'); tim.className = 'rec-timer'; tim.textContent = '0:00'; btnRec.appendChild(tim);
      recState.timerId = setInterval(tickTimer, 500);
      setStatus('Sto registrando…');
    } catch (e) {
      console.error(e);
      showToast('Impossibile accedere al microfono', 'err');
    }
  }

  function tickTimer() {
    const elapsed = Math.floor((Date.now() - recState.startedAt) / 1000);
    const m = Math.floor(elapsed / 60);
    const s = elapsed % 60;
    const t = m + ':' + String(s).padStart(2, '0');
    const node = btnRec.querySelector('.rec-timer');
    if (node) node.textContent = t;
  }

  async function stopRecording() {
    if (!recState.recorder) return;
    try { recState.recorder.stop(); } catch {}
    try { recState.recorder.stream.getTracks().forEach((t) => t.stop()); } catch {}
    clearInterval(recState.timerId);
    recState.timerId = null;
    recState.isRecording = false;
    btnRec.classList.remove('active');
    btnRec.innerHTML = '';
    btnRec.insertAdjacentHTML('beforeend',
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg><span>Detta</span>');
  }

  async function onRecorderStop() {
    setStatus('Trascrizione in corso…');
    try {
      const blob = new Blob(recState.chunks, { type: recState.mimeType || 'audio/webm' });
      if (blob.size < 1000) {
        setStatus('Audio troppo breve', 'err');
        setTimeout(() => setStatus(''), 1800);
        return;
      }
      const rawText = await transcribeBlobDirect(blob);
      if (!rawText) {
        setStatus('Trascrizione vuota', 'err');
        setTimeout(() => setStatus(''), 1800);
        return;
      }
      // 1) correzioni mediche context-aware sulla raw Whisper (colecisti, ecc.)
      // 2) preprocessing punteggiatura parlata (virgola, punto, ecc.)
      const corrected = applyMedicalCorrections(rawText);
      const pre = preprocessDictation(corrected);
      setStatus('Pulizia testo con AI…');
      // La dettatura è la voce del medico — la inseriamo direttamente
      // nell'editor senza chiedere conferma (a differenza degli output AI
      // generativi come Magic, Conclusioni e Modifica con AI).
      let buffer = '';
      await cleanupDictationAI(pre, (delta) => { buffer += delta; });
      const cleaned = buffer.trim();
      if (cleaned) {
        // Dettatura: niente parsing di headings — il testo va inserito
        // fedele a quello che il medico ha dettato, niente <h2> auto-generati.
        insertIntoEditor(cleaned, { replaceSelection: false, asBlock: true, parseHeadings: false });
      }
      setStatus('Testo inserito', 'ok');
      setTimeout(() => setStatus(''), 1200);
    } catch (err) {
      console.error(err);
      setStatus('Errore: ' + (err && err.message ? err.message : 'trascrizione fallita'), 'err');
      setTimeout(() => setStatus(''), 2500);
    }
  }

  function makeCursor() {
    const c = document.createElement('span');
    c.className = 'stream-cursor';
    return c;
  }

  // ─── Correzioni mediche context-aware ─────────────────────
  // Applicate DOPO Whisper, PRIMA del cleanup AI. Pattern molto restrittivi:
  // matchiamo SOLO quando il contesto è inequivocabile (es. "le cisti" seguito
  // da un termine biliare → "colecisti"). Mai sostituzioni cieche, che
  // romperebbero frasi legittime tipo "le cisti renali multiple".
  function applyMedicalCorrections(text) {
    if (!text) return text;
    let t = text;
    const rules = [
      // colecisti — solo se seguito da termini biliari/strutturali tipici
      [/\b(la|le|de(?:lla|lle))\s+cisti(\s+(?:alitiasic|distes|pareti|normo|colecist|in\s+sede|con\s+pareti|non\s+disteso|disteso|fondo|infundibul|litiasic))/gi,
        (_, p1, p2) => (p1.toLowerCase().startsWith('de') ? 'della colecisti' : (p1.toLowerCase() === 'la' ? 'la colecisti' : 'la colecisti')) + p2],
      // coledoco — Whisper a volte spezza "co e doco" / "co le doco" / "il dotto co"
      [/\bco[\s-]*le[\s-]*doc[ck]?o\b/gi, 'coledoco'],
      [/\bdotto\s+co[\s-]*le[\s-]*doc?o\b/gi, 'dotto coledoco'],
      [/\bdotto\s+col[\s-]*doc?o\b/gi, 'dotto coledoco'],
      // alitiasica spelling
      [/\bali\s*tia\s*sica\b/gi, 'alitiasica'],
      [/\ba[\s-]*litiasica\b/gi, 'alitiasica'],
      // pericolecistica
      [/\bperi[\s-]*cole[\s-]*cisti[\s-]*ca\b/gi, 'pericolecistica'],
      // parenchima troncato
      [/\bparen[\s-]*chima\b/gi, 'parenchima'],
      [/\bparen[\s-]*chi(?=[a-z])/gi, 'parenchim'],
      // ecostruttura/ecogenicità
      [/\bec(?:o)?[\s-]*strut(?:tura)?\b/gi, 'ecostruttura'],
      [/\bec(?:o)?[\s-]*gen(?:icit[aà])?\b/gi, 'ecogenicità'],
      [/\biper[\s-]*ec(?:o)?[\s-]*gen[a-z]*\b/gi, 'iperecogeno'],
      [/\bipo[\s-]*ec(?:o)?[\s-]*gen[a-z]*\b/gi, 'ipoecogeno'],
      [/\biso[\s-]*ec(?:o)?[\s-]*gen[a-z]*\b/gi, 'isoecogeno'],
      [/\ban[\s-]*ec(?:o)?[\s-]*gen[a-z]*\b/gi, 'anecogeno'],
      // vie biliari
      [/\bvie\s+bili(?:ari)?\s+intra[\s-]*epatiche\b/gi, 'vie biliari intraepatiche'],
      [/\bvie\s+bili(?:ari)?\s+extra[\s-]*epatiche\b/gi, 'vie biliari extraepatiche'],
      // ground glass
      [/\bground\s*g[la]ss\b/gi, 'ground glass'],
      // cuffia dei rotatori
      [/\bcuffia\s+dei?\s+rotatori\b/gi, 'cuffia dei rotatori'],
      // mdc / ev / e.v.
      [/\bmezzo\s+di\s+contrasto\b/gi, 'mezzo di contrasto'],
      [/\b(?:e[\s.]*v[\s.]?|endo[\s-]?venoso)\b/gi, 'ev'],
    ];
    for (const r of rules) {
      t = t.replace(r[0], r[1]);
    }
    return t;
  }

  // ─── Preprocessing dittatura ──────────────────────────────
  function preprocessDictation(text) {
    if (!text) return '';
    let t = ' ' + text + ' ';
    const rules = [
      [/\s+virgola\b/gi, ','],
      [/\s+punto e virgola\b/gi, ';'],
      [/\s+due punti\b/gi, ':'],
      [/\s+punto interrogativo\b/gi, '?'],
      [/\s+punto esclamativo\b/gi, '!'],
      [/\s+punto\b(?!\s*\d)/gi, '.'],
      [/\s+a capo\b/gi, '\n'],
      [/\s+nuova riga\b/gi, '\n'],
      [/\s+nuovo paragrafo\b/gi, '\n\n'],
      [/\s+apri parentesi\b/gi, ' ('],
      [/\s+chiudi parentesi\b/gi, ')'],
      [/\s+trattino\b/gi, ' - '],
      [/\s+barra\b/gi, '/'],
    ];
    rules.forEach((r) => { t = t.replace(r[0], r[1]); });
    t = t.replace(/\s*([,;:.!?])\s*/g, '$1 ');
    t = t.replace(/\(\s+/g, '(').replace(/\s+\)/g, ')');
    t = t.replace(/[ \t]+/g, ' ').replace(/ ?\n ?/g, '\n').trim();
    t = t.replace(/(^|[.!?]\s+)([a-zàèéìòù])/g, (_, p, c) => p + c.toUpperCase());
    return t;
  }

  // ─── Whisper transcribe (gpt-4o-transcribe + whisper-1) ───
  // Dizionario radiologico italiano sempre presente nel prompt Whisper.
  // Si combina con WHISPER_PROMPT (iniettato dal backend con le keyword del
  // distillato del singolo medico) per migliorare il riconoscimento dei
  // termini tecnici che da soli — fuori contesto — Whisper sbaglia.
  // Es: "colecisti" senza prompt diventa "le cisti", "coledoco" diventa "co e doco".
  const WHISPER_BASE_IT = [
    'Refertazione radiologica.',
    // Generale
    'parenchima, ecostruttura, ecogenicità, iperecogeno, ipoecogeno, isoecogeno, anecogeno,',
    'mezzo di contrasto, mdc, intravenoso, ev, falda fluida, raccolta liquida, lesione focale,',
    'alterazione del segnale, captazione, hyperintensa, ipointensa, isointensa, restringimento.',
    // Addome
    'fegato, epatico, colecisti, alitiasica, pericolecistica, coledoco, vie biliari intraepatiche,',
    'vie biliari extraepatiche, pancreas, milza, splenico, surrene, reni, parenchimale, vescica,',
    'prostata, uretere, calice, bacinetto, vena porta, aorta addominale, vena cava, mesentere.',
    // Torace
    'parenchima polmonare, mediastino, ilo polmonare, pleura, versamento pleurico, atelettasia,',
    'addensamento, ground glass, opacità, nodulo polmonare, bronchiectasie, embolia polmonare.',
    // Neuro
    'encefalo, falce cerebrale, tentorio, ventricoli laterali, plesso coroideo, corpo calloso,',
    'nuclei della base, talami, midollo, cervelletto, vermis, sostanza bianca, sostanza grigia,',
    'leucoencefalopatia, atrofia corticale, gliosi, edema, emorragia, ischemia, ictus.',
    // MSK
    'articolazione, capsula, sinoviale, menisco, cartilagine articolare, condropatia,',
    'osso subcondrale, edema midollare, frattura, lesione legamentosa, tendine, cuffia dei rotatori,',
    'sovraspinato, sottospinato, sottoscapolare, piccolo rotondo, labbro glenoideo.',
    // Formule ricorrenti
    'non si apprezzano alterazioni focali di rilievo, in assenza di, in presenza di,',
    'quadro nei limiti per l’età, controllo clinico, consigliato approfondimento.',
  ].join(' ');

  function buildWhisperPrompt() {
    const userKeywords = (typeof WHISPER_PROMPT === 'string' && WHISPER_PROMPT.trim())
      ? WHISPER_PROMPT.trim()
      : '';
    // Limite ~224 token: base + keyword utente. Tagliamo per sicurezza.
    const combined = userKeywords
      ? (WHISPER_BASE_IT + ' Termini ricorrenti del medico: ' + userKeywords + '.')
      : WHISPER_BASE_IT;
    return combined.slice(0, 900); // soglia generosa, Whisper tronca da solo
  }

  async function transcribeBlobDirect(blob) {
    try {
      return await attemptTranscribe(blob, 'gpt-4o-transcribe');
    } catch (err) {
      const msg = String(err && err.message || '');
      const isFormatError = /400|format|corrupt|unsupported|decode/i.test(msg);
      if (!isFormatError) throw err;
      console.warn('Fallback whisper-1 per:', msg);
      return await attemptTranscribe(blob, 'whisper-1');
    }
  }

  async function attemptTranscribe(blob, model) {
    const ext = (blob.type || '').includes('mp4') ? 'mp4'
      : (blob.type || '').includes('ogg') ? 'ogg'
      : 'webm';
    const fd = new FormData();
    fd.append('file', blob, 'dictation.' + ext);
    fd.append('model', model);
    fd.append('language', 'it');
    const promptText = buildWhisperPrompt();
    if (promptText) fd.append('prompt', promptText);
    // Temperature 0 → output più ancorato al dizionario contestuale.
    fd.append('temperature', '0');
    fd.append('response_format', 'json');

    const headers = {};
    if (PROXY_AUTH && PROXY_AUTH !== 'session') headers['Authorization'] = 'Bearer ' + PROXY_AUTH;

    const r = await fetch(PROXY_URL + '/v1/audio/transcriptions', {
      method: 'POST',
      headers,
      body: fd,
    });
    if (!r.ok) {
      const txt = await r.text().catch(() => '');
      throw new Error('STT ' + model + ': ' + r.status + ' ' + txt.slice(0, 200));
    }
    const data = await r.json();
    return (data && (data.text || data.transcript || '')) || '';
  }

  // ─── AI cleanup streaming ─────────────────────────────────
  // Filosofia: questa funzione è SOLO un correttore ortografico/punteggiatura.
  // Il medico deve rivedersi nel testo prodotto: nessun rimodellamento, nessuna
  // aggiunta di sezioni, nessuna sostituzione di sinonimi.
  async function cleanupDictationAI(rawText, onDelta) {
    const system = [
      'Sei un correttore ortografico per dettatura medica radiologica.',
      'Restituisci il testo del medico ESATTAMENTE COM’È, con SOLO queste correzioni minime:',
      '1) punteggiatura mancante o errata (virgole, punti, due punti);',
      '2) refusi ortografici evidenti;',
      '3) spaziature doppie o errate;',
      '4) maiuscola a inizio frase e dopo il punto;',
      '5) ripetizioni accidentali della stessa parola ("il il", "di di", "non non").',
      'TERMINOLOGIA MEDICA: se il testo contiene parole tecniche radiologiche corrette (colecisti, coledoco, pericolecistica, alitiasica, parenchima, ecostruttura, ground glass, ecc.), MANTIENILE LETTERALI — non sostituirle con sinonimi non medici.',
      'REGOLE ASSOLUTE — non infrangerle MAI:',
      '- NON aggiungere parole, frasi, sezioni o titoli che il medico non ha dettato.',
      '- NON inserire titoli come "TECNICA", "REPERTI", "CONCLUSIONI", "INDICAZIONE" se il medico non li ha pronunciati.',
      '- NON cambiare l’ordine delle frasi.',
      '- NON sintetizzare, riassumere o accorciare nulla.',
      '- NON espandere, parafrasare o "migliorare" il linguaggio.',
      '- NON sostituire sinonimi: se ha detto "mostra" mantieni "mostra", non "evidenzia"; se ha detto "si vede" mantieni "si vede".',
      '- NON aggiungere formule di chiusura, raccomandazioni o suggerimenti clinici.',
      '- NON convertire elenchi in prosa, né prosa in elenchi.',
      '- Mantieni esattamente lo stile dettato (discorsivo o sintetico che sia).',
      '- Mantieni connettivi colloquiali ("però", "quindi", "inoltre", "comunque") così come detti.',
      'Se sei in dubbio se correggere qualcosa, NON correggerlo.',
      'Restituisci SOLO il testo corretto, niente commenti, niente intestazioni, niente note.',
    ].join(' ');

    await streamChatCompletion({
      model: 'gpt-4o-mini',
      messages: [
        { role: 'system', content: system },
        { role: 'user', content: rawText },
      ],
      temperature: 0,
    }, onDelta);
  }

  async function aiGenerateMagicDraft(input, onDelta) {
    const styleHint = writingStyle === 'synth'
      ? 'Usa stile sintetico, sezioni chiare, elenchi quando utile.'
      : 'Usa stile discorsivo italiano medico, paragrafi compiuti.';

    // Costruisco il system prompt. Se il medico ha un distillato configurato
    // (MAGIC_PDF_TEXT = sue refertazioni tipiche / template / frasi ricorrenti),
    // viene SEMPRE incluso come riferimento di stile per il Magic — qualunque
    // sia il contenuto dell'editor. È così che Magic resta "personale" del
    // singolo radiologo e non genera testi a caso.
    const distillate = (typeof MAGIC_PDF_TEXT === 'string' ? MAGIC_PDF_TEXT : '').trim();
    const systemLines = [
      'Sei un assistente di refertazione radiologica in italiano.',
      'Il testo dell\'utente contiene l\'INDICAZIONE CLINICA o un appunto sintetico: espandilo in un referto strutturato con sezioni TECNICA, REPERTI, CONCLUSIONI.',
      'Se nel testo è già presente del referto, integralo migliorandone la struttura senza alterarne i reperti.',
      'NON inventare reperti specifici non plausibili: usa formulazioni neutre se mancano dettagli ("non si apprezzano alterazioni focali di rilievo", "quadro nei limiti per l\'età", ecc.).',
      'Punteggiatura, terminologia e ortografia impeccabili.',
      styleHint,
    ];
    if (distillate) {
      systemLines.push(
        '',
        'STILE E MODELLI DEL MEDICO (vincolante):',
        'Qui sotto trovi una collezione delle refertazioni tipiche di questo radiologo. È il SUO modo di referare. DEVI riproporne:',
        '- la stessa struttura di sezioni (titoli e ordine);',
        '- lo stesso lessico medico e le stesse formule ricorrenti;',
        '- lo stesso livello di dettaglio e di sintesi;',
        '- le stesse abbreviazioni e convenzioni (mdc, ev, ecc.);',
        '- lo stesso tono (discorsivo vs sintetico) coerente con quanto trovi.',
        'Quando l\'esame richiesto coincide con un template presente nel distillato, usa quel template come scheletro letterale, adattando solo i dettagli del caso.',
        'Quando non hai un template esatto, applica comunque lo stile generale (lessico, tono, formulazione neutra) ricavato dal distillato.',
        'NON inventare reperti che non risultano coerenti col distillato.',
        '',
        '=== INIZIO DISTILLATO ===',
        distillate,
        '=== FINE DISTILLATO ===',
      );
    }
    systemLines.push('', 'Output: SOLO il referto, niente commenti, niente preamboli.');
    const system = systemLines.join('\n');

    await streamChatCompletion({
      model: 'gpt-4o-mini',
      messages: [
        { role: 'system', content: system },
        { role: 'user', content: input || 'Esame radiologico generico.' },
      ],
      temperature: 0.3,
    }, onDelta);
  }

  async function aiGenerateConclusions(bodyText, onDelta) {
    const system = [
      'Sei un radiologo. Dato il CORPO del referto, scrivi solo la sezione CONCLUSIONI in italiano medico, sintetica e clinicamente coerente con i reperti descritti.',
      'NON ripetere il corpo, NON inventare reperti.',

  async function aiRewriteSelection(selectedText, instruction, onDelta) {
    const system = [
      'Sei un radiologo. Riscrivi il testo fornito secondo l\'istruzione, mantenendo italiano medico corretto.',
      'NON aggiungere reperti non presenti. Mantieni il significato clinico.',

    ].join(' ');

    }, onDelta);
  }

  // ─── SSE streaming wrapper ────────────────────────────────
  async function streamChatCompletion(payload, onDelta) {
    const headers = { 'Content-Type': 'application/json' };
    if (PROXY_AUTH && PROXY_AUTH !== 'session') headers['Authorization'] = 'Bearer ' + PROXY_AUTH;

    const r = await fetch(PROXY_URL + '/v1/chat/completions', {
      method: 'POST',
      headers,
      body: JSON.stringify(Object.assign({}, payload, { stream: true })),
    });
    if (!r.ok || !r.body) {
      const txt = await r.text().catch(() => '');
      throw new Error('AI ' + r.status + ': ' + txt.slice(0, 200));
    }
    const reader = r.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      let idx;
      while ((idx = buffer.indexOf('\n')) !== -1) {
        const line = buffer.slice(0, idx).trim();
        buffer = buffer.slice(idx + 1);
        if (!line || !line.startsWith('data:')) continue;
        const data = line.slice(5).trim();
        if (data === '[DONE]') return;
        try {
          const json = JSON.parse(data);
          const delta =
            (json.choices && json.choices[0] && json.choices[0].delta && json.choices[0].delta.content) ||
            (json.choices && json.choices[0] && json.choices[0].message && json.choices[0].message.content) ||
            '';
          if (delta) onDelta(delta);
        } catch (e) { /* ignora */ }
      }
    }
  }

  // ─── AI Preview panel ─────────────────────────────────────
  function openPreview(kind) {
    aiPreviewKind.textContent = kind || 'Proposta AI';
    aiPreviewBody.textContent = '';
    aiPreview.classList.add('visible');
    aiPreview.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
  function closePreview() {
    aiPreview.classList.remove('visible');
    aiPreviewBody.textContent = '';
  }

  let lastPreviewMode = null;
  $('aiInsert').addEventListener('click', () => {
    const text = aiPreviewBody.textContent.trim();
    if (!text) return closePreview();
    if (lastPreviewMode === 'replace') {
      insertIntoEditor(text, { replaceSelection: true, asBlock: false });
    } else {
      insertIntoEditor(text, { replaceSelection: false, asBlock: true });
    }
    closePreview();
    showToast('Inserito nel referto');
  });
  $('aiDiscard').addEventListener('click', () => closePreview());

  // ─── Magic ────────────────────────────────────────────────
  $('btnMagic').addEventListener('click', async () => {
    // L'input di Magic è SEMPRE quello dell'editor (indicazione clinica /
    // appunti). Il distillato del medico non va usato come "input": è già
    // incluso nel system prompt di aiGenerateMagicDraft come stile vincolante.
    const input = getEditorText();
    if (!input.trim()) {
      showToast('Scrivi una indicazione prima di usare Magic', 'err');
      return;
    }
    saveSelection();
    openPreview('Magic — bozza referto');
    setStatus('Generazione referto in corso…');
    let buffer = '';
    let lastRender = 0;
    lastPreviewMode = 'append';
    try {
      await aiGenerateMagicDraft(input, (delta) => {
        buffer += delta;
        const now = Date.now();
        if (now - lastRender > 80) {
          aiPreviewBody.textContent = buffer;
          aiPreviewBody.appendChild(makeCursor());
          aiPreviewBody.scrollTop = aiPreviewBody.scrollHeight;
          lastRender = now;
        }
      });
      aiPreviewBody.textContent = buffer.trim();
      setStatus('Bozza pronta', 'ok');
      setTimeout(() => setStatus(''), 1200);
    } catch (err) {
      console.error(err);
      setStatus('Magic fallito: ' + err.message, 'err');
      setTimeout(() => setStatus(''), 2500);
      closePreview();
    }
  });

  // ─── Conclusioni AI ───────────────────────────────────────
  $('btnConclusions').addEventListener('click', async () => {
    const body = getEditorText();
    if (!body.trim()) {
      showToast('Editor vuoto — scrivi prima il corpo del referto', 'err');
      return;
    }
    saveSelection();
    openPreview('Conclusioni AI');
    setStatus('Genero le conclusioni…');
    let buffer = '';
    let lastRender = 0;
    lastPreviewMode = 'append';
    try {
      await aiGenerateConclusions(body, (delta) => {
        buffer += delta;
        const now = Date.now();
        if (now - lastRender > 80) {
          aiPreviewBody.textContent = buffer;
          aiPreviewBody.appendChild(makeCursor());
          lastRender = now;
        }
      });
      aiPreviewBody.textContent = buffer.trim();
      setStatus('Conclusioni pronte', 'ok');
      setTimeout(() => setStatus(''), 1200);
    } catch (err) {
      setStatus('Conclusioni fallite: ' + err.message, 'err');
      setTimeout(() => setStatus(''), 2500);
      closePreview();
    }
  });

  // ─── Rewrite modal ────────────────────────────────────────
  const rewriteModal = $('rewriteModal');
  $('btnRewrite').addEventListener('click', () => {
    const sel = window.getSelection();
    if (!sel || sel.isCollapsed) {
      showToast('Seleziona prima il testo da modificare', 'err');
      return;
    }
    if (!editor.contains(sel.getRangeAt(0).commonAncestorContainer)) {
      showToast('Selezione fuori dall\'editor', 'err');
      return;
    }
    saveSelection();
    $('rewriteInstr').value = '';
    rewriteModal.classList.add('visible');
    setTimeout(() => $('rewriteInstr').focus(), 50);
  });
  $('rewriteCancel').addEventListener('click', () => rewriteModal.classList.remove('visible'));
  $('rewriteRun').addEventListener('click', async () => {
    const instruction = $('rewriteInstr').value.trim();
    if (!instruction) { $('rewriteInstr').focus(); return; }
    rewriteModal.classList.remove('visible');
    if (!savedSelectionRange) { showToast('Selezione persa', 'err'); return; }
    const selectedText = savedSelectionRange.toString();
    if (!selectedText.trim()) { showToast('Selezione vuota', 'err'); return; }

    openPreview('Modifica con AI');
    setStatus('Riscrivo in corso…');
    let buffer = '';
    let lastRender = 0;
    lastPreviewMode = 'replace';
    try {
      await aiRewriteSelection(selectedText, instruction, (delta) => {
        buffer += delta;
        const now = Date.now();
        if (now - lastRender > 80) {
          aiPreviewBody.textContent = buffer;
          aiPreviewBody.appendChild(makeCursor());
          lastRender = now;
        }
      });
      aiPreviewBody.textContent = buffer.trim();
      setStatus('Pronto', 'ok');
      setTimeout(() => setStatus(''), 1200);
    } catch (err) {
      setStatus('Rewrite fallito: ' + err.message, 'err');
      setTimeout(() => setStatus(''), 2500);
      closePreview();
    }
  });
  rewriteModal.addEventListener('click', (e) => {
    if (e.target === rewriteModal) rewriteModal.classList.remove('visible');
  });

  // ─── PDF download (via window.print) ──────────────────────
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  }

  function downloadPdf() {
    const text = getEditorText();
    if (!text.trim()) { showToast('Editor vuoto', 'err'); return; }
    const user = (window.__REFERTIUM_USER__ && window.__REFERTIUM_USER__.name) || 'Medico refertante';
    const html = '<!doctype html><html><head><meta charset="utf-8"><title>Refertium — Referto</title>' +
      '<style>' +
      '@page { size: A4; margin: 24mm 22mm; }' +
      'body { font-family: "EB Garamond", Georgia, serif; color:#0b1220; font-size:13pt; line-height:1.55; }' +
      'h1 { font-size:18pt; font-weight:600; margin:0 0 4pt; }' +
      '.meta { color:#475569; font-size:10.5pt; padding-bottom:6pt; border-bottom:1px solid #cbd5e1; margin-bottom:14pt; }' +
      'h2 { font-family: "Inter", Arial, sans-serif; font-size:10pt; color:#0b6e58; letter-spacing:.04em; text-transform:uppercase; margin: 16pt 0 4pt; }' +
      'p { margin: 0 0 8pt; text-align: justify; }' +
      '.foot { margin-top: 28pt; padding-top: 8pt; border-top: 1px solid #cbd5e1; font-size: 9.5pt; color:#64748b; display:flex; justify-content: space-between; }' +
      '</style></head><body>' +
      '<h1>Refertium</h1>' +
      '<div class="meta">' + todayString() + ' · ' + escapeHtml(user) + '</div>' +
      editor.innerHTML +
      '<div class="foot"><span>Refertium · referto generato il ' + todayString() + '</span><span>' + escapeHtml(user) + '</span></div>' +
      '</body></html>';
    const w = window.open('', '_blank');
    if (!w) { showToast('Pop-up bloccato — abilita popup per scaricare il PDF', 'err'); return; }
    w.document.open();
    w.document.write(html);
    w.document.close();
    w.focus();
    setTimeout(() => { try { w.print(); } catch {} }, 400);
  }

  // ─── Init ─────────────────────────────────────────────────
  $('metaDate').textContent = todayString();
  const u = window.__REFERTIUM_USER__;
  if (u && u.name) $('metaUser').textContent = u.name;

  if (typeof INCLUDE_DICTATION !== 'undefined' && !INCLUDE_DICTATION) {
    btnRec.style.display = 'none';
  }

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      if (rewriteModal.classList.contains('visible')) rewriteModal.classList.remove('visible');
      else if (aiPreview.classList.contains('visible')) closePreview();
    }
    if (e.target === editor) setTimeout(saveSelection, 0);
  });
  editor.addEventListener('mouseup', () => saveSelection());
  editor.addEventListener('keyup', () => saveSelection());

})();
</script>
