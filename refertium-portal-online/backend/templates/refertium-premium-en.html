<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Refertium — Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    color-scheme: dark;
    --bg:           #0a0a0a;
    --bg-elevated:  #141414;
    --panel:        #141414;
    --panel-2:      #1c1c1c;
    --panel-hover:  rgba(232, 220, 196, 0.08);
    --line:         #262626;
    --line-strong:  #333333;
    --line-focus:   rgba(232, 220, 196, 0.50);
    --text:         #ebebeb;
    --text-strong:  #ffffff;
    --text-dim:     #a8a8a8;
    --muted:        #6b6b6b;
    --accent:       #e8dcc4;
    --accent-strong:#f0e6d1;
    --accent-soft:  rgba(232, 220, 196, 0.12);
    --accent-ink:   #0a0a0a;
    --warn:         #d19a45;
    --danger:       #d97757;
    --shadow-sm:    0 1px 2px rgba(0, 0, 0, 0.4);
    --shadow:       0 4px 12px -2px rgba(0, 0, 0, 0.4);
    --shadow-lg:    0 12px 32px -6px rgba(0, 0, 0, 0.55);
    --radius:       10px;
    --radius-sm:    8px;
    --radius-lg:    14px;
    --ease:         cubic-bezier(0.16, 1, 0.3, 1);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; background: var(--bg); color: var(--text); font-family: "Inter", -apple-system, BlinkMacSystemFont, system-ui, sans-serif; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; font-size: 14px; line-height: 1.6; letter-spacing: -0.005em; }
  ::selection { background: var(--accent); color: var(--accent-ink); }
  .app { display: flex; flex-direction: column; min-height: 100vh; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 24px; border-bottom: 1px solid var(--line); background: var(--panel); }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand-mark { font-family: "EB Garamond", serif; font-size: 22px; font-weight: 600; letter-spacing: 0.02em; color: var(--text-strong); }
  .brand-mark .accent { color: var(--accent); }
  .doctor-badge { display: inline-flex; align-items: center; gap: 10px; padding: 6px 12px; border-radius: 999px; background: var(--panel-2); border: 1px solid var(--line); font-size: 12.5px; color: var(--text-dim); }
  .doctor-badge-name { color: var(--text); font-weight: 500; }
  .doctor-badge-md { color: var(--accent); font-weight: 600; margin-left: 4px; }
  .doctor-badge-divider { width: 1px; height: 14px; background: var(--line-strong); }
  .doctor-badge-specialty, .doctor-badge-specialties { display: inline-flex; align-items: center; gap: 4px; color: var(--accent); }
  .doctor-badge-specialty svg { width: 16px; height: 16px; }
  .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px 24px; border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 10; }
  .tool-group { display: flex; align-items: center; gap: 4px; padding: 0 6px; border-right: 1px solid var(--line); }
  .tool-group:last-child { border-right: none; }
  .tbtn { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border-radius: var(--radius-sm); background: transparent; color: var(--text); border: 1px solid transparent; cursor: pointer; font: inherit; font-size: 13px; font-weight: 500; transition: background 150ms var(--ease), border-color 150ms var(--ease), color 150ms var(--ease); }
  .tbtn:hover { background: var(--panel-hover); }
  .tbtn.active { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
  .tbtn.primary { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
  .tbtn.primary:hover { background: var(--accent-strong); }
  .tbtn.danger { color: var(--danger); }
  .tbtn.danger:hover { background: rgba(217, 119, 87, 0.10); }
  .tbtn:disabled { opacity: 0.5; cursor: not-allowed; }
  .tbtn svg { width: 16px; height: 16px; }
  .rec-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--danger); animation: pulse 1.2s infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.5; transform: scale(0.85); } }
  .rec-timer { font-variant-numeric: tabular-nums; color: var(--text-dim); font-size: 12px; min-width: 36px; }
  .statusbar { padding: 8px 24px; border-bottom: 1px solid var(--line); background: var(--panel-2); display: none; align-items: center; gap: 10px; font-size: 12.5px; color: var(--text-dim); }
  .statusbar.visible { display: flex; }
  .statusbar .spin { width: 12px; height: 12px; border: 2px solid var(--line-strong); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite; }
  .statusbar.err { color: var(--danger); }
  .statusbar.ok { color: var(--accent); }
  @keyframes spin { to { transform: rotate(360deg); } }
  .workspace { flex: 1; display: flex; overflow: hidden; }
  .editor-wrap { flex: 1; overflow-y: auto; padding: 32px 24px 80px; background: radial-gradient(1200px 600px at 50% -200px, rgba(232, 220, 196, 0.04), transparent 60%), var(--bg); }
  .paper { max-width: 880px; margin: 0 auto; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius-lg); box-shadow: var(--shadow); padding: 56px 64px; min-height: 70vh; transition: box-shadow 200ms var(--ease); }
  .paper:focus-within { box-shadow: var(--shadow-lg); border-color: var(--line-strong); }
  .paper-title { font-family: "EB Garamond", serif; font-size: 28px; font-weight: 500; color: var(--text-strong); margin: 0 0 6px; letter-spacing: 0.01em; }
  .paper-meta { color: var(--text-dim); font-size: 13px; margin-bottom: 28px; padding-bottom: 16px; border-bottom: 1px solid var(--line); }
  .editor { font-family: "EB Garamond", "Georgia", serif; font-size: 17px; line-height: 1.75; color: var(--text); min-height: 50vh; outline: none; white-space: pre-wrap; word-wrap: break-word; }
  .editor:empty::before { content: attr(data-placeholder); color: var(--muted); font-style: italic; }
  .editor p { margin: 0 0 1em; }
  .editor strong { color: var(--text-strong); font-weight: 600; }
  .editor h2 { font-family: "Inter", sans-serif; font-size: 13.5px; font-weight: 600; margin: 1.3em 0 0.5em; letter-spacing: 0.05em; text-transform: uppercase; color: var(--accent); }
  .ai-preview { max-width: 880px; margin: 16px auto 0; border: 1px solid var(--accent); background: var(--panel); border-radius: var(--radius-lg); overflow: hidden; box-shadow: var(--shadow); display: none; }
  .ai-preview.visible { display: block; }
  .ai-preview-header { display: flex; align-items: center; justify-content: space-between; padding: 12px 20px; background: var(--accent-soft); border-bottom: 1px solid var(--accent); }
  .ai-preview-title { color: var(--accent); font-weight: 600; font-size: 13px; display: flex; align-items: center; gap: 8px; }
  .ai-preview-actions { display: flex; gap: 8px; }
  .ai-preview-body { padding: 20px 24px; font-family: "EB Garamond", serif; font-size: 16px; line-height: 1.7; color: var(--text); max-height: 50vh; overflow-y: auto; white-space: pre-wrap; }
  .stream-cursor { display: inline-block; width: 2px; height: 1em; background: var(--accent); animation: blink 0.8s infinite; vertical-align: text-bottom; margin-left: 1px; }
  @keyframes blink { 50% { opacity: 0; } }
  .modal-backdrop { position: fixed; inset: 0; background: rgba(5, 13, 26, 0.7); backdrop-filter: blur(4px); z-index: 100; display: none; align-items: center; justify-content: center; padding: 20px; }
  .modal-backdrop.visible { display: flex; }
  .modal { width: 100%; max-width: 520px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); padding: 24px; }
  .modal h3 { margin: 0 0 16px; color: var(--text-strong); font-size: 17px; font-weight: 600; }
  .modal label { display: block; font-size: 13px; color: var(--text-dim); margin-bottom: 6px; font-weight: 500; }
  .modal textarea, .modal input[type="text"] { width: 100%; padding: 10px 12px; border-radius: var(--radius-sm); background: var(--bg-elevated); color: var(--text); border: 1px solid var(--line-strong); font: inherit; font-size: 14px; resize: vertical; outline: none; transition: border-color 150ms var(--ease), box-shadow 150ms var(--ease); }
  .modal textarea:focus, .modal input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
  .sep { flex: 1; }
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px); padding: 12px 20px; background: var(--panel); border: 1px solid var(--accent); border-radius: var(--radius); box-shadow: var(--shadow-lg); color: var(--text); font-size: 13px; z-index: 200; opacity: 0; transition: all 250ms var(--ease); pointer-events: none; }
  .toast.visible { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.err { border-color: var(--danger); color: var(--danger); }

  /* ─── Checklist module ─── */
          esistente o in nuovo blocco
       2) HTML markup — bottone toolbar + aside drawer
       3) Script JS — wire del drawer + CHECKLIST_TEMPLATES data

     Dipendenze:
       - var CHECKLIST_TEMPLATES (in JS) — i 49 esami strutturati
       - window functions: streamChatCompletion(payload, onDelta)
       - window helpers (opzionali): insertIntoEditor, getEditorText
============================================================ -->

  /* ─── Bottone toolbar "Checklist" ─── */
  .cl-toggle {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    height: 34px;
    padding: 0 12px;
    border-radius: 8px;
    background: transparent;
    color: var(--text, #ebebeb);
    border: 1px solid transparent;
    cursor: pointer;
    font: inherit;
    font-size: 13px;
    font-weight: 500;
    transition: background 150ms cubic-bezier(.16,1,.3,1), border-color 150ms;
  }
  .cl-toggle:hover { background: var(--panel-hover, rgba(232,220,196,.08)); }
  .cl-toggle.active {
    background: var(--accent-soft, rgba(232,220,196,.12));
    color: var(--accent, #e8dcc4);
    border-color: var(--accent, #e8dcc4);
  }
  .cl-toggle svg { width: 16px; height: 16px; }

  /* ─── Backdrop (non più usato in modalità inline, mantenuto per retro-compat) ─── */
  .cl-backdrop { display: none; }

  /* ─── Pannello checklist INLINE accanto all'editor ─────────
     Non è più un drawer overlay: vive dentro al workspace flex,
     occupa width 0 quando chiuso e una porzione fissa quando aperto.
     L'editor a sinistra si rimpicciolisce automaticamente. */
  .cl-drawer {
    flex-shrink: 0;
    width: 0;
    overflow: hidden;
    background: var(--panel-2, #1c1c1c);
    border-left: 1px solid var(--line-strong, #333333);
    display: flex; flex-direction: column;
    color: var(--text, #ebebeb);
    transition: width 280ms cubic-bezier(.16,1,.3,1);
    /* min-width interno: quando si apre, il contenuto è leggibile */
  }
  .cl-drawer.open { width: 50%; }
  /* Min-width interno per evitare collasso del contenuto durante l'animazione,
     ma più piccolo del 50% così su layout stretti il contenuto è leggibile. */
  .cl-drawer > * { min-width: min(420px, 100%); }

  /* Quando la checklist è aperta, il paper dell'editor si allarga a tutta
     la larghezza disponibile (niente più 880px centered con spazio libero
     ai lati) e i margini esterni del workspace si stringono. */
  .workspace:has(.cl-drawer.open) .paper { max-width: 100%; }
  .workspace:has(.cl-drawer.open) .editor-wrap { padding: 32px 22px 80px; }
  .workspace:has(.cl-drawer.open) .paper { padding: 40px 44px; }

  .cl-header {
    padding: 18px 22px 14px;
    border-bottom: 1px solid var(--line, #262626);
    display: flex; flex-direction: column; gap: 12px;
  }
  .cl-title-row {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px;
  }
  .cl-title {
    font-family: "EB Garamond", Georgia, serif;
    font-size: 22px; font-weight: 600;
    color: var(--text-strong, #fff);
    letter-spacing: 0.01em;
  }
  .cl-title .accent { color: var(--accent, #e8dcc4); }
  .cl-close {
    width: 32px; height: 32px;
    background: transparent;
    border: 1px solid var(--line, #262626);
    border-radius: 8px;
    color: var(--text-dim, #a8a8a8);
    cursor: pointer;
    display: grid; place-items: center;
    transition: all 150ms;
  }
  .cl-close:hover { color: var(--text-strong, #fff); border-color: var(--line-strong, #333333); }
  .cl-close svg { width: 14px; height: 14px; }

  .cl-template-select {
    width: 100%;
    padding: 10px 12px;
    background: var(--bg-elevated, #141414);
    color: var(--text, #ebebeb);
    border: 1px solid var(--line-strong, #333333);
    border-radius: 8px;
    font: inherit; font-size: 13.5px;
    cursor: pointer;
  }
  .cl-template-select:focus {
    outline: none;
    border-color: var(--accent, #e8dcc4);
    box-shadow: 0 0 0 3px var(--accent-soft, rgba(232,220,196,.12));
  }

  .cl-meta-bar {
    display: flex; align-items: center; gap: 12px;
    font-size: 12px; color: var(--text-dim, #a8a8a8);
    min-height: 20px;
  }
  .cl-meta-bar .progress { color: var(--accent, #e8dcc4); font-weight: 600; }
  .cl-meta-bar .modality {
    padding: 2px 8px;
    background: var(--accent-soft, rgba(232,220,196,.12));
    color: var(--accent, #e8dcc4);
    border-radius: 999px;
    font-size: 10.5px; font-weight: 700;
    letter-spacing: 0.08em; text-transform: uppercase;
  }

  /* ─── Body scrollabile con le voci ─── */
  .cl-body {
    flex: 1;
    overflow-y: auto;
    padding: 14px 22px 22px;
  }
  .cl-empty {
    padding: 40px 16px;
    text-align: center;
    color: var(--text-dim, #a8a8a8);
    font-size: 13.5px; line-height: 1.6;
  }
  .cl-empty strong { color: var(--accent, #e8dcc4); }

  .cl-item {
    background: var(--panel-2, #1c1c1c);
    border: 1px solid var(--line, #262626);
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 8px;
    transition: border-color 150ms;
  }
  .cl-item.is-normal { border-color: rgba(232,220,196,.45); background: rgba(232,220,196,.05); }
  .cl-item.is-prompt { border-color: rgba(209,154,69,.55); }

  .cl-item-head {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 8px;
  }
  .cl-item-name {
    flex: 1;
    font-size: 13.5px; font-weight: 600;
    color: var(--text-strong, #fff);
  }

  .cl-state-btn {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 4px 10px;
    background: transparent;
    color: var(--text-dim, #a8a8a8);
    border: 1px solid var(--line-strong, #333333);
    border-radius: 6px;
    font: inherit; font-size: 11.5px; font-weight: 600;
    cursor: pointer;
    transition: all 150ms;
  }
  .cl-state-btn:hover { color: var(--text-strong, #fff); border-color: var(--accent, #e8dcc4); }
  .cl-state-btn.active.normal {
    background: var(--accent, #e8dcc4);
    color: var(--accent-ink, #0a0a0a);
    border-color: var(--accent, #e8dcc4);
  }
  .cl-state-btn.active.prompt {
    background: var(--warn, #d19a45);
    color: #1a1a1a;
    border-color: var(--warn, #d19a45);
  }

  .cl-item-text {
    font-size: 13px; line-height: 1.55;
    color: var(--text, #ebebeb);
    font-family: "EB Garamond", Georgia, serif;
    font-size: 14.5px;
  }
  .cl-item-note {
    width: 100%;
    margin-top: 6px;
    padding: 8px 10px;
    background: var(--bg-elevated, #0a0a0a);
    color: var(--text, #ebebeb);
    border: 1px solid var(--line-strong, #333333);
    border-radius: 6px;
    font: inherit; font-size: 13px;
    /* Auto-grow: resize disabilitato + overflow nascosto, JS aggiusta height */
    resize: none; overflow: hidden; min-height: 60px;
    outline: none;
    font-family: "EB Garamond", Georgia, serif;
    line-height: 1.45;
    transition: height 0.08s ease;
  }
  .cl-item-note:focus {
    border-color: var(--warn, #d19a45);
    box-shadow: 0 0 0 3px rgba(209,154,69,.18);
  }

  /* Wrapper della textarea-nota con bottone mic in basso a destra */
  .cl-note-wrap { position: relative; }
  .cl-note-wrap .cl-item-note { padding-right: 44px !important; }
  .cl-mic-btn {
    position: absolute;
    right: 6px; bottom: 6px;
    height: 30px; min-width: 30px;
    padding: 0 8px;
    border-radius: 6px;
    background: var(--accent-soft, rgba(232,220,196,.12));
    color: var(--accent, #e8dcc4);
    border: 1px solid var(--line-strong, #333333);
    cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 4px;
    transition: background 150ms, border-color 150ms, color 150ms, width 150ms;
    font: inherit; font-size: 11px; font-weight: 700;
    letter-spacing: 0.05em;
  }
  .cl-mic-btn:hover {
    background: rgba(232,220,196,.22);
    border-color: var(--accent, #e8dcc4);
  }
  .cl-mic-btn svg { width: 14px; height: 14px; }
  .cl-mic-btn.rec {
    background: var(--danger, #d97757);
    color: #fff;
    border-color: var(--danger, #d97757);
  }
  .cl-mic-btn.rec .rec-dot-mic {
    width: 8px; height: 8px; border-radius: 50%;
    background: #fff;
    animation: pulse 1.2s infinite;
  }

  /* ─── Footer con bottoni azione ─── */
  .cl-footer {
    padding: 14px 22px 18px;
    border-top: 1px solid var(--line, #262626);
    display: flex; gap: 8px;
    background: var(--panel, #141414);
  }
  .cl-btn {
    flex: 1;
    padding: 11px 14px;
    border-radius: 8px;
    font: inherit; font-size: 13px; font-weight: 600;
    cursor: pointer;
    border: 1px solid transparent;
    transition: all 150ms;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  }
  .cl-btn-ghost {
    background: transparent;
    color: var(--text-dim, #a8a8a8);
    border-color: var(--line-strong, #333333);
  }
  .cl-btn-ghost:hover { color: var(--text-strong, #fff); border-color: var(--text-dim, #a8a8a8); }
  .cl-btn-primary {
    background: var(--accent, #e8dcc4);
    color: var(--accent-ink, #0a0a0a);
    border-color: var(--accent, #e8dcc4);
  }
  .cl-btn-primary:hover { background: var(--accent-strong, #f0e6d1); }
  .cl-btn:disabled { opacity: .5; cursor: not-allowed; }
  .cl-btn svg { width: 14px; height: 14px; }

  @media (max-width: 900px) {
    /* Su schermi stretti: torna a comportamento drawer overlay perché
       lo split side-by-side non ha più senso. */
    .cl-drawer {
      position: fixed; top: 0; right: 0; bottom: 0;
      width: min(540px, 90vw);
      z-index: 100;
      transform: translateX(100%);
      transition: transform 280ms cubic-bezier(.16,1,.3,1);
      box-shadow: -12px 0 32px rgba(0,0,0,.4);
    }
    .cl-drawer.open {
      width: min(540px, 90vw);
      transform: translateX(0);
    }
    .cl-drawer > * { min-width: 0; }
    .cl-backdrop { display: block; }
  }

</style>
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">Refertium<span class="accent">.</span></span>
    </div>
    <div class="doctor-badge" id="doctorBadge">
<!-- @@REFERTIUM_INJECTION_POINT@@ DOCTOR_BADGE START -->
      <span class="doctor-badge-name">Doctor, Refertium <span class="doctor-badge-md">MD</span></span>
<!-- @@REFERTIUM_INJECTION_POINT@@ DOCTOR_BADGE END -->
    </div>
  </header>

  <nav class="toolbar" id="toolbar">
    <div class="tool-group">
      <button id="btnRec" class="tbtn primary" title="Voice dictation (Whisper)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
        <span id="recLabel">Dictate</span>
      </button>
    </div>
    <div class="tool-group">
      <button class="tbtn" data-cmd="bold" title="Bold (Cmd+B)"><strong>B</strong></button>
      <button class="tbtn" data-cmd="italic" title="Italic (Cmd+I)"><em>I</em></button>
      <button class="tbtn" data-cmd="underline" title="Underline (Cmd+U)"><span style="text-decoration:underline">U</span></button>
    </div>
    <div class="tool-group">
      <button id="btnFontDown" class="tbtn" title="Decrease size">A−</button>
      <button id="btnFontUp" class="tbtn" title="Increase size">A+</button>
    </div>
    <div class="tool-group">
      <button id="btnStyleProse" class="tbtn active" data-style="prose" title="Prose style">Prose</button>
      <button id="btnStyleSynth" class="tbtn" data-style="synth" title="Synthetic/list style">Concise</button>

<script>
(function () {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const editor = $('editor');
  const statusbar = $('statusbar');
  const statusText = $('statusText');
  const statusSpin = $('statusSpin');
  const toastEl = $('toast');
  const aiPreview = $('aiPreview');
  const aiPreviewBody = $('aiPreviewBody');
  const aiPreviewKind = $('aiPreviewKind');

  let writingStyle = 'prose';
  let patientSex = null;
  try { const s = sessionStorage.getItem('refertium_patient_sex'); if (s === 'M' || s === 'F') patientSex = s; } catch {}
  let baseFontSize = 17;
  let savedSelectionRange = null;

  function setStatus(text, mode) {
    if (!text) { statusbar.classList.remove('visible', 'err', 'ok'); return; }
    statusbar.classList.add('visible');
    statusbar.classList.toggle('err', mode === 'err');
    statusbar.classList.toggle('ok', mode === 'ok');
    statusSpin.style.display = (mode === 'err' || mode === 'ok') ? 'none' : 'inline-block';
    statusText.textContent = text;
  }
  function showToast(msg, mode) {
    toastEl.textContent = msg;
    toastEl.classList.toggle('err', mode === 'err');
    toastEl.classList.add('visible');
    clearTimeout(toastEl._t);
    toastEl._t = setTimeout(() => toastEl.classList.remove('visible'), 2400);
  }
  function getEditorText() {
    let raw = '';
    editor.childNodes.forEach((node) => {
      if (node.nodeType === Node.TEXT_NODE) raw += node.textContent + '\n';
      else if (node.nodeType === Node.ELEMENT_NODE) raw += node.innerText + '\n';
    });
    return raw.replace(/\n{3,}/g, '\n\n').trim();
  }
  function saveSelection() {
    const sel = window.getSelection();
    if (!sel || sel.rangeCount === 0) return null;
    const range = sel.getRangeAt(0);
    if (!editor.contains(range.commonAncestorContainer)) return null;
    savedSelectionRange = range.cloneRange();
    return savedSelectionRange;
  }
  function restoreSelection() {
    if (!savedSelectionRange) return false;
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(savedSelectionRange);
    return true;
  }
  function insertIntoEditor(text, opts) {
    opts = opts || {};
    const replaceSelection = !!opts.replaceSelection;
    const asBlock = opts.asBlock !== false;
    // parseHeadings: ON by default for generative AI outputs (Magic, Impression,
    // Rewrite). Pass FALSE for dictation — never auto-promote uppercase+":"
    // words to titles the doctor did not request.
    const parseHeadings = opts.parseHeadings !== false;
    editor.focus();
    if (!restoreSelection()) {
      const range = document.createRange();
      range.selectNodeContents(editor);
      range.collapse(false);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
    }
    const sel = window.getSelection();
    if (sel.rangeCount === 0) return;
    let range = sel.getRangeAt(0);
    if (replaceSelection && !sel.isCollapsed) range.deleteContents();
    if (asBlock) {
      const paragraphs = String(text).split(/\n{2,}/);
      const frag = document.createDocumentFragment();
      paragraphs.forEach((para) => {
        const headingMatch = parseHeadings
          ? para.match(/^([A-Z]{4,16}):\s*([\s\S]*)$/)
          : null;
        if (headingMatch) {
          const h = document.createElement('h2');
          h.textContent = headingMatch[1];
          frag.appendChild(h);
          if (headingMatch[2].trim()) {
            const p = document.createElement('p');
            p.textContent = headingMatch[2].trim();
            frag.appendChild(p);
          }
        } else {
          const p = document.createElement('p');
          const lines = para.split('\n');
          lines.forEach((line, idx) => {
            if (idx > 0) p.appendChild(document.createElement('br'));
            p.appendChild(document.createTextNode(line));
          });
          frag.appendChild(p);
        }
      });
      range.insertNode(frag);
      range.collapse(false);
    } else {
      const textNode = document.createTextNode(text);
      range.insertNode(textNode);
      range.setStartAfter(textNode);
      range.setEndAfter(textNode);
    }
    sel.removeAllRanges();
    sel.addRange(range);
    editor.focus();
  }

  document.querySelectorAll('.tbtn[data-cmd]').forEach((btn) => {
    btn.addEventListener('click', () => {
      editor.focus();
      document.execCommand(btn.dataset.cmd, false, null);
    });
  });
  $('btnFontUp').addEventListener('click', () => { baseFontSize = Math.min(24, baseFontSize + 1); editor.style.fontSize = baseFontSize + 'px'; });
  $('btnFontDown').addEventListener('click', () => { baseFontSize = Math.max(13, baseFontSize - 1); editor.style.fontSize = baseFontSize + 'px'; });
  $('btnStyleProse').addEventListener('click', () => { writingStyle = 'prose'; $('btnStyleProse').classList.add('active'); $('btnStyleSynth').classList.remove('active'); });
  $('btnStyleSynth').addEventListener('click', () => { writingStyle = 'synth'; $('btnStyleSynth').classList.add('active'); $('btnStyleProse').classList.remove('active'); });
  // Patient sex toggle (M / F / none)
  function applyPatientSexUI() {
    const m = $('btnSexM'), f = $('btnSexF'); if (!m || !f) return;
    m.classList.toggle('active', patientSex === 'M');
    f.classList.toggle('active', patientSex === 'F');
    m.setAttribute('aria-pressed', patientSex === 'M' ? 'true' : 'false');
    f.setAttribute('aria-pressed', patientSex === 'F' ? 'true' : 'false');
    try { if (patientSex) sessionStorage.setItem('refertium_patient_sex', patientSex); else sessionStorage.removeItem('refertium_patient_sex'); } catch {}
  }
  $('btnSexM').addEventListener('click', () => { patientSex = patientSex === 'M' ? null : 'M'; applyPatientSexUI(); });
  $('btnSexF').addEventListener('click', () => { patientSex = patientSex === 'F' ? null : 'F'; applyPatientSexUI(); });
  applyPatientSexUI();
  $('btnCopy').addEventListener('click', async () => {
    const text = getEditorText();
    try { await navigator.clipboard.writeText(text); showToast('Text copied to clipboard'); }
    catch (e) { showToast('Copy failed', 'err'); }
  });
  // ─── Full reset of the editor ─────────────────────────────
  $('btnReset').addEventListener('click', () => {
    if (!getEditorText().trim()) { showToast('Editor already empty'); return; }
    const ok = window.confirm('Clear the entire editor?\n\nReport text will be lost. Confirm only if you have already saved/copied it.');
    if (!ok) return;
    editor.innerHTML = '';
    if (aiPreview && aiPreview.classList.contains('visible')) closePreview();
    savedSelectionRange = null;
    setStatus('');
    editor.focus();
    showToast('Editor cleared');
  });

  const recState = { recorder: null, chunks: [], mimeType: '', startedAt: 0, timerId: null, isRecording: false };
  const btnRec = $('btnRec');

  btnRec.addEventListener('click', async () => {
    if (recState.isRecording) await stopRecording();
    else await startRecording();
  });

  async function startRecording() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { showToast('Microphone unavailable', 'err'); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const candidates = ['audio/webm;codecs=opus','audio/webm','audio/ogg;codecs=opus','audio/mp4'];
      let mimeType = '';
      for (const m of candidates) { if (window.MediaRecorder && MediaRecorder.isTypeSupported(m)) { mimeType = m; break; } }
      const mr = mimeType ? new MediaRecorder(stream, { mimeType }) : new MediaRecorder(stream);
      recState.recorder = mr;
      recState.chunks = [];
      recState.mimeType = mr.mimeType || mimeType || 'audio/webm';
      mr.ondataavailable = (e) => { if (e.data && e.data.size) recState.chunks.push(e.data); };
      mr.onstop = onRecorderStop;
      mr.start(250);
      recState.isRecording = true;
      recState.startedAt = Date.now();
      saveSelection();
      btnRec.classList.add('active');
      btnRec.innerHTML = '';
      const dot = document.createElement('span'); dot.className = 'rec-dot'; btnRec.appendChild(dot);
      const lab = document.createElement('span'); lab.textContent = 'Stop'; btnRec.appendChild(lab);
      const tim = document.createElement('span'); tim.className = 'rec-timer'; tim.textContent = '0:00'; btnRec.appendChild(tim);
      recState.timerId = setInterval(tickTimer, 500);
      setStatus('Recording…');
    } catch (e) { console.error(e); showToast('Could not access microphone', 'err'); }
  }

  function tickTimer() {
    const elapsed = Math.floor((Date.now() - recState.startedAt) / 1000);
    const m = Math.floor(elapsed / 60);
    const s = elapsed % 60;
    const t = m + ':' + String(s).padStart(2, '0');
    const node = btnRec.querySelector('.rec-timer');
    if (node) node.textContent = t;
  }

  async function stopRecording() {
    if (!recState.recorder) return;
    try { recState.recorder.stop(); } catch {}
    try { recState.recorder.stream.getTracks().forEach((t) => t.stop()); } catch {}
    clearInterval(recState.timerId);
    recState.timerId = null;
    recState.isRecording = false;
    btnRec.classList.remove('active');
    btnRec.innerHTML = '';
    btnRec.insertAdjacentHTML('beforeend',
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg><span>Dictate</span>');
  }

  async function onRecorderStop() {
    setStatus('Transcribing…');
    try {
      const blob = new Blob(recState.chunks, { type: recState.mimeType || 'audio/webm' });
      if (blob.size < 1000) { setStatus('Audio too short', 'err'); setTimeout(() => setStatus(''), 1800); return; }
      const rawText = await transcribeBlobDirect(blob);
      if (!rawText) { setStatus('Empty transcription', 'err'); setTimeout(() => setStatus(''), 1800); return; }
      // 1) context-aware medical corrections on raw Whisper (gallbladder, etc.)
      // 2) spoken-punctuation preprocessing (comma, period, etc.)
      const corrected = applyMedicalCorrections(rawText);
      const pre = preprocessDictation(corrected);
      setStatus('Cleaning text with AI…');
      // Dictation is the doctor's own voice — insert directly into the editor
      // without confirmation (unlike generative AI outputs).
      let buffer = '';
      await cleanupDictationAI(pre, (delta) => { buffer += delta; });
      const cleaned = buffer.trim();
      if (cleaned) {
        // Dictation: no heading parsing — the text is inserted faithfully,
        // no auto-generated <h2> the doctor did not ask for.
        insertIntoEditor(cleaned, { replaceSelection: false, asBlock: true, parseHeadings: false });
      }
      setStatus('Text inserted', 'ok');
      setTimeout(() => setStatus(''), 1200);
    } catch (err) {
      console.error(err);
      setStatus('Error: ' + (err && err.message ? err.message : 'transcription failed'), 'err');
      setTimeout(() => setStatus(''), 2500);
    }
  }

  function makeCursor() { const c = document.createElement('span'); c.className = 'stream-cursor'; return c; }

  function preprocessDictation(text) {
    if (!text) return '';
    let t = ' ' + text + ' ';
    const rules = [
      [/\s+comma\b/gi, ','],
      [/\s+semicolon\b/gi, ';'],
      [/\s+colon\b/gi, ':'],
      [/\s+question mark\b/gi, '?'],
      [/\s+exclamation mark\b/gi, '!'],
      [/\s+period\b(?!\s*\d)/gi, '.'],
      [/\s+full stop\b(?!\s*\d)/gi, '.'],
      [/\s+new line\b/gi, '\n'],
      [/\s+new paragraph\b/gi, '\n\n'],
      [/\s+open paren\b/gi, ' ('],
      [/\s+close paren\b/gi, ')'],
      [/\s+dash\b/gi, ' - '],
      [/\s+slash\b/gi, '/'],
    ];
    rules.forEach((r) => { t = t.replace(r[0], r[1]); });
    t = t.replace(/\s*([,;:.!?])\s*/g, '$1 ');
    t = t.replace(/\(\s+/g, '(').replace(/\s+\)/g, ')');
    t = t.replace(/[ \t]+/g, ' ').replace(/ ?\n ?/g, '\n').trim();
    t = t.replace(/(^|[.!?]\s+)([a-z])/g, (_, p, c) => p + c.toUpperCase());
    return t;
  }

  // Always-on radiology dictionary for the Whisper prompt. Combined with
  // the per-doctor WHISPER_PROMPT injected by the backend. Helps Whisper
  // recognise technical terms it would mishear in isolation
  // (e.g. "gallbladder" misheard as "gull bladder").
  // Order matters: Whisper preserves only the LAST ~224 tokens of the prompt.
  // Put the most exam-typical terms (chest, abdomen) at the END so they always
  // stay inside the window. Generic terms (modality, density) go first — if
  // truncated it hurts less.
  const WHISPER_BASE_EN = [
    'Radiology reporting dictation by an English-speaking radiologist.',
    // ─── Modality & technique
    'CT, MRI, MR, US, ultrasound, X-ray, mammography, CTA, MRA, IV contrast,',
    'iodinated contrast, gadolinium, arterial phase, venous phase, delayed phase,',
    'axial, coronal, sagittal, multiplanar reconstructions, T1-weighted, T2-weighted, FLAIR, DWI, ADC, MIP, MPR,',
    'mediastinal window, lung window, bone window, Hounsfield units, HU.',
    // ─── General
    'parenchyma, echotexture, echogenicity, hyperechoic, hypoechoic, isoechoic, anechoic,',
    'hyperdense, hypodense, isodense, hyperintense, hypointense, isointense,',
    'fluid collection, focal lesion, enhancement, contrast uptake, calcification.',
    // ─── MSK + spine
    'rotator cuff, supraspinatus, infraspinatus, subscapularis, glenoid labrum,',
    'medial meniscus, lateral meniscus, articular cartilage, chondropathy,',
    'bone marrow edema, fracture, tendinopathy, anterior cruciate ligament, ACL, PCL,',
    'C1, C2, C5, C7, T1, T12, L1, L4, L5, S1, cervical spine, lumbar spine.',
    // ─── Neuro
    'brain, falx cerebri, tentorium, lateral ventricles, third ventricle, corpus callosum,',
    'basal ganglia, thalami, cerebellum, vermis, white matter, grey matter,',
    'leukoencephalopathy, cortical atrophy, gliosis, vasogenic edema,',
    'hemorrhage, ischemia, stroke, pituitary, sella turcica.',
    // ─── Common pathology + recurring formulas
    'lesion, hematoma, infarct, calculi, cyst, polyp, nodule, neoplasm, mass,',
    'lymphadenopathy, lymph nodes, nephrolithiasis.',
    'no focal abnormalities of note, within normal limits for age, stable findings,',
    'clinical correlation recommended, follow-up imaging recommended.',
    // ─── Abdomen (near end — preserved)
    'liver, hepatic parenchyma, gallbladder, stone-free, pericholecystic, common bile duct,',
    'intrahepatic bile ducts, extrahepatic bile ducts, pancreas, pancreatic duct,',
    'spleen, adrenal gland, kidneys, calyces, renal pelvis, ureters, bladder, prostate,',
    'portal vein, IVC, abdominal aorta, mesentery, ascites, hydronephrosis.',
    // ─── Chest (at the end — exact phrasings we want Whisper to produce)
    'lung parenchyma, right upper lobe, right middle lobe, right lower lobe,',
    'left upper lobe, lingula, left lower lobe, apical segment, basal segment,',
    'mediastinum, hilum, hila, hilar, perihilar, pleura, pleural, pleural effusion,',
    'atelectasis, passive collapse, consolidation, parenchymal consolidation, air bronchogram,',
    'ground-glass, ground-glass opacity, nodular opacities, centrilobular opacities,',
    'centrilobular, peribronchovascular, peribronchial, perilesional,',
    'pulmonary nodule, micronodule, micronodules, bronchiectasis, bronchiolectasis,',
    'pulmonary embolism, pulmonary arterial branches, lobar branches, segmental branches,',
    'thoracic aorta, aortic arch, pulmonary trunk, superior vena cava,',
    'mediastinal lymph nodes, hilar lymph nodes, paratracheal lymph nodes, subcarinal lymph nodes,',
    'likely reactive in nature, reactive in appearance,',
    'trachea, main bronchi, lobar bronchus, patent, preserved patency,',
    'heart, cardiac chambers, pericardial effusion, pericardium within normal size.',
  ].join(' ');

  function buildWhisperPrompt() {
    const userKeywords = (typeof WHISPER_PROMPT === 'string' && WHISPER_PROMPT.trim())
      ? WHISPER_PROMPT.trim()
      : '';
    const combined = userKeywords
      ? (WHISPER_BASE_EN + ' Doctor recurring terms: ' + userKeywords + '.')
      : WHISPER_BASE_EN;
    return combined.slice(0, 1800);
  }

  async function transcribeBlobDirect(blob) {
    try { return await attemptTranscribe(blob, 'gpt-4o-transcribe'); }
    catch (err) {
      const msg = String(err && err.message || '');
      const isFormatError = /400|format|corrupt|unsupported|decode/i.test(msg);
      if (!isFormatError) throw err;
      console.warn('Fallback whisper-1:', msg);
      return await attemptTranscribe(blob, 'whisper-1');
    }
  }

  async function attemptTranscribe(blob, model) {
    const ext = (blob.type || '').includes('mp4') ? 'mp4'
      : (blob.type || '').includes('ogg') ? 'ogg'
      : 'webm';
    const fd = new FormData();
    fd.append('file', blob, 'dictation.' + ext);
    fd.append('model', model);
    fd.append('language', 'en');
    const promptText = buildWhisperPrompt();
    if (promptText) fd.append('prompt', promptText);
    fd.append('temperature', '0');
    fd.append('response_format', 'json');
    const headers = {};
    if (PROXY_AUTH && PROXY_AUTH !== 'session') headers['Authorization'] = 'Bearer ' + PROXY_AUTH;
    const r = await fetch(PROXY_URL + '/v1/audio/transcriptions', { method: 'POST', headers, body: fd });
    if (!r.ok) { const txt = await r.text().catch(() => ''); throw new Error('STT ' + model + ': ' + r.status + ' ' + txt.slice(0, 200)); }
    const data = await r.json();
    return (data && (data.text || data.transcript || '')) || '';
  }

  // Context-aware medical corrections applied AFTER Whisper, BEFORE the AI
  // cleanup. Patterns are deliberately tight so we never break legitimate
  // phrases (e.g. "renal cysts").
  function applyMedicalCorrections(text) {
    if (!text) return text;
    let t = text;
    const rules = [
      // common bile duct: "common bile duck" / "common bald duct" etc.
      [/\bcommon\s+b(?:i|a)l[ed]?\s+du[ck]+t\b/gi, 'common bile duct'],
      // gallbladder split: "gall bladder", "gull bladder", "ball bladder"
      [/\b(?:gall?|gull|ball|gold)\s*bladder\b/gi, 'gallbladder'],
      // ground glass
      [/\bground\s*g[la]ss\b/gi, 'ground glass'],
      // pericholecystic
      [/\bperi[\s-]*cho?le[\s-]*cyst(?:ic)?\b/gi, 'pericholecystic'],
      // parenchyma truncations
      [/\bparen[\s-]*chyma\b/gi, 'parenchyma'],
      // echotexture
      [/\bec(?:ho)?[\s-]*tex(?:ture)?\b/gi, 'echotexture'],
      // echogenicity variants
      [/\bhyper[\s-]*ec(?:ho)?[\s-]*ic\b/gi, 'hyperechoic'],
      [/\bhypo[\s-]*ec(?:ho)?[\s-]*ic\b/gi, 'hypoechoic'],
      [/\biso[\s-]*ec(?:ho)?[\s-]*ic\b/gi, 'isoechoic'],
      [/\ban[\s-]*ec(?:ho)?[\s-]*ic\b/gi, 'anechoic'],
      // pulmonary embolism
      [/\bpulmonary\s+emb(?:o)?l(?:ism)?\b/gi, 'pulmonary embolism'],
      // rotator cuff
      [/\bro?tator\s+cuff\b/gi, 'rotator cuff'],
      // IV contrast
      [/\b(?:i\.?v\.?|intra\s*venous)\s+contrast\b/gi, 'IV contrast'],
      // ─── Modality acronyms
      [/\bcat\s+scan\b/gi, 'CT'],
      [/\bmagnetic\s+resonance(\s+imaging)?\b/gi, 'MRI'],
      [/\bex[\s-]ray\b/gi, 'X-ray'],
      // ─── Vertebrae (spoken → code)
      [/\bcee\s+(one|two|three|four|five|six|seven)\b/gi,
        (_, n) => 'C' + ({one:'1',two:'2',three:'3',four:'4',five:'5',six:'6',seven:'7'}[n.toLowerCase()])],
      [/\btee\s+(one|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve)\b/gi,
        (_, n) => 'T' + ({one:'1',two:'2',three:'3',four:'4',five:'5',six:'6',seven:'7',eight:'8',nine:'9',ten:'10',eleven:'11',twelve:'12'}[n.toLowerCase()])],
      [/\bell\s+(one|two|three|four|five)\b/gi,
        (_, n) => 'L' + ({one:'1',two:'2',three:'3',four:'4',five:'5'}[n.toLowerCase()])],
      [/\bess\s+one\b/gi, 'S1'],
      // ─── Density / intensity
      [/\bhyper[\s-]*dens[ei]\b/gi, 'hyperdense'],
      [/\bhypo[\s-]*dens[ei]\b/gi, 'hypodense'],
      [/\biso[\s-]*dens[ei]\b/gi, 'isodense'],
      [/\bhyper[\s-]*intens[ei]\b/gi, 'hyperintense'],
      [/\bhypo[\s-]*intens[ei]\b/gi, 'hypointense'],
      // ─── Measurement words
      [/\bmillimet(?:er|re)s?\b/gi, 'mm'],
      [/\bcentimet(?:er|re)s?\b/gi, 'cm'],
      [/\bmillilit(?:er|re)s?\b/gi, 'ml'],
      [/\bhounsfield\s+units?\b/gi, 'HU'],
      // ─── Right / left after anatomy
      [/\b(kidney|lung|lobe|hemisphere|knee|shoulder|hip|foot|hand|leg|arm|ovary|adrenal|breast)\s+right\b/gi,
        (_, w) => w + ' (R)'],
      [/\b(kidney|lung|lobe|hemisphere|knee|shoulder|hip|foot|hand|leg|arm|ovary|adrenal|breast)\s+left\b/gi,
        (_, w) => w + ' (L)'],
      // ─── Common split / truncated
      [/\bleuko?[\s-]*encepha?lo[\s-]*pathy\b/gi, 'leukoencephalopathy'],
      [/\bsupra[\s-]*spinatus\b/gi, 'supraspinatus'],
      [/\binfra[\s-]*spinatus\b/gi, 'infraspinatus'],
      [/\bsub[\s-]*scapularis\b/gi, 'subscapularis'],
      [/\banterior\s+cruciate(\s+ligament)?\b/gi, 'anterior cruciate ligament (ACL)'],
      [/\bposterior\s+cruciate(\s+ligament)?\b/gi, 'posterior cruciate ligament (PCL)'],
      // ─── Recurring phrases
      [/\bno\s+focal\s+abnormalit(?:y|ies)\s+of\s+note\b/gi, 'no focal abnormalities of note'],
      [/\bwithin\s+normal\s+limits\s+for\s+age\b/gi, 'within normal limits for age'],
      [/\bclinical\s+correlation\s+recommended\b/gi, 'clinical correlation recommended'],
    ];
    for (const r of rules) {
      t = t.replace(r[0], r[1]);
    }
    return t;
  }

  // Philosophy: this function is ONLY a spelling/punctuation corrector. The
  // doctor must recognise themselves in the output: no restructuring, no
  // added sections, no synonym substitution.
  async function cleanupDictationAI(rawText, onDelta) {
    const system = [
      'You are a spelling/punctuation corrector for medical radiology dictation.',
      'Return the doctor\'s text EXACTLY AS IS, with ONLY these minimal corrections:',
      '1) missing or wrong punctuation (commas, periods, colons);',
      '2) obvious spelling typos;',
      '3) double or wrong spacing;',
      '4) capital letter at start of sentence and after period;',
      '5) accidental word repetitions ("the the", "of of", "not not").',
      'MEDICAL TERMINOLOGY: if the text contains correct radiology terms (gallbladder, common bile duct, pericholecystic, parenchyma, echotexture, ground glass, etc.), KEEP THEM LITERAL — do not replace them with non-medical synonyms.',
      'KNOWN WHISPER ERRORS — always correct (same content the doctor said, just transcribed wrong):',
      '- "centri lobular" / "centri-lobular" → "centrilobular"',
      '- "para tracheal" → "paratracheal"; "sub carinal" → "subcarinal"; "peri lesional" → "perilesional"',
      '- "hyper dense" / "hypo dense" → "hyperdense" / "hypodense" (same for intense, echoic)',
      '- "bronch ectasis" → "bronchiectasis"',
      '- "air broncho gram" / "bronchogram aerial" → "air bronchogram"',
      '- "ground glass" should stay "ground-glass" when used as adjective ("ground-glass opacity")',
      'WRONGLY JOINED/SPLIT WORDS: if two English words look fused or split in a non-medical way (e.g. "pulmnodule", "lymph node areas" vs "lymphadenopathy"), recompose them into proper radiology lexicon.',
      'ANATOMIC HALLUCINATIONS: if a body part appears that is clearly OUTSIDE the exam context (e.g. "head" or "brain" in a chest CT; "thyroid" in an abdominal US; "prostate" in a head CT) → it is a Whisper hallucination, REMOVE it silently. Do not confuse hallucinations with real findings on adjacent districts.',
      'ABSOLUTE RULES — never break them:',
      '- DO NOT add words, sentences, sections or titles the doctor did not dictate (besides the corrections above).',
      '- DO NOT insert headings like "TECHNIQUE", "FINDINGS", "IMPRESSION", "INDICATION" if the doctor did not say them.',
      '- DO NOT change the order of sentences.',
      '- DO NOT summarise, shorten or condense anything.',
      '- DO NOT expand, paraphrase or "improve" the language.',
      '- DO NOT substitute synonyms: if they said "shows" keep "shows", not "demonstrates".',
      '- DO NOT add closing remarks, recommendations or clinical suggestions.',
      '- DO NOT convert lists to prose or prose to lists.',
      '- Preserve the dictated style exactly (prose or concise as given).',
      '- Keep informal connectives ("however", "so", "also") as dictated.',
      'When in doubt whether to correct something NOT listed above, do NOT correct it.',
      'Return ONLY the corrected text — no commentary, no headings, no notes.',
    ].join(' ');
    await streamChatCompletion({
      model: 'gpt-4o-mini',
      messages: [{ role: 'system', content: system }, { role: 'user', content: rawText }],
      temperature: 0,
      max_tokens: Math.min(2000, Math.max(200, Math.ceil(rawText.length / 2))),
    }, onDelta);
  }

  /** Extracts modality + district from user input, to constrain Magic to
   *  describe ONLY that district (avoids cross-region template leakage). */
  function extractExamFocus(text) {
    if (!text) return null;
    const t = text.toLowerCase();
    const MODALITY_RX = [
      [/\bcta\b/, 'CTA'], [/\bmra\b/, 'MRA'],
      [/\b(ct|cat\s*scan)\b/, 'CT'],
      [/\b(mri|mr)\b/, 'MRI'],
      [/\b(x[\s-]?ray|radiograph)\b/, 'X-ray'],
      [/\b(ultrasound|us|sonograph)\b/, 'Ultrasound'],
      [/\b(mammogr)/, 'Mammography'],
      [/\bpet\b/, 'PET'],
    ];
    const DISTRICT_RX = [
      [/\bbrain\b/, 'brain'], [/\bhead\b/, 'head'],
      [/\b(cervical\s+spine|c-spine)\b/, 'cervical spine'],
      [/\b(thoracic\s+spine|t-spine)\b/, 'thoracic spine'],
      [/\b(lumbar\s+spine|l-spine|lumbosacral)\b/, 'lumbar spine'],
      [/\b(spine|vertebr)/, 'spine'],
      [/\b(neck)\b/, 'neck'],
      [/\bthyroid\b/, 'thyroid'],
      [/\b(breast|mamm)/, 'breast'],
      [/\b(chest|thorax)\b/, 'chest'],
      [/\b(lung|pulmonary)\b/, 'lungs'],
      [/\babdomen\b/, 'abdomen'],
      [/\bliver\b/, 'liver'], [/\bgallbladder\b/, 'biliary'],
      [/\bkidney\b/, 'kidneys'], [/\bprostate\b/, 'prostate'],
      [/\bpelvi/, 'pelvis'], [/\buterus\b/, 'uterus'],
      [/\bshoulder\b/, 'shoulder'], [/\bknee\b/, 'knee'],
      [/\b(hip|coxo)/, 'hip'], [/\b(ankle|foot)\b/, 'ankle'],
      [/\b(wrist|hand)\b/, 'wrist'], [/\belbow\b/, 'elbow'],
    ];
    let modality = null, district = null;
    for (const [rx, label] of MODALITY_RX) { if (rx.test(t)) { modality = label; break; } }
    for (const [rx, label] of DISTRICT_RX) { if (rx.test(t)) { district = label; break; } }
    if (!modality && !district) return null;
    return { modality, district };
  }

  async function aiGenerateMagicDraft(input, onDelta) {
    const styleHint = writingStyle === 'synth' ? 'Use concise style, clear sections, lists when useful.' : 'Use prose medical English, complete paragraphs.';
    const focus = extractExamFocus(input);
    const focusLine = focus
      ? `EXAM FOCUS: ${focus.modality || '(modality not specified)'} — ${focus.district || '(district not specified)'}. The report will describe ONLY this exam on this district. NEVER describe other districts (e.g. if district = "thyroid", do NOT mention liver/abdomen/kidneys/other). If the distillate contains templates of other regions, IGNORE them completely.`
      : `Deduce modality and district from the indication, and describe ONLY that district/modality.`;
    const sexLine =
      patientSex === 'M' ? 'PATIENT SEX: Male. Use "the patient" with male grammar. Include prostate and seminal vesicles when pertinent. NEVER describe uterus, ovaries, female breast, obstetric parameters.' :
      patientSex === 'F' ? 'PATIENT SEX: Female. Use "the patient" with female references. Include uterus, adnexa and female breast when pertinent. NEVER describe prostate or seminal vesicles.' :
      'PATIENT SEX: not specified. Use neutral forms. Do not describe sex-specific organs (prostate, uterus, ovaries) unless explicitly named in the indication.';
    // Always include the doctor's distillate (MAGIC_PDF_TEXT) in the system
    // prompt as a binding style/template reference, regardless of what is in
    // the editor. That way Magic stays "personal" to the radiologist instead
    // of drifting into random outputs.
    const distillate = (typeof MAGIC_PDF_TEXT === 'string' ? MAGIC_PDF_TEXT : '').trim();
    const systemLines = [
      'You are a radiologist writing in English. The user provides ALWAYS a brief INDICATION (e.g. "Brain CT negative", "Thyroid US negative", "Chest X-ray with right basal pneumonia"). It is NEVER a finished report — it is just a shorthand command. You MUST expand it into a complete radiology report.',
      '',
      focusLine,
      '',
      sexLine,
      '',
      'MANDATORY STRUCTURE — ONLY 2 SECTIONS, IN THIS ORDER, EACH ON ITS OWN LINE, UPPERCASE TITLE:',
      '',
      'TECHNIQUE',
      '[technical description: modality, anatomic region, IV contrast if any, planes/sequences/phases if any]',
      '',
      'FINDINGS',
      '[systematic and DETAILED description of findings for each pertinent district/structure; if the indication says "negative"/"normal"/"unremarkable" → describe each district as normal with standard phrases; if the indication contains a pathological finding (e.g. "chronic small-vessel disease", "chronic thyroiditis") → DESCRIBE IT inside FINDINGS, NEVER in conclusions; describe the other districts as normal too]',
      '',
      'ABSOLUTE RULES:',
      '- DO NOT add an IMPRESSION / CONCLUSIONS / SUMMARY section. Magic handles ONLY TECHNIQUE + FINDINGS. The impression is written by the doctor in a separate step via the dedicated "AI Impression" button.',
      '- Every finding mentioned in the indication (including chronic ones) MUST be described in FINDINGS with clinically coherent phrasing. NEVER name a finding only in conclusions: if it is not in FINDINGS, it does not exist.',
      '- You MUST always generate both sections TECHNIQUE + FINDINGS. Never just one.',
      '- The user input is ALWAYS a shorthand command, NEVER a finished report. Expand it, do not integrate.',
      '- Do NOT invent pathological findings that are not indicated. Use "no focal abnormalities of note", "within normal limits for age" for normal districts.',
      '- SPINE EXAMS (MRI/CT/X-ray): MANDATORY level-by-level description of ALL intervertebral discs in the examined region, even if normal. Lumbar spine → T12-L1, L1-L2, L2-L3, L3-L4, L4-L5, L5-S1. Cervical spine → C2-C3, C3-C4, C4-C5, C5-C6, C6-C7, C7-T1. Thoracic spine → all levels T1-T2 … T11-T12. For each level: disc hydration and height, any protrusion/herniation with direction, nerve-root impingement, lateral recesses and neural foramina. For normal levels use phrasing like "disc of regular height and hydration, no disc protrusion, lateral recesses and neural foramina patent". Always include vertebral bodies, spinal cord (for MRI), epidural space and — for lumbar — conus medullaris and cauda equina.',
      '- Impeccable punctuation, terminology, spelling.',
      '- ' + styleHint,
    ];
    if (distillate) {
      systemLines.push(
        '',
        'DOCTOR STYLE & TEMPLATES (binding for STYLE, not for the district):',
        'Below is a collection of this radiologist\'s typical reports. From it you MUST take ONLY:',
        '- the same section structure (titles and order);',
        '- the same medical lexicon and recurring formulas;',
        '- the same level of detail and brevity;',
        '- the same abbreviations and conventions (e.g. IV contrast wording);',
        '- the same tone (prose vs concise) consistent with what you find.',
        '',
        'CRITICAL RULE ON THE DISTILLATE:',
        'The distillate may contain templates of MANY different exams (e.g. abdominal US, thyroid US, brain CT, etc.). USE ONLY the template that matches EXACTLY the EXAM FOCUS above. If FOCUS = "Ultrasound thyroid" → use ONLY the thyroid-US template (if present) and IGNORE abdominal-US / CT / MRI / other templates. If no exact match, build the report applying just the general STYLE of the distillate, but cover ONLY the district of the FOCUS.',
        'NEVER copy phrases/items from templates of other districts, even if they appear frequently in the distillate.',
        'DO NOT invent findings that are inconsistent with the distillate.',
        '',
        '=== DISTILLATE START ===',
        distillate,
        '=== DISTILLATE END ===',
      );
    }
    systemLines.push(
      '',
      'EXAMPLES (structure ONLY TECHNIQUE + FINDINGS, no IMPRESSION):',
      'Input "thyroid US chronic thyroiditis" → TECHNIQUE: thyroid ultrasound with high-frequency linear probe. FINDINGS: thyroid in situ, normal volume; HETEROGENEOUS echotexture consistent with chronic thyroiditis, with mild diffuse increase of intraparenchymal color-Doppler signal. Right and left lobes, isthmus without focal lesions. Neck nodal stations free. (END — no impression)',
      'Input "brain CT chronic small-vessel disease trauma negative" → TECHNIQUE: brain CT without contrast in emergency setting. FINDINGS: no hyperdense hemorrhage nor post-traumatic parenchymal alteration. Periventricular and centrum semiovale hypodense areas bilaterally, compatible with chronic small-vessel disease. Ventricular system in axis, normal in size. No skull fractures. (END — no impression)',
      'Input "complete abdominal US" → TECHNIQUE + FINDINGS for all abdominal districts (liver, biliary, pancreas, spleen, kidneys, bladder, aorta). No thyroid. No impression.',
      'Input "lumbar spine MRI negative" → TECHNIQUE: MRI of the lumbar spine with sag T1, sag T2, sag STIR, ax T2 sequences. FINDINGS: vertebral bodies of preserved morphology and signal, no focal bone lesions. Conus medullaris in situ at L1 level, of regular morphology and signal. Cauda equina regularly arranged. Epidural space free. Disc T12-L1: of regular height and hydration, no protrusion, recesses and foramina patent. Disc L1-L2: regular. Disc L2-L3: regular. Disc L3-L4: regular. Disc L4-L5: regular. Disc L5-S1: regular. Facet joints within normal limits. Symmetric paravertebral musculature. (END — no impression)',
      '',
      'Output: ONLY TECHNIQUE + FINDINGS, no IMPRESSION, no commentary, no preamble.',
    );
    const system = systemLines.join('\n');

    await streamChatCompletion({
      model: 'gpt-4o-mini',
      messages: [{ role: 'system', content: system }, { role: 'user', content: input || 'Generic radiologic examination.' }],
      temperature: 0.3,
      // 1200 gives headroom for level-by-level spine reports (6 lumbar
      // discs + vertebral bodies + cord + cauda) without overshoot.
      max_tokens: 1200,
      top_p: 0.9,
    }, onDelta);
  }

  async function aiGenerateConclusions(bodyText, onDelta) {
    const system = [
      'You are a radiologist. Given the BODY of the report, write only the IMPRESSION section in medical English, concise and clinically consistent with the findings.',
      'DO NOT repeat the body, DO NOT invent findings.',
      'Output: text starting with "IMPRESSION:" on a single line, then content.',
    ].join(' ');
    await streamChatCompletion({
      model: 'gpt-4o-mini',
      messages: [{ role: 'system', content: system }, { role: 'user', content: bodyText }],
      temperature: 0.3,
      max_tokens: 250,
      top_p: 0.9,
    }, onDelta);
  }

  async function aiRewriteSelection(selectedText, instruction, onDelta) {
    const system = [
      'You are a radiologist. Rewrite the provided text per the instruction, keeping correct medical English.',
      'DO NOT add findings not present. Preserve clinical meaning.',
      'Output: ONLY the rewritten text.',
    ].join(' ');
    await streamChatCompletion({
      model: 'gpt-4o-mini',
      messages: [{ role: 'system', content: system }, { role: 'user', content: 'INSTRUCTION: ' + instruction + '\n\nTEXT:\n' + selectedText }],
      temperature: 0.3,
      max_tokens: Math.min(1500, Math.max(200, Math.ceil(selectedText.length / 2))),
    }, onDelta);
  }

  async function streamChatCompletion(payload, onDelta) {
    const headers = { 'Content-Type': 'application/json' };
    if (PROXY_AUTH && PROXY_AUTH !== 'session') headers['Authorization'] = 'Bearer ' + PROXY_AUTH;
    const r = await fetch(PROXY_URL + '/v1/chat/completions', {
      method: 'POST',
      headers,
      body: JSON.stringify(Object.assign({}, payload, { stream: true })),
    });
    if (!r.ok || !r.body) { const txt = await r.text().catch(() => ''); throw new Error('AI ' + r.status + ': ' + txt.slice(0, 200)); }
    const reader = r.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      let idx;
      while ((idx = buffer.indexOf('\n')) !== -1) {
        const line = buffer.slice(0, idx).trim();
        buffer = buffer.slice(idx + 1);
        if (!line || !line.startsWith('data:')) continue;
        const data = line.slice(5).trim();
        if (data === '[DONE]') return;
        try {
          const json = JSON.parse(data);
          const delta = (json.choices && json.choices[0] && json.choices[0].delta && json.choices[0].delta.content) ||
                        (json.choices && json.choices[0] && json.choices[0].message && json.choices[0].message.content) || '';
          if (delta) onDelta(delta);
        } catch (e) {}
      }
    }
  }

  function openPreview(kind) { aiPreviewKind.textContent = kind || 'AI proposal'; aiPreviewBody.textContent = ''; aiPreview.classList.add('visible'); aiPreview.scrollIntoView({ behavior: 'smooth', block: 'center' }); }

  let lastPreviewMode = null;

    const text = aiPreviewBody.textContent.trim();
    if (!text) return closePreview();
    if (lastPreviewMode === 'replace') insertIntoEditor(text, { replaceSelection: true, asBlock: false });
    else insertIntoEditor(text, { replaceSelection: false, asBlock: true });
    closePreview();
    showToast('Inserted into report');
  });

  $('btnMagic').addEventListener('click', async () => {
    // Magic input is ALWAYS the editor text (indication / notes).
    // The doctor's distillate is not used as "input": it is already included
    // in the system prompt of aiGenerateMagicDraft as binding style.
    const input = getEditorText();
    if (!input.trim()) { showToast('Write an indication first', 'err'); return; }
    saveSelection();
    openPreview('Magic — draft report');
    setStatus('Generating report…');
    let buffer = '';
    let lastRender = 0;
    lastPreviewMode = 'append';
    try {
      await aiGenerateMagicDraft(input, (delta) => {
        buffer += delta;
        const now = Date.now();
        if (now - lastRender > 16) { aiPreviewBody.textContent = buffer; aiPreviewBody.appendChild(makeCursor()); aiPreviewBody.scrollTop = aiPreviewBody.scrollHeight; lastRender = now; }
      });
      aiPreviewBody.textContent = buffer.trim();
      setStatus('Draft ready', 'ok');
      setTimeout(() => setStatus(''), 1200);

    } catch (err) { setStatus('Rewrite failed: ' + err.message, 'err'); setTimeout(() => setStatus(''), 2500); closePreview(); }
  });
  rewriteModal.addEventListener('click', (e) => { if (e.target === rewriteModal) rewriteModal.classList.remove('visible'); });

  if (typeof INCLUDE_DICTATION !== 'undefined' && !INCLUDE_DICTATION) btnRec.style.display = 'none';

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      if (rewriteModal.classList.contains('visible')) rewriteModal.classList.remove('visible');
      else if (aiPreview.classList.contains('visible')) closePreview();
    }
    if (e.target === editor) setTimeout(saveSelection, 0);
  });
  editor.addEventListener('mouseup', () => saveSelection());
  editor.addEventListener('keyup', () => saveSelection());
  // Esposta per la checklist module:
  window.streamChatCompletion = streamChatCompletion;
  window.refertiumInsertChecklistDraft = function(text) {
    if (!editor) return;
    editor.innerHTML = '';
    insertIntoEditor(text, { replaceSelection: false, asBlock: true });
  };

  /** Dictation controller for checklist textareas (and similar). */
  window.refertiumStartDictation = async function() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      throw new Error('Microphone not available');
    }
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const candidates = ['audio/webm;codecs=opus','audio/webm','audio/ogg;codecs=opus','audio/mp4'];
    let mimeType = '';
    for (const m of candidates) {
      if (window.MediaRecorder && MediaRecorder.isTypeSupported(m)) { mimeType = m; break; }
    }
    const mr = mimeType ? new MediaRecorder(stream, { mimeType }) : new MediaRecorder(stream);
    const chunks = [];
    const realMime = mr.mimeType || mimeType || 'audio/webm';
    mr.ondataavailable = (e) => { if (e.data && e.data.size) chunks.push(e.data); };
    mr.start(250);
    let stopped = false;
    return {
      stop: () => new Promise((resolve, reject) => {
        if (stopped) return resolve('');
        stopped = true;
        mr.onstop = async () => {
          try { stream.getTracks().forEach((t) => t.stop()); } catch {}
          try {
            const blob = new Blob(chunks, { type: realMime });
            if (blob.size < 1000) return resolve('');
            const raw = await transcribeBlobDirect(blob);
            if (!raw) return resolve('');
            const corrected = applyMedicalCorrections(raw);
            const pre = preprocessDictation(corrected);
            let buffer = '';
            await cleanupDictationAI(pre, (delta) => { buffer += delta; });
            resolve(buffer.trim());
          } catch (err) { reject(err); }
        };
        try { mr.stop(); } catch (e) { reject(e); }
      }),
      cancel: () => {
        if (stopped) return;
        stopped = true;
        try { mr.stop(); } catch {}
        try { stream.getTracks().forEach((t) => t.stop()); } catch {}
      },
    };
  };
  

})();

/* ============================================================
   CHECKLIST WIRE — drawer logic
   ============================================================ */
(function wireChecklist() {
  'use strict';
  const STATE_KEY = 'refertium_checklist_state_v2';

  let cstate = { templateId: null, voci: {} };

  function $(id) { return document.getElementById(id); }
  const toggleBtn  = $('clToggle');
  const drawer     = $('clDrawer');
  const backdrop   = $('clBackdrop');
  const closeBtn   = $('clCloseBtn');
  const select     = $('clTemplateSelect');
  const body       = $('clBody');
  const progress   = $('clProgress');
  const modality   = $('clModality');
  const resetBtn   = $('clResetBtn');
  const generateBtn= $('clGenerateBtn');

  if (!toggleBtn || !drawer) return; // markup non inserito

  // ─── Persistence ─────────────────────────────────────────
  try {
    const raw = sessionStorage.getItem(STATE_KEY);
    if (raw) cstate = JSON.parse(raw);
  } catch { cstate = { templateId: null, voci: {} }; }
  if (!cstate.voci) cstate.voci = {};

  function saveState() {
    try { sessionStorage.setItem(STATE_KEY, JSON.stringify(cstate)); } catch {}
  }

  // ─── Build dropdown options ──────────────────────────────
  const templates = window.CHECKLIST_TEMPLATES || {};
  Object.keys(templates).forEach((id) => {
    const opt = document.createElement('option');
    opt.value = id;
    opt.textContent = templates[id].label || id;
    select.appendChild(opt);
  });

  // ─── Open / close drawer ─────────────────────────────────
  function openDrawer() {
    drawer.classList.add('open');
    backdrop.classList.add('open');
    toggleBtn.classList.add('active');
    if (cstate.templateId) {
      select.value = cstate.templateId;
      renderTemplate(cstate.templateId);
    }
  }
  function closeDrawer() {
    drawer.classList.remove('open');
    backdrop.classList.remove('open');
    toggleBtn.classList.remove('active');
  }
  toggleBtn.addEventListener('click', () => {
    if (drawer.classList.contains('open')) closeDrawer();
    else openDrawer();
  });
  closeBtn.addEventListener('click', closeDrawer);
  backdrop.addEventListener('click', closeDrawer);

  // ─── Template selection ──────────────────────────────────
  select.addEventListener('change', () => {
    const id = select.value;
    if (id && (!cstate.templateId || cstate.templateId !== id)) {
      cstate = { templateId: id, voci: {} };
      saveState();
    } else if (!id) {
      cstate = { templateId: null, voci: {} };
      saveState();
    }
    renderTemplate(id);
  });

  // ─── Render ──────────────────────────────────────────────
  function renderTemplate(id) {
    if (!id) {
      body.innerHTML = `
        <div class="cl-empty">
          Seleziona un esame dall'elenco qui sopra.<br><br>
          Per ogni voce premi <strong>Normale</strong> se il reperto è regolare,
          oppure <strong>Nota</strong> e scrivi la descrizione del reperto patologico.
        </div>`;
      progress.textContent = '';
      modality.style.display = 'none';
      generateBtn.disabled = true;
      return;
    }
    const tpl = templates[id];
    if (!tpl) return;
    modality.textContent = tpl.modalita || '';
    modality.style.display = tpl.modalita ? 'inline-flex' : 'none';
    body.innerHTML = '';
    tpl.voci.forEach((voce) => {
      body.appendChild(renderVoce(voce));
    });
    updateProgress();
  }

  function renderVoce(voce) {
    const v = cstate.voci[voce.id] || { state: null, text: '' };
    const item = document.createElement('div');
    item.className = 'cl-item' + (v.state === 'normal' ? ' is-normal' : v.state === 'prompt' ? ' is-prompt' : '');

    const head = document.createElement('div');
    head.className = 'cl-item-head';

    const name = document.createElement('span');
    name.className = 'cl-item-name';
    name.textContent = voce.nome;
    head.appendChild(name);

    const btnNormal = document.createElement('button');
    btnNormal.className = 'cl-state-btn' + (v.state === 'normal' ? ' active normal' : '');
    btnNormal.type = 'button';
    btnNormal.textContent = 'Normale';
    btnNormal.addEventListener('click', () => {
      cstate.voci[voce.id] = { state: v.state === 'normal' ? null : 'normal', text: '' };
      saveState();
      // re-render full item per stato visivo
      const next = renderVoce(voce);
      item.replaceWith(next);
      updateProgress();
    });
    head.appendChild(btnNormal);

    const btnPrompt = document.createElement('button');
    btnPrompt.className = 'cl-state-btn' + (v.state === 'prompt' ? ' active prompt' : '');
    btnPrompt.type = 'button';
    btnPrompt.textContent = 'Nota';
    btnPrompt.addEventListener('click', () => {
      cstate.voci[voce.id] = { state: v.state === 'prompt' ? null : 'prompt', text: v.text || '' };
      saveState();
      const next = renderVoce(voce);
      item.replaceWith(next);
      updateProgress();
    });
    head.appendChild(btnPrompt);

    item.appendChild(head);

    if (v.state === 'normal') {
      const text = document.createElement('div');
      text.className = 'cl-item-text';
      text.textContent = voce.normale;
      item.appendChild(text);
    } else if (v.state === 'prompt') {
      const wrap = document.createElement('div');
      wrap.className = 'cl-note-wrap';

      const ta = document.createElement('textarea');
      ta.className = 'cl-item-note';
      ta.value = v.text || '';
      // Auto-grow: ridimensiona in altezza ad ogni input (e all'inizio se c'è
      // del testo salvato da una sessione precedente)
      const autoGrow = () => {
        ta.style.height = 'auto';
        ta.style.height = ta.scrollHeight + 'px';
      };
      ta.addEventListener('input', () => {
        cstate.voci[voce.id] = { state: 'prompt', text: ta.value };
        saveState();
        updateProgress();
        autoGrow();
      });
      wrap.appendChild(ta);
      // Misura iniziale al prossimo frame (a quel punto la textarea è nel DOM)
      requestAnimationFrame(autoGrow);

      // Bottone microfono dentro la textarea (riusa refertiumStartDictation)
      const micBtn = document.createElement('button');
      micBtn.type = 'button';
      micBtn.className = 'cl-mic-btn';
      micBtn.title = 'Detta nel campo';
      const micSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>';
      micBtn.innerHTML = micSvg;
      let dictCtrl = null;
      let busy = false;
      micBtn.addEventListener('click', async () => {
        if (busy) return;
        if (typeof window.refertiumStartDictation !== 'function') {
          console.warn('refertiumStartDictation non esposta dal template');
          return;
        }
        if (dictCtrl) {
          // Stop registrazione + processa
          busy = true;
          micBtn.disabled = true;
          micBtn.innerHTML = '<span style="font-size:10px">…</span>';
          try {
            const text = await dictCtrl.stop();
            dictCtrl = null;
            if (text) {
              const cur = ta.value.trim();
              ta.value = cur ? (cur + ' ' + text) : text;
              cstate.voci[voce.id] = { state: 'prompt', text: ta.value };
              saveState();
              updateProgress();
              ta.focus();
            }
          } catch (e) {
            console.error('Dictation error:', e);
            dictCtrl = null;
          } finally {
            busy = false;
            micBtn.disabled = false;
            micBtn.classList.remove('rec');
            micBtn.innerHTML = micSvg;
          }
        } else {
          // Avvia registrazione
          try {
            dictCtrl = await window.refertiumStartDictation();
            micBtn.classList.add('rec');
            micBtn.innerHTML = '<span class="rec-dot-mic"></span><span>STOP</span>';
          } catch (e) {
            console.error('Mic error:', e);
            dictCtrl = null;
          }
        }
      });
      wrap.appendChild(micBtn);

      item.appendChild(wrap);
    }
    return item;
  }

  function updateProgress() {
    const tpl = cstate.templateId && templates[cstate.templateId];
    if (!tpl) { progress.textContent = ''; generateBtn.disabled = true; return; }
    const total = tpl.voci.length;
    const compiled = tpl.voci.filter((v) => {
      const s = cstate.voci[v.id];
      return s && (s.state === 'normal' || (s.state === 'prompt' && s.text && s.text.trim()));
    }).length;
    progress.textContent = compiled + ' / ' + total + ' voci';
    generateBtn.disabled = compiled === 0;
  }

  // ─── Reset ───────────────────────────────────────────────
  resetBtn.addEventListener('click', () => {
    cstate = { templateId: cstate.templateId, voci: {} };
    saveState();
    if (cstate.templateId) renderTemplate(cstate.templateId);
  });

  // ─── Generate report via AI ──────────────────────────────
  generateBtn.addEventListener('click', async () => {
    const tpl = cstate.templateId && templates[cstate.templateId];
    if (!tpl) return;
    const voci = tpl.voci.map((v) => {
      const s = cstate.voci[v.id];
      if (!s || !s.state) return null;
      if (s.state === 'normal') return { nome: v.nome, normale: v.normale };
      if (s.state === 'prompt' && s.text && s.text.trim()) {
        return { nome: v.nome, nota: s.text.trim() };
      }
      return null;
    }).filter(Boolean);
    if (!voci.length) return;

    generateBtn.disabled = true;
    const oldLabel = generateBtn.innerHTML;
    generateBtn.innerHTML = '⏳ Genero…';

    try {
      const draft = await generateReportFromChecklist(tpl, voci);
      // Inserisci nel editor — usa la funzione del template host se disponibile
      if (typeof window.refertiumInsertChecklistDraft === 'function') {
        window.refertiumInsertChecklistDraft(draft);
      } else {
        const editor = document.getElementById('editor');
        if (editor) {
          editor.innerHTML = '';
          draft.split(/\n{2,}/).forEach((para) => {
            const p = document.createElement('p');
            const lines = para.split('\n');
            lines.forEach((line, idx) => {
              if (idx > 0) p.appendChild(document.createElement('br'));
              p.appendChild(document.createTextNode(line));
            });
            editor.appendChild(p);
          });
        }
      }
      closeDrawer();
    } catch (err) {
      console.error('checklist generate failed:', err);
      alert('Errore generazione: ' + (err.message || 'sconosciuto'));
    } finally {
      generateBtn.innerHTML = oldLabel;
      updateProgress();
    }
  });

  // Riempie il riepilogo voci e chiama l'AI per ricomporre un referto continuo.
  async function generateReportFromChecklist(tpl, voci) {
    if (typeof window.streamChatCompletion !== 'function') {
      throw new Error('streamChatCompletion non disponibile');
    }
    const lines = voci.map((v) => {
      if (v.normale) return '- ' + v.nome + ': [NORMALE] ' + v.normale;
      return '- ' + v.nome + ': [REPERTO] ' + v.nota;
    }).join('\n');

    const system = [
      'Sei un radiologo esperto. Hai una lista di voci di una checklist strutturata',
      'per l\'esame "' + tpl.label + '" (modalità ' + (tpl.modalita || 'radiologica') + ').',
      'Per ciascuna voce ho indicato se è NORMALE (con la frase standard già pronta) o',
      'se ho aggiunto un REPERTO patologico (descritto in modo informale).',
      'Componi un referto radiologico continuo in italiano, ben strutturato, con:',
      '- una sezione REPERTI che integra le voci nell\'ordine dato, riformulando',
      '  in prosa medica corretta (mantieni i contenuti, non inventare nulla);',
      '- una sezione CONCLUSIONI sintetica, coerente con i reperti.',
      'Mantieni i numeri, le misure e i termini medici esatti. Per le voci NORMALI usa',
      'la frase standard fornita (eventualmente accorciata). Per i REPERTI espandi in',
      'linguaggio radiologico professionale.',
      'Output: SOLO il referto, niente commenti.',
    ].join(' ');

    let buffer = '';
    await window.streamChatCompletion({
      model: 'gpt-4o-mini',
      messages: [
        { role: 'system', content: system },
        { role: 'user', content: lines },
      ],
      temperature: 0.3,
    }, (delta) => { buffer += delta; });
    return buffer.trim();
  }

  // Esci col tasto Esc
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && drawer.classList.contains('open')) closeDrawer();
  });

})();

</script>
